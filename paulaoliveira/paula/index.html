<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Paula Oliveira Parfum · Perfumista independente</title>
<meta name="description" content="Perfumes escritos como personagens. Lotes com dia e hora marcados.">
<!-- Prévia: fora do Google. Tirar quando virar o site oficial dela. -->
<meta name="robots" content="noindex, nofollow">

<meta property="og:url" content="https://rottaguide.com/paulaoliveira/paula/">
<meta property="og:image" content="https://rottaguide.com/paulaoliveira/paula/compartilhar.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://acdn-us.mitiendanube.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Gloock&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root{--barra:30px;--ink:#17101A;--papel:#F5EEF2;--t:#EDE6A0;--f:#123A2D;--titulo:'Gloock',Georgia,serif;--cartaz:'League Gothic','Arial Narrow',sans-serif;--texto:'EB Garamond',Georgia,serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--ink);color:var(--papel);font:400 1.2rem/1.45 var(--texto);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.pular{position:fixed;left:12px;top:-80px;z-index:90;background:#fff;color:#000;padding:10px 14px}
.pular:focus{top:40px}

/* faixa de prévia */
.previa{position:fixed;inset:0 0 auto 0;height:var(--barra);z-index:70;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font:400 15px/1 var(--texto);padding:0 44px;white-space:nowrap;overflow:hidden}
.previa span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.previa button{position:absolute;right:0;top:0;height:30px;width:44px;font-size:18px}
@media(max-width:640px){.previa{font-size:13px;justify-content:flex-start;padding:0 44px 0 12px}}

/* cabeçalho */
.topo{position:fixed;left:0;right:0;top:var(--barra);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:10px clamp(14px,3vw,40px);color:var(--t);transition:color .3s,background .3s}
.topo.solido{background:color-mix(in srgb,var(--fundo-topo,#17101A) 95%,transparent);color:var(--tinta-topo,#F5EEF2)}
.marca{font:400 clamp(21px,2vw,27px)/1 var(--titulo);text-decoration:none}
.menu{display:flex;gap:clamp(16px,2.6vw,38px);font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}
.menu a{text-decoration:none;padding:12px 0;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/0 2px no-repeat;transition:background-size .3s}
.menu a:hover{background-size:100% 2px}
.saco,.lnk{display:inline-flex;align-items:center;font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;min-height:44px;padding:0 2px;text-decoration:none}
.abre-menu{display:none}
@media(max-width:1180px){.menu{display:none}.abre-menu{display:inline-flex}}

/* cartaz */
#cartazes{position:relative}
.cartaz{position:sticky;top:0;height:100vh;height:100svh;min-height:600px;background:var(--f);color:var(--t);overflow:hidden;display:flex;flex-direction:column;padding:calc(var(--barra) + 68px) clamp(14px,3vw,40px) calc(16px + var(--tab));will-change:transform}
.cartaz::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--sombra,0);pointer-events:none;z-index:5}
.c-topo{display:flex;justify-content:space-between;align-items:baseline;font:400 clamp(21px,1.9vw,27px)/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}
.selo-e{display:inline-block;background:var(--t);color:var(--f);padding:5px 9px 3px}
.c-palco{position:relative;flex:1 1 0;min-height:0;display:block;text-decoration:none;margin-top:6px}
.c-nome{position:absolute;left:0;right:0;top:0;font:400 100px/.84 var(--titulo);text-align:center;letter-spacing:-.012em;transform:translateX(calc(var(--e,0)*7%));user-select:none}
.ln{display:block;width:max-content;margin:0 auto;white-space:nowrap}
.c-frasco{position:absolute;left:50%;bottom:-2%;height:88%;width:auto;max-width:none;transform:translate(-50%,calc(var(--e,0)*26%)) rotate(calc(var(--e,0)*-9deg));filter:drop-shadow(0 26px 38px rgba(0,0,0,.42));transform-origin:50% 90%}
.c-baixo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin-top:10px;position:relative;z-index:3}
.c-frase{font:italic 400 clamp(21px,2vw,29px)/1.16 var(--texto);max-width:30ch}
.c-frase cite{font-style:normal;font-size:.72em;white-space:nowrap}
.c-compra{display:flex;align-items:center;gap:20px;text-align:right}
.preco{font:400 clamp(36px,3.5vw,50px)/1 var(--cartaz);letter-spacing:.02em;white-space:nowrap}
.preco small{display:block;font:400 16px/1.15 var(--texto);letter-spacing:0;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:6px 26px 3px;background:var(--t);color:var(--f);font:400 clamp(23px,2vw,28px)/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn.vazado{background:none;color:var(--t);box-shadow:inset 0 0 0 2px var(--t)}
.c-credito{margin-top:12px;padding-top:9px;border-top:1px solid color-mix(in srgb,var(--t) 45%,transparent);font:400 clamp(17px,1.32vw,20px)/1.14 var(--cartaz);letter-spacing:.075em;text-transform:uppercase;text-align:center;position:relative;z-index:3}
.c-credito i{font:italic 400 .86em/1 var(--texto);letter-spacing:0;text-transform:none;margin:0 .3em 0 .9em}
.c-credito i:first-child{margin-left:0}
.conta{font:400 1em/1 var(--cartaz)}
@media(max-width:760px){
  .cartaz{padding-top:calc(var(--barra) + 58px);padding-bottom:calc(10px + var(--tab))}
  .c-frasco{height:84%}
  .c-baixo{grid-template-columns:1fr;gap:10px}
  .c-frase{font-size:20px;max-width:none;text-align:center;background:color-mix(in srgb,var(--f) 74%,transparent)}
  .c-compra{justify-content:space-between;text-align:left}
  .c-compra .btn{flex:1;padding:6px 10px 3px}
  .c-credito{font-size:15px;letter-spacing:.05em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:9px;padding-top:7px}
  .c-topo{font-size:20px}
}
@media(max-height:680px){.c-credito{display:none}}

/* programação */
.secao{position:relative;z-index:20;background:var(--ink);padding:clamp(64px,9vw,130px) clamp(14px,3vw,40px)}
.sec-t{font:400 clamp(58px,10.5vw,170px)/.9 var(--titulo);letter-spacing:-.012em}
.sec-p{max-width:40ch;margin-top:18px;font-size:clamp(21px,1.8vw,25px);line-height:1.25}
.chip{min-height:46px;padding:5px 16px 2px;font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px #ffffff55}
.chip[aria-pressed=true]{background:var(--papel);color:var(--ink);box-shadow:none}
.mural{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,14px)}
@media(max-width:1000px){.mural{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.mural{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{--n:6;position:relative;display:flex;flex-direction:column;aspect-ratio:3/4.35;background:var(--f);color:var(--t);overflow:hidden;text-decoration:none;container-type:inline-size;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mini h3{font:400 min(30cqw,calc(90cqw/(var(--n)*.62)))/.92 var(--titulo);padding:9cqw 5cqw 0;text-align:center;position:relative;z-index:1}
.mini .im{position:absolute;left:0;right:0;bottom:11%;top:24%;display:grid;place-items:center}
.mini .im img{height:100%;width:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mini:hover .im img{transform:scale(1.06) rotate(-3deg)}
.mini.foto .im{left:9%;right:9%;top:26%;bottom:15%}
.mini.foto .im img{width:100%;height:100%;object-fit:cover;filter:none}
.mini footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 5cqw 4cqw;font:400 max(19px,8cqw)/1 var(--cartaz);letter-spacing:.04em;text-transform:uppercase}
.tarja{position:absolute;left:-12%;right:-12%;top:53%;transform:rotate(-7deg);background:var(--papel);color:#111;text-align:center;font:400 max(21px,9.4cqw)/1 var(--cartaz);letter-spacing:.06em;text-transform:uppercase;padding:2.4cqw 0 1.4cqw;z-index:2}
.tarja.nova{background:var(--t);color:var(--f)}

/* quem escreve */
.quem{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:#E8E2F0;color:#20131F;position:relative;z-index:20}
.quem figure{min-height:80vh;position:relative}
.quem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.quem .tx{padding:clamp(40px,7vw,110px) clamp(18px,5vw,84px);display:flex;flex-direction:column;justify-content:center}
.quem h2{font:400 clamp(50px,6.6vw,104px)/.94 var(--titulo)}
.quem p{margin-top:22px;max-width:36ch;font-size:clamp(22px,1.9vw,27px);line-height:1.28}
.quem ul{list-style:none;padding:0;margin-top:30px}
.quem li{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:18px;border-top:1px solid #20131f33;padding:9px 0 7px;font-size:20px;align-items:baseline}
.quem li b{font:400 25px/1 var(--cartaz);letter-spacing:.04em;text-transform:uppercase}
@media(max-width:860px){.quem{grid-template-columns:minmax(0,1fr)}.quem figure{min-height:112vw}}

/* sob medida */
.sob{background:#15110D;color:#E6C98F;--t:#E6C98F;--f:#15110D;position:relative;z-index:20;padding:clamp(64px,9vw,130px) clamp(14px,3vw,40px)}
.sob h2{font:400 clamp(58px,10vw,164px)/.9 var(--titulo)}
.sob .lead{max-width:34ch;font-size:clamp(23px,2.1vw,31px);line-height:1.2;margin-top:20px;font-style:italic}
.linha{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:50px 0 34px;list-style:none;padding:0;counter-reset:p}
.linha li{counter-increment:p;border-top:2px solid #E6C98F;padding:12px 16px 0 0;font-size:20px;line-height:1.2}
.linha li::before{content:counter(p);display:block;font:400 clamp(44px,5vw,74px)/1 var(--cartaz)}
.linha b{display:block;font:400 25px/1.05 var(--cartaz);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
@media(max-width:860px){.linha{grid-template-columns:1fr}.linha li{display:grid;grid-template-columns:62px 1fr;padding:10px 0 12px}.linha li::before{grid-row:span 2}}
.sob .fim{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.dupla{display:grid;grid-template-columns:1fr 1fr;position:relative;z-index:20}
@media(max-width:860px){.dupla{grid-template-columns:minmax(0,1fr)}}
.tile{--f:#D8C97F;--t:#2B2610;background:var(--f);color:var(--t);position:relative;min-height:74vh;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,3vw,44px);overflow:hidden}
.tile img{position:absolute;inset:0 0 auto 0;width:100%;height:58%;object-fit:cover}
.tile h3{font:400 clamp(40px,4.6vw,72px)/.95 var(--titulo);position:relative}
.tile p{max-width:36ch;margin:12px 0 18px;position:relative}
.tile .btn{align-self:flex-start;position:relative}

/* elenco */
.elenco{position:relative;z-index:20;background:#F7A400;color:#2A0505;--t:#2A0505;--f:#F7A400;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px;padding:clamp(64px,9vw,130px) clamp(14px,3vw,40px);align-items:center}
.elenco h2{font:400 clamp(58px,9.4vw,152px)/.9 var(--titulo)}
.elenco ul{list-style:none;padding:0;margin:30px 0;font-size:clamp(23px,2vw,29px);line-height:1.2;max-width:30em}
.elenco li{border-top:1.5px solid #2a050555;padding:10px 0 8px}
.cel{justify-self:center;width:min(300px,76vw);aspect-ratio:9/18.6;border-radius:42px;background:#0d0a0f;padding:10px;box-shadow:0 30px 60px #0005}
.tela{width:100%;height:100%;border-radius:33px;background:#123A2D url() center/cover;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:46px}
.hora{font:400 76px/1 var(--cartaz);letter-spacing:.02em}
.dia{font-size:18px;margin-bottom:26px}
.push{width:92%;background:#ffffffe6;color:#111;border-radius:18px;padding:11px 13px;font:400 17px/1.22 var(--texto)}
.push b{display:block;font:500 15px/1.2 var(--texto);margin-bottom:2px;color:#444}
.push+.push{margin-top:8px}
@media(max-width:860px){.elenco{grid-template-columns:minmax(0,1fr)}}

/* rodapé */


/* detalhe */
.det{background:var(--f);color:var(--t);min-height:100vh}
.det-capa{position:relative;height:100svh;min-height:600px;padding:calc(var(--barra) + 66px) clamp(14px,3vw,40px) 16px;overflow:hidden;display:flex;flex-direction:column}
.det-capa .c-frasco{height:88%;bottom:-2%;view-transition-name:frasco}
.det-corpo{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,4fr);gap:clamp(24px,5vw,80px);padding:clamp(34px,5vw,70px) clamp(14px,3vw,40px);align-items:start}
.det-texto{font-size:clamp(23px,1.9vw,27px);line-height:1.34;max-width:34em}
.det-frase{font:italic 400 clamp(32px,4.2vw,62px)/1.06 var(--texto);margin-bottom:26px}
.caixa{position:sticky;top:calc(var(--barra) + 74px);box-shadow:inset 0 0 0 2px var(--t);padding:22px}
.caixa .preco{font-size:58px}
.caixa .preco small{font-size:18px}
.caixa .btn{width:100%;margin-top:16px}
.caixa p{font-size:18px;line-height:1.25;margin-top:12px}
.frete{display:flex;gap:8px;margin-top:14px}
.frete input{flex:1;min-width:0;height:48px;background:none;border:0;box-shadow:inset 0 0 0 1.5px var(--t);color:inherit;font:inherit;padding:0 12px}
.frete input::placeholder{color:inherit;opacity:.72}
.frete button{min-width:88px;font:400 21px/1 var(--cartaz);text-transform:uppercase;letter-spacing:.05em;box-shadow:inset 0 0 0 1.5px var(--t)}
.piramide{padding:0 clamp(14px,3vw,40px) clamp(40px,6vw,80px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,3vw,50px)}
.piramide div{border-top:2px solid var(--t);padding-top:10px}
.piramide h3{font:italic 400 24px/1 var(--texto)}
.piramide p{font:400 clamp(27px,2.8vw,42px)/1.04 var(--cartaz);letter-spacing:.03em;text-transform:uppercase;margin-top:8px}
@media(max-width:760px){.piramide,.det-corpo{grid-template-columns:minmax(0,1fr)}.caixa{position:static}}
.galeria{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 clamp(14px,3vw,40px) clamp(40px,5vw,70px)}
.galeria img{height:min(64vh,520px);width:auto;scroll-snap-align:center}
.voltar{font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;display:inline-block;padding:clamp(20px,3vw,34px) clamp(14px,3vw,40px)}

/* gavetas */
dialog{border:0;padding:0;color:#20131F;background:#F5EEF2;font:400 21px/1.3 var(--texto);max-width:none}
dialog::backdrop{background:#0009}
dialog#dlg{margin:auto}
dialog#dlg[open]{animation:surge .3s cubic-bezier(.2,.8,.2,1)}
dialog.gaveta[open]{animation:gaveta .34s cubic-bezier(.2,.8,.2,1)}
.modal:focus,.gav:focus{outline:none}
@keyframes surge{from{opacity:0;transform:translateY(18px)}}
@keyframes gaveta{from{transform:translateX(100%)}}
@media(max-width:560px){dialog#dlg{margin:auto 0 0;width:100%}.modal{width:100%;padding:24px 18px calc(22px + env(safe-area-inset-bottom))}dialog#dlg[open]{animation-name:lencol}}
@keyframes lencol{from{transform:translateY(100%)}}
.modal{width:min(480px,calc(100vw - 24px));margin:auto;padding:28px}
.modal h2{font:400 clamp(33px,5vw,42px)/1 var(--titulo);margin-bottom:10px;padding-right:34px}
.fechar{position:absolute;right:6px;top:6px;width:44px;height:44px;font-size:26px;line-height:1}
.campo{display:block;margin-top:13px;font-size:18px}
.campo input{display:block;width:100%;height:50px;margin-top:3px;padding:0 12px;font:inherit;border:0;box-shadow:inset 0 0 0 1.5px #20131f66;background:#fff;color:#20131F}
.op{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:18px;line-height:1.2}
.op input{width:22px;height:22px;margin-top:0;accent-color:#20131F;flex:none}
.acao{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin-top:18px;background:#20131F;color:#F5EEF2;font:400 26px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;padding-top:4px;text-decoration:none}
.miudo{font-size:16px;line-height:1.25;margin-top:10px;color:#20131Fcc}
dialog.gaveta{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(440px,100vw);padding:0}
.gav{display:flex;flex-direction:column;height:100%;padding:24px}
.gav h2{font:400 40px/1 var(--titulo)}
.itens{flex:1;overflow:auto;margin:16px 0;list-style:none;padding:0}
.itens li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-top:1px solid #20131f33;padding:9px 0}
.itens img{width:64px;height:78px;object-fit:contain}
.itens button{font-size:16px;text-decoration:underline;min-height:44px}
.tot{display:flex;justify-content:space-between;font:400 34px/1 var(--cartaz);letter-spacing:.03em}
ol.passos{padding-left:1.1em;margin-top:6px}ol.passos li{margin-top:5px}
.intro{position:fixed;inset:0;z-index:80;display:flex;pointer-events:none}
.intro i{flex:1;background:var(--c);animation:sobe .85s cubic-bezier(.76,0,.24,1) forwards;animation-delay:calc(var(--i)*65ms + .15s)}
@keyframes sobe{to{transform:translateY(-101%)}}
::view-transition-old(frasco),::view-transition-new(frasco){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}

/* ---------- v2: revisão de UX ---------- */
:root{--tab:0px;--ease:cubic-bezier(.2,.8,.2,1)}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main:focus{outline:none}
[id]{scroll-margin-top:calc(var(--barra) + 72px)}
h1,h2,h3{text-wrap:balance}
p,li,blockquote{text-wrap:pretty}
.preco,.tot,.lp .v,.qtd b,.mini footer,.sl-c{font-variant-numeric:tabular-nums}
.preco s,.mini s,.lp s{opacity:.7;font-size:.72em;margin-right:.18em}
dialog{overscroll-behavior:contain}
.btn,.acao,.chip{transition:transform .18s var(--ease),background-color .2s,color .2s,box-shadow .2s}
.btn:active,.acao:active,.chip:active{transform:scale(.97)}
.chip:hover{box-shadow:inset 0 0 0 1.5px #fff}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.direita{display:flex;gap:clamp(14px,1.6vw,26px);align-items:center}
.lnk:hover,.saco:hover{text-decoration:underline;text-underline-offset:5px}
@media(max-width:820px){.so-grande,.topo .saco{display:none}}

/* barra de atalhos do celular */
.abas{display:none}
@media(max-width:820px){
  :root{--tab:calc(60px + env(safe-area-inset-bottom))}
  .abas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;height:var(--tab);padding-bottom:env(safe-area-inset-bottom);z-index:65;background:#120C14;color:#F5EEF2;border-top:1px solid #ffffff24}
  .abas a,.abas button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:400 15.5px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;min-height:44px}
  .abas svg{width:21px;height:21px}
  .abas [aria-current=page]{color:#EDE6A0}

  body.em-detalhe .abas{display:none}
}
.bolinha{position:absolute;top:5px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#EDE6A0;color:#17101A;font:500 13px/18px var(--texto);text-align:center;letter-spacing:0}

/* índice dos cartazes */
.rail{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;font:400 19px/1 var(--cartaz);letter-spacing:.06em;transition:opacity .3s}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-height:30px;min-width:46px;padding:0 6px;text-decoration:none;opacity:.6;transition:opacity .2s}
.rail a:hover,.rail a[aria-current=true]{opacity:1}
.rail a::after{content:"";width:12px;height:2px;background:currentColor;transition:width .28s var(--ease)}
.rail a[aria-current=true]::after{width:30px}
.rail.fora{opacity:0;pointer-events:none;visibility:hidden}
@media(max-width:1000px){.rail{display:none}}

/* letreiro */
.letreiro{position:relative;z-index:20;display:block;width:100%;background:#FFDC3C;color:#17101A;overflow:hidden;padding:19px 0 15px;font:400 clamp(28px,3.3vw,46px)/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.letreiro::before,.letreiro::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 8px 4px,#17101A 2.6px,transparent 3.1px) 0 0/24px 8px repeat-x}
.letreiro::before{top:5px}.letreiro::after{bottom:5px}
.l-fita{display:inline-flex;animation:fita 52s linear infinite}
.letreiro:hover .l-fita,.letreiro[aria-pressed=true] .l-fita{animation-play-state:paused}
.l-fita>span{display:inline-block;padding-right:.6em}
.l-fita b{font-weight:400;font-family:var(--titulo);letter-spacing:0;text-transform:none;margin:0 .22em}
@keyframes fita{to{transform:translateX(-50%)}}

/* próximas sessões */
.sl-t{font:400 24px/1 var(--cartaz);letter-spacing:.06em;text-transform:uppercase;margin:38px 0 10px}
.sl{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 130px auto;align-items:center;gap:18px;background:var(--f);color:var(--t);padding:10px 10px 10px 18px;margin-top:6px}
.sl-d,.sl-l,.sl-c{font:400 22px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}
.sl-n{font:400 clamp(30px,3vw,44px)/1 var(--titulo);text-decoration:none}
.sl-n small{font:400 .5em/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;margin-left:.3em}
.sl .btn{min-height:50px}
@media(max-width:760px){.sl{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px}.sl-d{grid-column:1}.sl-n{grid-column:1}.sl-l{display:none}.sl-c{grid-column:1}.sl .btn{grid-column:2;grid-row:1/span 3}}

/* barra de filtros */
.barra-f{position:sticky;top:calc(var(--barra) + 64px);z-index:30;background:var(--ink);padding:12px 0 12px;margin-top:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin:0 calc(clamp(14px,3vw,40px)*-1);padding:2px clamp(14px,3vw,40px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start}
.sep{flex:none;width:1px;background:#ffffff33;margin:6px 5px}
.sub-f{display:flex;align-items:center;gap:18px;margin-top:10px;font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}
.sub-f .res{margin-right:auto;white-space:nowrap}
.sub-f select{background:#17101A;color:var(--papel);border:0;box-shadow:inset 0 0 0 1.5px #ffffff55;height:44px;padding:0 10px;font:inherit;letter-spacing:.05em;text-transform:uppercase}
.vista{display:flex}
.vista button{min-height:44px;padding:2px 12px 0;box-shadow:inset 0 0 0 1.5px #ffffff55;font:inherit;letter-spacing:.05em;text-transform:uppercase}
.vista button[aria-pressed=true]{background:var(--papel);color:var(--ink)}
@media(max-width:560px){.sub-f{gap:8px;font-size:19px}.sub-f select{max-width:108px;padding:0 6px}.vista button{padding:2px 9px 0}}
@media(max-width:560px){.sec-t{font-size:15.2vw}}
@media(max-width:380px){.c-topo{font-size:17px!important}.selo-e{white-space:nowrap}.sub-f{flex-wrap:wrap}.sub-f .res{width:100%}.quem li{grid-template-columns:minmax(0,1fr)}.direita{gap:8px}}
.vazio{padding:40px 0;font-size:24px}
.vazio button{text-decoration:underline;font-size:24px;min-height:44px}

/* cartões do mural */
.mini .cobre{position:absolute;inset:0;z-index:3}
.mini .mais{position:absolute;right:4cqw;bottom:15cqw;z-index:4;width:44px;height:44px;display:grid;place-items:center;background:var(--t);color:var(--f);border-radius:50%;transition:transform .2s var(--ease)}
.mini .mais svg{width:20px;height:20px}
.mini .mais:hover{transform:scale(1.1)}
.mini::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,30%),#ffffff33,transparent 68%);opacity:0;transition:opacity .25s}
@media(hover:hover) and (pointer:fine){
  .mini{transform-style:preserve-3d}
  .mini:hover{transform:perspective(900px) rotateX(calc(var(--ry,0)*1deg)) rotateY(calc(var(--rx,0)*1deg)) translateY(-6px)}
  .mini:hover::after{opacity:1}
}
.js-rev .mini:not(.vis){opacity:0}
.mini.vis{animation:entra .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes entra{from{opacity:0;transform:translateY(28px)}}

/* lista */
.lista{list-style:none;padding:0;border-top:1px solid #ffffff33}
.lp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) 80px 180px 130px;gap:16px;align-items:center;padding:13px 10px 9px;text-decoration:none;border-bottom:1px solid #ffffff33;transition:background-color .18s,color .18s}
.lp:hover,.lp:focus-visible{background:var(--f);color:var(--t)}
.lp .n{font:400 clamp(28px,3.2vw,48px)/1 var(--titulo)}
.lp .f,.lp .st,.lp .m,.lp .v{font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}
.lp .v{text-align:right}
.lp img{display:none}
@media(max-width:760px){.lp{grid-template-columns:48px minmax(0,1fr) auto;gap:2px 12px;padding:9px 2px 7px}.lp img{display:block;width:48px;height:62px;object-fit:contain;grid-row:span 2}.lp .n{font-size:27px;align-self:end}.lp .f,.lp .m{display:none}.lp .st{grid-column:2;font-size:17px;align-self:start}.lp .v{grid-row:1/span 2;grid-column:3}}
.busca .lp{grid-template-columns:56px minmax(0,5fr) minmax(0,3fr) 80px 180px 120px}
.busca .lp img{display:block;width:56px;height:68px;object-fit:contain}
@media(max-width:760px){.busca .lp{grid-template-columns:48px minmax(0,1fr) auto}.busca .lp img{width:48px;height:62px}}
#seguidor{position:fixed;left:0;top:0;width:240px;height:320px;object-fit:contain;pointer-events:none;z-index:45;opacity:0;transition:opacity .2s;filter:drop-shadow(0 18px 26px #0009)}

/* detalhe */
.migalha{font:400 20px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;margin-bottom:22px;grid-column:1/-1}
.migalha a{text-decoration:none}
.migalha a:hover{text-decoration:underline}
.info{margin-top:16px;border-top:1px solid color-mix(in srgb,var(--t) 40%,transparent)}
.info div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:9px 0 7px;border-bottom:1px solid color-mix(in srgb,var(--t) 40%,transparent);font-size:18px;line-height:1.22}
.info dt{font:400 20px/1.05 var(--cartaz);letter-spacing:.05em;text-transform:uppercase}

.share{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:12px;font-size:18px}
.share b{font:400 20px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;width:100%;margin-bottom:2px}
.share a{min-height:44px;display:inline-flex;align-items:center}
.fr-op{list-style:none;padding:0;margin-top:8px}
.fr-op li{display:flex;justify-content:space-between;padding:3px 0}
.caixa small{font-size:15.5px;opacity:.85}
.bc{position:fixed;left:0;right:0;bottom:0;z-index:62;display:none;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(14px,3vw,40px) calc(10px + env(safe-area-inset-bottom));background:var(--f);color:var(--t);box-shadow:0 -1px 0 color-mix(in srgb,var(--t) 45%,transparent);transform:translateY(110%);transition:transform .3s var(--ease)}

.itens li{grid-template-columns:64px minmax(0,1fr) auto}

.linha-f{display:flex;gap:8px;margin-bottom:8px}

.linha-f button{min-width:96px;min-height:48px;font:400 21px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px #20131F}

/* senha da fila */
.ingresso{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--f);color:var(--t);margin:14px 0;-webkit-mask:radial-gradient(circle 10px at 104px 0,transparent 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at 104px 100%,transparent 97%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 10px at 104px 0,transparent 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 10px at 104px 100%,transparent 97%,#000) bottom/100% 51% no-repeat}
.ingresso .e{border-right:2px dashed color-mix(in srgb,var(--t) 55%,transparent);padding:16px 6px 12px;text-align:center}
.ingresso small{display:block;font:400 16px/1 var(--cartaz);letter-spacing:.08em;text-transform:uppercase}
.ingresso .e b{display:block;font:400 62px/1 var(--cartaz);font-variant-numeric:tabular-nums}
.ingresso .d{padding:16px 16px 12px;min-width:0}

/* busca */
dialog.busca{width:100vw;height:100dvh;max-height:none;margin:0;background:#17101A;color:var(--papel)}

.b-campo{flex:1;min-width:0;display:flex;align-items:center;gap:12px}

.b-campo input{flex:1;min-width:0;height:72px;background:none;border:0;color:inherit;font:400 clamp(25px,4vw,48px)/1 var(--titulo);outline:none}

.pg-dup{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(24px,6vw,90px);align-items:start}

.pg .btn{--t:#20131F;--f:#E8E2F0;margin-top:18px}
.lista-redes{list-style:none;padding:0;margin-top:14px}
.lista-redes a{display:inline-flex;align-items:center;min-height:44px}

.video{position:relative;display:block;width:100%;aspect-ratio:16/9;margin-top:28px;overflow:hidden;background:#000;border:0}

.gigante{font:400 15.1vw/1 var(--titulo);white-space:nowrap;margin:18px calc(clamp(14px,3vw,40px)*-1) .03em;color:#EDE6A0;text-align:center;user-select:none}

/* avisos */
.wpp{position:fixed;right:14px;bottom:calc(var(--tab) + 14px);z-index:58;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#123A2D;color:#EDE6A0;box-shadow:0 8px 22px #0007;opacity:0;pointer-events:none;transition:opacity .25s,transform .2s var(--ease)}

@media(prefers-reduced-motion:reduce){dialog[open]{animation:none!important}.l-fita{animation:none}.mini.vis{animation:none}.video img,.bc,#toast{transition:none}*{scroll-behavior:auto!important}.intro{display:none}.c-nome,.c-frasco{transition:none}.mini,.mini img,.btn{transition:none!important}}
</style>

<script src="../comum/paginas-paula.js?v=2"></script>
<script>
const M='paula', $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const R=Loja.dinheiro, reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ELENCO=['lord','carmem','gigi','eva50','sauvignon','olibano'];
const img=(u,t=1024)=>u.startsWith('data:')||/\.(jpg|png|webp)$/.test(u)?u:(u+(t===1024?'-1024-1024.webp':'-'+t+'-0.webp'));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fechaPrevia(){document.documentElement.style.setProperty('--barra','0px');$('#previa').remove()}

const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function quando(iso){const d=new Date(iso);return DIAS[d.getDay()]+', '+d.getHours()+'h'}
function falta(iso){let s=Math.max(0,(new Date(iso)-Date.now())/1e3);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'min'}
function selo(p){return p.status==='disponivel'?'Em cartaz':p.status==='estreia'?'Estreia '+quando(p.estreia):'Lotação esgotada'}
function acao(p,cls=''){
  if(p.tipo==='servico'||p.tipo==='curso')return `<button class="btn ${cls}" onclick="conversa('${p.id}')">Quero conversar</button>`;
  if(p.status==='disponivel')return `<button class="btn ${cls}" onclick="colocar('${p.id}')">Comprar</button>`;
  return `<button class="btn ${cls}" onclick="fila('${p.id}')">${p.status==='estreia'?'Me avise da estreia':'Me avise quando voltar'}</button>`;
}
function linhasNome(n){const fixo={'Absoluto de Cacau & Café':['Absoluto de','Cacau & Café'],'Trufa de Conhaque':['Trufa de','Conhaque'],'O Caçador':['O Caçador'],'Srta. Magnólia':['Srta.','Magnólia'],'Perfume Sob Medida':['Sob Medida']};return fixo[n]||n.split(/\s(?=[A-ZÂÉÍÓÚ])/)}
function nome(n){return linhasNome(n).map(l=>`<span class="ln">${esc(l)}</span>`).join('')}
function foto(p){return p.recorte?img(p.recorte):img(p.fotos[0]||'')}
function credito(p){if(!p.saida)return'';return `<i>saída</i>${esc(p.saida)}<i>coração</i>${esc(p.coracao)}<i>base</i>${esc(p.base)}`}
function precoHTML(p){const parc=p.preco>=120?Loja.parcela(p.preco,4):'';return `${p.de?`<s>${R(p.de)}</s>`:''}${R(p.preco)}<small>${p.status==='disponivel'?parc:(p.status==='estreia'?'faltam <span class="conta" data-fim="'+p.estreia+'">'+falta(p.estreia)+'</span>':(p.fila||0)+' na fila')}</small>`}
function linkPara(p){return `#/p/${p.id}`}

function cartaz(p,i){
  return `<section class="cartaz" data-id="${p.id}" style="--f:${p.fundo};--t:${p.tinta}" aria-label="${esc(p.nome)}">
  <div class="c-topo"><span class="selo-e">${selo(p)}</span><span>${esc(p.medida)} · ${esc(p.familia)}</span></div>
  <a class="c-palco" href="${linkPara(p)}" onclick="morfa(this)" aria-label="Ver ${esc(p.nome)}">
    <h2 class="c-nome">${nome(p.nome)}</h2>
    <img class="c-frasco" src="${foto(p)}" alt="" ${i?'':'fetchpriority="high"'} decoding="async">
  </a>
  <div class="c-baixo">
    <blockquote class="c-frase">“${esc(p.frase)}”</blockquote>
    <div class="c-compra"><div class="preco">${precoHTML(p)}</div>${acao(p)}</div>
  </div>
  <p class="c-credito">${credito(p)}</p>
</section>`}

const PADRAO={estado:'todos',para:'todos',fam:'todas',ordem:'padrao',vista:'cartazes'};
let filtro={...PADRAO};
const FAMS=[['floral','Floral'],['gourmand','Gourmand'],['amadeirado','Amadeirado'],['fresco','Fresco'],['oriental','Oriental']];
function familiaG(p){const f=(p.familia||'').toLowerCase();if(/gourmand/.test(f))return 'gourmand';if(/orient/.test(f)&&!/flor/.test(f))return 'oriental';if(/floral|floriental|soliflore|botânico/.test(f))return 'floral';if(/cítrico|marinho/.test(f))return 'fresco';if(/amadeirado|couro|chipre/.test(f))return 'amadeirado';return ''}
function tarja(p){return p.status==='esgotado'?`<div class="tarja">Lotação esgotada</div>`:p.status==='estreia'?`<div class="tarja nova">Estreia ${quando(p.estreia)}</div>`:''}
function mini(p){
  const n=Math.max(...linhasNome(p.nome).map(l=>l.length));
  const tem=p.recorte;
  const rapido=p.status==='disponivel'&&p.tipo!=='servico'&&p.tipo!=='curso';
  return `<article class="mini ${tem?'':'foto'}" style="--f:${p.fundo||'#222'};--t:${p.tinta||'#fff'};--n:${n}">
    <h3>${nome(p.nome)}</h3><div class="im"><img src="${tem?img(p.recorte,640):img(p.fotos[0]||'',640)}" alt="" loading="lazy" decoding="async"></div>${tarja(p)}
    <footer><span>${esc(p.medida)}</span><span>${p.de?`<s>${R(p.de)}</s>`:''}${R(p.preco)}</span></footer>
    <a class="cobre" href="${linkPara(p)}" onclick="morfa(this)" aria-label="${esc(p.nome)}, ${esc(selo(p))}, ${R(p.preco)}"></a>
    ${rapido?`<button class="mais" aria-label="Colocar ${esc(p.nome)} na sacola" onclick="colocar('${p.id}',this,true)">${Rec.ico('mais')}</button>`:''}</article>`}
function filtrados(){
  let l=Loja.produtos(M).filter(p=>p.tipo==='perfume'||p.tipo==='corpo');
  if(filtro.estado!=='todos')l=l.filter(p=>p.status===filtro.estado);
  if(filtro.para!=='todos')l=l.filter(p=>p.para===filtro.para);
  if(filtro.fam!=='todas')l=l.filter(p=>familiaG(p)===filtro.fam);
  const ordem={disponivel:0,estreia:1,esgotado:2};
  if(filtro.ordem==='menor')l.sort((a,b)=>a.preco-b.preco);
  else if(filtro.ordem==='maior')l.sort((a,b)=>b.preco-a.preco);
  else if(filtro.ordem==='nome')l.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  else l.sort((a,b)=>ordem[a.status]-ordem[b.status]);
  return l;
}
function lp(p){const f=foto(p);return `<li><a class="lp" href="${linkPara(p)}" data-foto="${f}" style="--f:${p.fundo||'#222'};--t:${p.tinta||'#fff'}"><img src="${p.recorte?img(p.recorte,240):img(p.fotos[0]||'',240)}" alt="" loading="lazy"><span class="n">${esc(p.nome)}</span><span class="f">${esc(p.familia||'')}</span><span class="m">${esc(p.medida)}</span><span class="st">${esc(selo(p))}</span><span class="v">${p.de?`<s>${R(p.de)}</s>`:''}${R(p.preco)}</span></a></li>`}
function vitrine(){
  const l=filtrados();
  if(!l.length)return `<div class="vazio">Nenhum perfume com esses filtros. <button onclick="limpaFiltros()">Limpar os filtros</button></div>`;
  return filtro.vista==='lista'?`<ul class="lista">${l.map(lp).join('')}</ul>`:`<div class="mural" id="mural">${l.map(mini).join('')}</div>`;
}
function chip(k,v,t){return `<button class="chip" aria-pressed="${filtro[k]===v}" onclick="filtra('${k}','${v}')">${t}</button>`}
function barra(){
  const n=filtrados().length;
  return `<div class="chips">${chip('estado','todos','Todos')+chip('estado','disponivel','Em cartaz')+chip('estado','estreia','Estreias')+chip('estado','esgotado','Lotação esgotada')}<i class="sep"></i>${chip('para','ela','Para ela')+chip('para','ele','Para ele')}<i class="sep"></i>${FAMS.map(([k,t])=>chip('fam',k,t)).join('')}</div>
  <div class="sub-f"><span class="res" aria-live="polite">${n} ${n===1?'perfume':'perfumes'}</span>
    <label><span class="so-leitor">Ordenar por</span><select onchange="muda1('ordem',this.value)">${[['padrao','Disponíveis primeiro'],['menor','Menor preço'],['maior','Maior preço'],['nome','Nome']].map(([v,t])=>`<option value="${v}"${filtro.ordem===v?' selected':''}>${t}</option>`).join('')}</select></label>
    <div class="vista" role="group" aria-label="Ver como"><button aria-pressed="${filtro.vista==='cartazes'}" onclick="muda1('vista','cartazes')">Cartazes</button><button aria-pressed="${filtro.vista==='lista'}" onclick="muda1('vista','lista')">Lista</button></div></div>`
}
function urlFiltro(){const q=new URLSearchParams();Object.keys(PADRAO).forEach(k=>{if(filtro[k]!==PADRAO[k])q.set(k,filtro[k])});const t=q.toString();return '#/programacao'+(t?'?'+t:'')}
function redesenhaVitrine(){
  const b=$('#barra-f'),v=$('#vitrine');if(!b||!v)return;
  const x=$('.chips',b)?.scrollLeft||0;
  b.innerHTML=barra();$('.chips',b).scrollLeft=x;v.innerHTML=vitrine();revela();
  const dif=v.getBoundingClientRect().top-b.getBoundingClientRect().bottom;
  if(dif<0)scrollBy({top:dif,behavior:'instant'});
}
function muda1(k,v){filtro[k]=v;history.replaceState(null,'',urlFiltro());redesenhaVitrine()}
function filtra(k,v){muda1(k,filtro[k]===v?PADRAO[k]:v)}
function limpaFiltros(){filtro={...PADRAO,vista:filtro.vista};history.replaceState(null,'',urlFiltro());redesenhaVitrine()}
function proximas(){
  const ls=Loja.estado().lancamentos.filter(l=>l.marca===M).map(l=>({l,p:Loja.produto(M,l.produto)})).filter(x=>x.p&&x.p.status==='estreia');
  if(!ls.length)return '';
  return `<p class="sl-t">Próximas sessões</p>${ls.map(({l,p})=>`<div class="sl" style="--f:${p.fundo};--t:${p.tinta}"><span class="sl-d">${quando(l.quando)}</span><a class="sl-n" href="${linkPara(p)}">${esc(p.nome)}<small>${esc(p.medida)}</small></a><span class="sl-l">${l.lote?`Lote de ${l.lote} frascos`:''}</span><span class="sl-c conta" data-fim="${l.quando}">${falta(l.quando)}</span><button class="btn" onclick="fila('${p.id}')">Me avise</button></div>`).join('')}`
}
function letreiro(t){
  const es=t.filter(p=>p.status==='estreia').map(p=>`Estreia ${quando(p.estreia)}<b>${esc(p.nome)}</b>`);
  const em=t.filter(p=>p.status==='disponivel'&&p.tipo==='perfume').map(p=>`Em cartaz<b>${esc(p.nome)}</b>`);
  const fi=t.filter(p=>p.fila>=45).slice(0,5).map(p=>`${p.fila} na fila por<b>${esc(p.nome)}</b>`);
  const f=[...es,...em,...fi].join(' · ')+' · ';
  return `<button class="letreiro" aria-label="Pausar ou continuar o letreiro" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')"><span class="l-fita" aria-hidden="true"><span>${f}</span><span>${f}</span></span></button>`
}
function rodape(){
  return `<footer class="rodape"><div class="r-topo">
   <form class="news" onsubmit="news(event)"><h2>Receba a programação antes de todo mundo</h2><div class="n-l"><label class="so-leitor" for="n-e">Seu e-mail</label><input id="n-e" type="email" required autocomplete="email" spellcheck="false" placeholder="seu@email.com…"><button class="btn">Assinar</button></div><p id="n-ok" aria-live="polite"></p></form>
   <nav class="colunas" aria-label="Rodapé"><div><h3>Perfumes</h3><a href="#/programacao?para=ela">Para ela</a><a href="#/programacao?para=ele">Para ele</a><a href="#/sob-medida">Sob medida</a><a href="#/atelie">Ateliê e cursos</a></div>
    <div><h3>A casa</h3><a href="#/quem">Quem escreve</a><a href="#/elenco">Elenco</a><a href="#/pg/contato">Fale com a Paula</a><a href="#/conta">Minha conta</a></div>
    <div><h3>Ajuda</h3><a href="#/pg/trocas">Trocas e devoluções</a><a href="#/pg/entrega">Entrega</a><a href="#/pg/privacidade">Privacidade</a><a href="#/pg/termos">Termos de uso</a></div></nav></div>
   <div class="pagto"><span>Pix · Visa · Mastercard · Elo · Amex · Boleto</span><span><a href="https://instagram.com/paulaoliveiraparfum" target="_blank" rel="noopener">Instagram</a> · <a href="https://www.facebook.com/paulameretica" target="_blank" rel="noopener">Facebook</a> · <a href="https://www.youtube.com/@Paulaoliveiraparfum" target="_blank" rel="noopener">YouTube</a></span><span>CNPJ e endereço da empresa entram aqui. © 2026</span></div>
   <div class="gigante" aria-hidden="true" translate="no">Paula Oliveira</div></footer>`
}
function home(){
  const todos=Loja.produtos(M), novos=todos.filter(p=>p.destaque);
  const lista=[...novos,...ELENCO.map(i=>todos.find(p=>p.id===i)).filter(Boolean)].slice(0,6);
  const pa=todos.find(p=>p.id==='afrodite');
  return `<div id="cartazes">${lista.map(cartaz).join('')}</div>
  ${letreiro(todos)}
  <section class="secao" id="programacao"><h2 class="sec-t">Programação</h2>
    <p class="sec-p">Todos os perfumes da casa. O que está em cartaz sai agora. O resto volta em lote, e quem entra na fila sabe primeiro.</p>
    ${proximas()}
    <div class="barra-f" id="barra-f">${barra()}</div><div id="vitrine">${vitrine()}</div></section>
  <section class="quem" id="quem"><figure><img src="${img(pa.fotos[1])}" alt="Paula Oliveira segurando um perfume na praia" loading="lazy"></figure>
   <div class="tx"><h2>Primeiro vem a personagem</h2>
    <p>Paula Oliveira é perfumista independente. Antes da fórmula, ela escolhe quem vai usar: Lord saiu de James Bond, Felina da Mulher-Gato, Meia Noite da Malévola, Carmem das latinas que dançam na vida.</p>
    <ul><li><b>Lord</b><span>“A sedução combinada com inteligência e aquela pitada de perigo.”</span></li><li><b>Margot</b><span>“Troca o salto pelas botas, mas mantém o luxo na pele.”</span></li><li><b>O Caçador</b><span>“Terra escura, mata fechada e raízes.”</span></li></ul>
    <button class="video" onclick="Rec.tocaVideo(this,'C8F4wWA9vHQ','A história do perfume masculino')" aria-label="Assistir: A história do perfume masculino, dos faraós à atualidade"><img src="https://i.ytimg.com/vi/C8F4wWA9vHQ/hqdefault.jpg" alt="" loading="lazy"><span class="t">${Rec.ico('play')}A história do perfume masculino, dos faraós à atualidade</span></button>
    <a class="ig" href="https://instagram.com/paulaoliveiraparfum" target="_blank" rel="noopener">48,1 mil pessoas acompanham no Instagram</a></div></section>
  <section class="sob" id="sob-medida"><h2>Sob medida</h2><p class="lead">Fórmula trancada. Ninguém no mundo terá o mesmo cheiro.</p>
   <ol class="linha"><li><b>Briefing</b>Reunião para entender sua ideia, rotina e o impacto que você quer causar.</li><li><b>WhatsApp</b>Canal direto para trocar referências a cada etapa.</li><li><b>Amostras</b>Você testa na pele, no seu dia a dia.</li><li><b>Ajustes</b>A fórmula é refinada com o que você sentiu.</li><li><b>Frasco</b>Quatro meses depois, o seu perfume.</li></ol>
   <div class="fim"><div class="preco">R$ 1.750<small>4x de R$ 437,50 sem juros</small></div><button class="btn" onclick="conversa('sobmedida')">Marcar a primeira conversa</button></div></section>
  <div class="dupla" id="atelie">
   <article class="tile" style="--f:#D8C97F;--t:#2B2610"><img src="${img((todos.find(p=>p.id==='atelie-online')||{fotos:['']}).fotos[0],1024)}" alt="" loading="lazy"><h3>Ateliê de Perfumaria</h3><p>A Caixa-Ateliê chega na sua casa com 16 notas nobres, e você faz um perfume que não pertence a nenhuma marca. On-line por R$ 1.497 ou <a href="#/p/atelie-sp">presencial por R$ 1.190</a>.</p><button class="btn" onclick="fila('atelie-online')">Me avise da próxima turma</button></article>
   <article class="tile" style="--f:#22302B;--t:#E7DFC8"><img src="${img((todos.find(p=>p.id==='negocios')||{fotos:['']}).fotos[0],1024)}" alt="" loading="lazy"><h3>O cheiro da sua empresa</h3><p>Consultórios, lojas, barbearias e hotéis. Uma fragrância criada do zero para o seu espaço, com o primeiro frasco de 200 ml incluído. R$ 1.750.</p><button class="btn" onclick="conversa('negocios')">Pedir um projeto</button></article></div>
  <section class="elenco" id="elenco"><div><h2>Quem está no Elenco sabe antes</h2>
   <ul><li>Aviso no celular na hora que o lote abre</li><li>Uma hora de vantagem sobre todo mundo</li><li>Você vota em qual perfume volta primeiro</li><li>Presente na semana do seu aniversário</li></ul>
   <button class="btn" onclick="baixar()">Baixar o app</button></div>
   <div class="cel" aria-hidden="true"><div class="tela"><div class="hora">19:58</div><div class="dia">sábado</div><div class="push"><b>Paula Oliveira · agora</b>Lord chega sábado, às 8. Fique pronta.</div><div class="push"><b>Paula Oliveira · agora</b>Você tem 1 hora antes de abrir para todo mundo.</div></div></div></section>
  ${rodape()}`
}
function detalhe(id){
  const p=Loja.produto(M,id); if(!p)return `<section class="secao"><h2 class="sec-t">Esse perfume saiu de cartaz</h2><p class="sec-p"><a href="#/programacao">Ver a programação</a></p></section>`;
  const todos=Loja.produtos(M).filter(x=>x.id!==id&&x.tipo==='perfume'),fam=familiaG(p);
  const mesma=todos.filter(x=>familiaG(x)===fam).sort((a,b)=>(a.status==='disponivel'?0:1)-(b.status==='disponivel'?0:1));
  const outros=[...mesma,...todos.filter(x=>familiaG(x)!==fam&&x.status==='disponivel')].slice(0,4);
  let h=(p.historia||'').trim(); if(h.length>=1490)h=h.slice(0,h.lastIndexOf('.')+1);
  const fraseCurta=(p.frase||'').slice(0,28);
  const texto=h.split(/\n+/).map(t=>t.trim()).filter(t=>t&&!t.startsWith(fraseCurta)).map(t=>t.length<52&&!/[.!?]$/.test(t)?`<h3 style="font:400 clamp(27px,2.3vw,34px)/1.05 var(--cartaz);letter-spacing:.04em;text-transform:uppercase;margin-top:1.2em">${esc(t)}</h3>`:`<p style="margin-top:.7em">${esc(t)}</p>`).join('');
  const url=location.href.split('#')[0]+linkPara(p), redes=Rec.redes(url,`${p.nome}, de Paula Oliveira`,foto(p));
  const seg=p.para==='ele'?['ele','Para ele']:p.para==='ela'?['ela','Para ela']:null;
  return `<article class="det" style="--f:${p.fundo};--t:${p.tinta}">
  <div class="det-capa"><div class="c-topo"><span class="selo-e">${selo(p)}</span><span>${esc(p.medida)} · ${esc(p.familia)}</span></div>
   <div class="c-palco"><h1 class="c-nome">${nome(p.nome)}</h1><img class="c-frasco" src="${foto(p)}" alt="Frasco de ${esc(p.nome)}" fetchpriority="high"></div>
   <div class="c-baixo"><blockquote class="c-frase">“${esc(p.frase)}”</blockquote><div class="c-compra"><div class="preco">${precoHTML(p)}</div>${acao(p)}</div></div></div>
  <div class="det-corpo"><nav class="migalha" aria-label="Você está em"><a href="#/">Início</a> / ${seg?`<a href="#/programacao?para=${seg[0]}">${seg[1]}</a>`:`<a href="#/programacao">Programação</a>`} / ${esc(p.nome)}</nav>
   <div class="det-texto"><p class="det-frase">“${esc(p.frase)}”</p>${texto}</div>
   <aside class="caixa"><div class="c-topo" style="margin-bottom:12px"><span class="selo-e">${selo(p)}</span></div><div class="preco">${precoHTML(p)}</div>${acao(p)}
    <p>${esc(p.medida)} · ${esc(p.familia)}</p>${p.status==='disponivel'?`<form class="frete" onsubmit="frete(event)"><input inputmode="numeric" autocomplete="postal-code" name="cep" placeholder="Seu CEP…" aria-label="Seu CEP" oninput="Rec.mascaraCep(this)"><button>Frete</button></form><div id="fr" aria-live="polite"></div>`:`<p>Entre na fila e receba o aviso antes de abrir para todo mundo.</p>`}
    <dl class="info"><div><dt>Pagamento</dt><dd>Pix, cartão em até 4x sem juros ou boleto</dd></div><div><dt>Envio</dt><dd>Correios, em PAC ou SEDEX</dd></div><div><dt>Trocas</dt><dd><a href="#/pg/trocas">Como funciona</a></dd></div></dl>
    <div class="share"><b>Compartilhar</b>${redes.map(r=>`<a href="${r.u}" target="_blank" rel="noopener">${r.n}</a>`).join('')}</div></aside></div>
  ${p.saida?`<section class="piramide" aria-label="Notas"><div><h3>o que chega primeiro</h3><p>${esc(p.saida)}</p></div><div><h3>o que fica no meio</h3><p>${esc(p.coracao)}</p></div><div><h3>o que fica na pele</h3><p>${esc(p.base)}</p></div></section>`:''}
  ${p.fotos.length?`<div class="galeria">${p.fotos.map(f=>`<img src="${img(f)}" alt="" loading="lazy">`).join('')}</div>`:''}
  ${outros.length?`<section style="padding:0 clamp(14px,3vw,40px) 60px"><p style="font:400 26px/1 var(--cartaz);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px">Se você gostou deste</p><div class="mural">${outros.map(mini).join('')}</div></section>`:''}
  <a class="voltar" href="#/programacao">← Voltar à programação</a>

addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;const u=i.src,k=TAMS.findIndex(t=>u.endsWith(t));if(k<0)return;const n=+(i.dataset.tent||0);if(n>=TAMS.length-1)return;i.dataset.tent=n+1;i.src=u.slice(0,-TAMS[k].length)+TAMS[(k+1)%TAMS.length]},true);
const gav=$('#gav'),dlg=$('#dlg'),bus=$('#bus');
[gav,dlg].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
bus.addEventListener('click',e=>{if(e.target.closest('a'))bus.close()});
Loja.aoMudar(()=>{if(semAviso)return;naHome=false;if(!dlg.open&&!gav.open){const y=scrollY;desenha(true);scrollTo({top:y,behavior:'instant'})}});
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!reduz){
  let ax=0,ay=0,sx=0,sy=0,seguindo=false;const sg=$('#seguidor');
  const segue=()=>{sx+=(ax-sx)*.16;sy+=(ay-sy)*.16;sg.style.transform=`translate(${sx+26}px,${sy-160}px)`;if(sg.classList.contains('on'))requestAnimationFrame(segue);else seguindo=false};
  document.addEventListener('pointermove',e=>{
    const m=e.target.closest&&e.target.closest('.mini');
    if(m){const r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;m.style.setProperty('--mx',(x*100).toFixed(1)+'%');m.style.setProperty('--my',(y*100).toFixed(1)+'%');m.style.setProperty('--rx',((x-.5)*6).toFixed(2));m.style.setProperty('--ry',((.5-y)*6).toFixed(2))}
    const l=e.target.closest&&e.target.closest('main .lp');
    if(l){ax=e.clientX;ay=e.clientY;if(sg.dataset.u!==l.dataset.foto){sg.dataset.u=l.dataset.foto;sg.src=l.dataset.foto}if(!seguindo){sx=ax;sy=ay;seguindo=true;sg.classList.add('on');requestAnimationFrame(segue)}}else sg.classList.remove('on');
  },{passive:true});
}
setInterval(()=>$$('[data-fim]').forEach(e=>e.textContent=falta(e.dataset.fim)),30000);

/* cortina de abertura: as cores dos cartazes sobem, uma vez por visita */
try{ if(!reduz&&!sessionStorage.getItem('pp_cortina')&&!location.hash.startsWith('#/p/')){sessionStorage.setItem('pp_cortina','1');
  const d=document.createElement('div');d.className='intro';d.setAttribute('aria-hidden','true');d.innerHTML=['#123A2D','#F7A400','#FFDC3C','#B4CE54','#1A4BA0','#0E2E39'].map((c,i)=>`<i style="--c:${c};--i:${i}"></i>`).join('');document.body.append(d);setTimeout(()=>d.remove(),1500)}}catch(e){}
Rec.hidrataIcones();
Rec.mostraCookies();
desenha();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fita);
</script>
</body>
