<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fada Marinha · Perfumaria botânica</title>
<meta name="description" content="Coração floral. Alma oceânica. Perfumaria botânica nascida na Ilha do Mel.">
<!-- Prévia: fora do Google. Tirar quando virar o site oficial dela. -->

<meta property="og:image" content="https://rottaguide.com/paulaoliveira/fada/compartilhar.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://acdn-us.mitiendanube.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Figtree:wght@400;500;600&family=IM+Fell+Double+Pica:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--barra:30px;--mar:#0A1E4A;--espuma:#F7F3E6;--ouro:#E4BF6C;--ouro-e:#7A5A12;--conto:'IM Fell Double Pica','Iowan Old Style',Georgia,serif;--tx:'Figtree',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:#0B4F86;color:var(--mar);font:400 1.09rem/1.5 var(--tx);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.pular{position:fixed;left:12px;top:-80px;z-index:90;background:#fff;color:#000;padding:10px 14px}
.pular:focus{top:40px}
#agua{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(#BFEFEA,#0B4F86)}
.previa{position:fixed;inset:0 0 auto 0;height:var(--barra);z-index:70;background:#061233;color:#fff;display:flex;align-items:center;justify-content:center;font:500 13.5px/1 var(--tx);padding:0 44px;white-space:nowrap;overflow:hidden}
.previa span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.previa button{position:absolute;right:0;top:0;height:30px;width:44px;font-size:18px}
@media(max-width:640px){.previa{justify-content:flex-start;padding:0 44px 0 12px;font-size:12.5px}}

.topo{position:fixed;left:0;right:0;top:var(--barra);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:8px clamp(14px,3vw,40px);color:var(--cor-topo,var(--mar));transition:color .4s,background .4s}
.topo.solido{background:#0A1E4Ad9;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--espuma)}
.marca{display:flex;align-items:center;gap:10px;font:400 clamp(23px,2vw,28px)/1 var(--conto);text-decoration:none}
.marca img{width:46px;height:46px;border-radius:50%;background:#0A1E4A}
.menu{display:flex;gap:clamp(16px,2.4vw,34px);font-weight:500;font-size:16px}
.menu a{text-decoration:none;padding:12px 0}
.menu a:hover{text-decoration:underline;text-underline-offset:5px}
.direita{display:flex;gap:18px;align-items:center}
.saco,.abre-menu{font-weight:500;font-size:16px;min-height:44px}
.abre-menu{display:none}
@media(max-width:820px){.menu{display:none}.abre-menu{display:block}}

/* medidor de profundidade */
.medidor{position:fixed;right:clamp(10px,1.6vw,24px);top:50%;transform:translateY(-50%);z-index:50;height:46vh;width:2px;background:color-mix(in srgb,var(--cor-topo,var(--mar)) 32%,transparent);transition:opacity .4s}
.medidor b{position:absolute;left:0;top:var(--pos,0%);width:10px;height:10px;margin:-5px 0 0 -4px;border-radius:50%;background:var(--ouro);box-shadow:0 0 12px var(--ouro)}
.medidor span{position:absolute;right:14px;top:var(--pos,0%);transform:translateY(-50%);white-space:nowrap;text-align:right;font:400 14px/1.15 var(--mono);color:var(--cor-topo,var(--mar))}
.medidor span small{display:block;font:400 12.5px/1.15 var(--mono);opacity:.82}
@media(max-width:820px){.medidor{top:auto;bottom:10px;right:auto;left:10px;transform:none;height:auto;width:auto;background:#061233d9;border-radius:30px;padding:6px 12px}.medidor b{display:none}.medidor span{position:static;transform:none;color:#fff;font-size:12.5px;display:block}.medidor span small{display:inline;margin-left:8px;font-size:12px}}

main{position:relative;z-index:1}
.z{position:relative;padding:clamp(70px,12vh,150px) clamp(16px,6vw,110px)}
.z.claro{color:var(--espuma);text-shadow:0 1px 16px #06143266}
.z.escuro{color:var(--mar)}

/* superfície */
.sup{height:100vh;height:100svh;min-height:620px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--barra) + 40px) 16px 40px;color:var(--mar)}
.sup h1{font:400 clamp(66px,13.4vw,214px)/.88 var(--conto);letter-spacing:-.018em}
.sup h1 em{display:block;font-style:italic}
.sup p{font-size:clamp(19px,1.7vw,24px);margin:24px auto 26px;max-width:31ch;line-height:1.3;font-weight:500}
.mergulhar{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 32px;background:var(--mar);color:var(--espuma);border-radius:40px;font:500 19px/1 var(--tx);text-decoration:none;transition:transform .25s}
.mergulhar:hover{transform:translateY(5px)}

/* bem-vinda */
.bem{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(24px,5vw,80px);align-items:center}
.bem h2{font:400 clamp(50px,7.4vw,118px)/.94 var(--conto)}
.bem p{font-size:clamp(20px,1.65vw,24px);line-height:1.38;margin-top:24px;max-width:33em;font-weight:500}
.vers{list-style:none;padding:0;margin-top:28px;font:italic 400 clamp(30px,3.1vw,46px)/1.12 var(--conto)}
.bem figure{aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--ouro-e),0 0 0 14px #ffffff2e}
.bem figure img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.bem{grid-template-columns:1fr}.bem figure{max-width:82vw;margin:auto}}

/* zona */
.cab{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;margin-bottom:clamp(30px,5vw,68px)}

.cab .m{font:400 clamp(16px,1.3vw,19px)/1 var(--mono);grid-column:1/-1;margin-bottom:10px}
.cab h2{font:400 clamp(66px,11vw,180px)/.86 var(--conto);letter-spacing:-.015em}
.cab p{font:italic 400 clamp(24px,2.3vw,35px)/1.08 var(--conto);padding-bottom:.45em;max-width:15em}
@media(max-width:820px){.cab{grid-template-columns:1fr}.cab p{padding:0}}
.bolhas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(22px,3vw,44px) clamp(14px,2vw,30px)}
.bolha{grid-column:span 3;display:flex;flex-direction:column;align-items:center;text-align:center}
.bolha:nth-child(4n+1){grid-column:span 4}
.bolha:nth-child(4n+2){margin-top:clamp(30px,7vw,100px)}
.bolha:nth-child(4n+3){grid-column:span 2;margin-top:clamp(8px,2vw,30px)}
.bolha:nth-child(4n){margin-top:clamp(50px,9vw,130px)}
.vigia{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px var(--ouro),0 0 0 8px #ffffff1c;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vigia img{width:100%;height:100%;object-fit:cover}
.bolha:hover .vigia{transform:translateY(-10px) scale(1.03)}
.bolha h3{font:400 clamp(24px,2.1vw,33px)/1.02 var(--conto);margin-top:14px}
.bolha a.t{text-decoration:none}
.bolha .inf{font-size:16px;margin-top:4px;font-weight:500}
.bolha .est{font:400 13.5px/1.2 var(--mono);margin-top:4px}
.pil{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:9px;padding:0 18px;border-radius:30px;font:500 15.5px/1 var(--tx);box-shadow:inset 0 0 0 1.5px currentColor;transition:background .2s,color .2s}
.pil:hover{background:currentColor}
.pil:hover span{color:#0B3F70}
.z.escuro .pil:hover span{color:#BFEFEA}
.pil.chei{background:var(--ouro);color:#201505;box-shadow:none}
.pil.chei:hover{background:var(--espuma)}
.pil.chei:hover span{color:#201505}
@media(max-width:820px){.bolhas{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 16px}.bolha,.bolha:nth-child(n){grid-column:span 1;margin-top:0}.bolha:nth-child(even){margin-top:46px}.bolha:nth-child(3n+1){grid-column:span 2;width:74%;justify-self:center;margin-top:0}}

/* oráculo */
.oraculo{text-align:center}
.oraculo h2{font:400 clamp(60px,10vw,160px)/.9 var(--conto)}
.oraculo .sub{font-size:clamp(20px,1.7vw,24px);font-weight:500;margin-top:14px}
.pergunta{margin-top:clamp(28px,4vw,50px);min-height:320px}
.pergunta h3{font:italic 400 clamp(32px,3.8vw,58px)/1.06 var(--conto);margin-bottom:24px}
.respostas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1100px;margin:auto}
.respostas button{min-height:120px;padding:16px;border-radius:26px;background:#ffffff42;font:500 clamp(18px,1.5vw,21px)/1.2 var(--tx);transition:background .2s,transform .2s;color:var(--mar)}
.respostas button:hover{background:#ffffffa6;transform:translateY(-4px)}
@media(max-width:820px){.respostas{grid-template-columns:1fr 1fr}.respostas button{min-height:92px}}
.pontos{font:400 14.5px/1 var(--mono);margin-bottom:14px}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:center;text-align:left;max-width:1000px;margin:auto}
.result .vigia{max-width:380px;justify-self:center}
.result h3{font:400 clamp(44px,5.6vw,84px)/.94 var(--conto)}
.result p{font-size:20px;margin:12px 0 18px;font-weight:500}
@media(max-width:820px){.result{grid-template-columns:1fr;text-align:center}}

/* prateleira */
.prat{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x proximity;padding:14px clamp(16px,6vw,110px) 18px;margin:0 calc(clamp(16px,6vw,110px)*-1);scrollbar-width:none}
.prat::-webkit-scrollbar{display:none}
.prat .bolha,.prat .bolha:nth-child(n){flex:0 0 clamp(150px,17vw,230px);grid-column:auto;margin:0;scroll-snap-align:center;width:auto}
.prat .bolha h3{font-size:clamp(22px,1.7vw,27px)}
.rot{font:italic 400 clamp(34px,3.6vw,54px)/1 var(--conto);margin:30px 0 8px}

/* próxima maré */
.mare{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,6vw,100px);align-items:center;margin-bottom:clamp(50px,8vw,120px)}
.mare .vigia{box-shadow:0 0 0 2px var(--ouro),0 0 60px #e4bf6c55,0 0 0 16px #ffffff12}
.mare .sel{font:400 clamp(16px,1.3vw,19px)/1.2 var(--mono);color:var(--ouro)}
.mare h3{font:400 clamp(58px,8.4vw,136px)/.9 var(--conto);margin:10px 0}
.mare .fr{font:italic 400 clamp(26px,2.4vw,37px)/1.12 var(--conto)}
.mare .tempo{font:400 clamp(30px,3vw,46px)/1 var(--mono);margin:20px 0}
.mare .pil{min-height:56px;padding:0 30px;font-size:18px}
@media(max-width:820px){.mare{grid-template-columns:1fr;text-align:center}.mare .vigia{max-width:78vw;margin:auto}}

/* cardume */
.card{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px;align-items:center}
.card h2{font:400 clamp(60px,9.6vw,156px)/.9 var(--conto)}
.card ul{list-style:none;padding:0;margin:26px 0 28px;font-size:clamp(20px,1.7vw,24px);font-weight:500}
.card li{padding:9px 0;border-top:1px solid #f7f3e640}
.cel{justify-self:center;width:min(290px,74vw);aspect-ratio:9/18.6;border-radius:42px;background:#02050f;padding:9px;box-shadow:0 30px 70px #0009,0 0 0 1px #e4bf6c55}
.tela{width:100%;height:100%;border-radius:34px;background:linear-gradient(#0E5F8F,#0A1E4A);display:flex;flex-direction:column;align-items:center;padding-top:44px;color:#fff;overflow:hidden;text-shadow:none}
.hora{font:400 62px/1 var(--conto)}
.dia{font-size:15px;margin-bottom:24px}
.push{width:92%;background:#ffffffeb;color:#111;border-radius:18px;padding:11px 13px;font:400 15px/1.28 var(--tx)}
.push b{display:block;font:500 13px/1.2 var(--tx);color:#555;margin-bottom:2px}
.push+.push{margin-top:8px}
@media(max-width:820px){.card{grid-template-columns:1fr}}
.leito{text-align:center;padding:clamp(70px,14vh,170px) 16px 80px;color:var(--espuma)}
.leito h2{font:italic 400 clamp(40px,6vw,92px)/1 var(--conto)}
.leito nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;margin:30px 0 14px;font-size:16px}
.leito small{font-size:15px;opacity:.82}

/* detalhe */
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);min-height:100vh;padding:calc(var(--barra) + 90px) clamp(16px,6vw,110px) 80px;align-items:start}
.det.claro{color:var(--espuma);text-shadow:0 1px 16px #06143266}
.det-foto{position:sticky;top:calc(var(--barra) + 80px)}
.det-foto .vigia{view-transition-name:foto;box-shadow:0 0 0 2px var(--ouro),0 0 0 16px #ffffff14}
.miudas{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.miudas button{width:64px;height:64px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px var(--ouro)}
.miudas img{width:100%;height:100%;object-fit:cover}
.det h1{font:400 clamp(58px,7.6vw,122px)/.9 var(--conto)}
.det .fr{font:italic 400 clamp(26px,2.5vw,38px)/1.14 var(--conto);margin:16px 0}
.det .pr{font:400 clamp(30px,2.8vw,42px)/1 var(--mono);margin-top:20px}
.det .pr small{display:block;font:500 16px/1.3 var(--tx);margin-top:6px}
.det .pil{min-height:56px;padding:0 30px;font-size:18px;margin-top:16px}
.det .nt{margin-top:22px;font:400 16px/1.5 var(--mono)}
.det .hist{margin-top:24px;font-size:19px;line-height:1.5;max-width:36em}
.det .hist p+p{margin-top:.7em}
.volta{display:inline-block;margin-bottom:20px;font-weight:500;text-decoration:none;min-height:44px}
@media(max-width:820px){.det{grid-template-columns:1fr}.det-foto{position:static}.det-foto .vigia{max-width:82vw;margin:auto}}

dialog{border:0;padding:0;color:var(--mar);background:#F7F3E6;font:400 18px/1.4 var(--tx);max-width:none}
dialog::backdrop{background:#02081dB3}
.modal{width:min(480px,calc(100vw - 24px));margin:auto;padding:28px;border-radius:28px}
dialog#dlg{border-radius:28px}
.modal h2{font:400 clamp(35px,5vw,45px)/1 var(--conto);margin-bottom:10px;padding-right:32px}
.fechar{position:absolute;right:8px;top:8px;width:44px;height:44px;font-size:26px;line-height:1}
.campo{display:block;margin-top:12px;font-size:16px;font-weight:500}
.campo input{display:block;width:100%;height:50px;margin-top:3px;padding:0 14px;font:inherit;font-weight:400;border:0;border-radius:14px;box-shadow:inset 0 0 0 1.5px #0a1e4a55;background:#fff;color:var(--mar)}
.op{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:15.5px;line-height:1.3}
.op input{width:22px;height:22px;margin:0;accent-color:var(--mar);flex:none}
.acao{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin-top:18px;background:var(--mar);color:var(--espuma);border-radius:40px;font:500 18px/1 var(--tx);text-decoration:none}
dialog.gaveta{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(430px,100vw)}
.gav{display:flex;flex-direction:column;height:100%;padding:24px}
.gav h2{font:400 44px/1 var(--conto)}
.itens{flex:1;overflow:auto;margin:14px 0;list-style:none;padding:0}
.itens li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-top:1px solid #0a1e4a33;padding:9px 0}
.itens img{width:64px;height:64px;object-fit:cover;border-radius:50%}
.itens button{font-size:15px;text-decoration:underline;min-height:44px}
.tot{display:flex;justify-content:space-between;font:400 26px/1 var(--mono)}
.miudo{font-size:15px;margin-top:8px}
ol.passos{padding-left:1.2em;margin-top:6px}ol.passos li{margin-top:5px}
.lista-menu{list-style:none;padding:0;font:400 36px/1.3 var(--conto)}
.lista-menu a{text-decoration:none;display:block;padding:6px 0}
::view-transition-old(foto),::view-transition-new(foto){animation-duration:.5s}
@media(prefers-reduced-motion:reduce){.vigia,.mergulhar,.pil,.respostas button{transition:none!important}}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<canvas id="agua" aria-hidden="true"></canvas>
<div class="previa" id="previa"><span>Prévia feita pela Ti Artes · preços e estoque reais de 08/11 · filas e datas são exemplo</span><button aria-label="Fechar aviso" onclick="fechaPrevia()">×</button></div>
<header class="topo" id="topo">
  <a class="marca" href="#/"><img src="https://d1a9qnv764bsoo.cloudfront.net/stores/001/903/584/themes/common/logo-897714601-1640642747-bee96cc36d7d1e814d181d7a502d16351640642748-320-0.webp" alt="">Fada Marinha</a>
  <nav class="menu" aria-label="Principal"><a href="#/perfumes">Perfumes</a><a href="#/pocoes">Cabelo e corpo</a><a href="#/oraculo">Qual sereia é você</a><a href="#/cardume">Cardume</a></nav>
  <div class="direita"><button class="abre-menu" onclick="abreMenu()">Menu</button><button class="saco" id="saco" onclick="abreSacola()">Sacola (0)</button></div>
</header>
<div class="medidor" id="medidor" aria-hidden="true"><b></b><span id="metros">0 m</span></div>
<main id="conteudo"></main>
<dialog id="dlg"></dialog>
<dialog id="gav" class="gaveta"></dialog>

<script src="../comum/dados-fada.js"></script>
<script src="../comum/loja.js"></script>
<script src="../comum/instalar.js"></script>
<script>
const M='fada',$=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const R=Loja.dinheiro,reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NIVEL={clara:.15,recife:.37,ritual:.47,aberto:.63,fundo:.86};
const img=(u,t=640)=>/^data:|\.(jpg|png|webp)$/.test(u)?u:(u+(t===1024?'-1024-1024.webp':'-'+t+'-0.webp'));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fechaPrevia(){document.documentElement.style.setProperty('--barra','0px');$('#previa').remove()}
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const quando=iso=>{const d=new Date(iso);return DIAS[d.getDay()]+', '+d.getHours()+'h'};
function falta(iso){let s=Math.max(0,(new Date(iso)-Date.now())/1e3);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'min'}
const estado=p=>p.status==='disponivel'?'À tona':p.status==='estreia'?'Na próxima maré':'Foi com a maré';
function acao(p){
  if(p.status==='disponivel')return `<button class="pil chei" onclick="colocar('${p.id}')"><span>Comprar</span></button>`;
  return `<button class="pil" onclick="fila('${p.id}')"><span>${p.status==='estreia'?'Me avise da maré':'Me avise na volta'}</span></button>`;
}
function morfa(a){const i=$('img',a);if(i)i.style.viewTransitionName='foto'}
function bolha(p){

  <div class="inf">${esc(p.medida)} · ${R(p.preco)}</div><div class="est">${estado(p)}${p.status!=='disponivel'&&p.fila?` · ${p.fila} esperando`:''}</div>${acao(p)}</article>`
}
function zona(k,tom,id,metros,nivel){
  const [nome,faixa,sub]=ZONAS_FADA[k], l=Loja.produtos(M).filter(p=>p.zona===k&&p.status!=='estreia');
  return `<section class="z ${tom}" id="${id||k}" data-nivel="${nivel}" data-metros="${metros}" data-nome="${nome}">
   <header class="cab"><span class="m">${faixa}</span><h2>${nome}</h2><p>${sub}</p></header><div class="bolhas">${l.map(bolha).join('')}</div></section>`

  ${zona('clara','escuro','perfumes',10,.15)}
  <section class="z escuro oraculo" id="oraculo" data-nivel=".26" data-metros="30" data-nome="Oráculo"><h2>Qual sereia é você?</h2><p class="sub">Três perguntas e o mar escolhe o seu perfume.</p><div class="pergunta" id="pergunta">${oraculoHTML()}</div></section>
  ${zona('recife','claro','',40,.38)}
  <section class="z claro" id="pocoes" data-nivel=".48" data-metros="200" data-nome="Poções"><header class="cab"><span class="m">O que vem junto do perfume</span><h2>Poções</h2><p>Para cabelos que pedem mar e pele que pede flor</p></header>
    <p class="rot">Cabelo</p><div class="prat">${cab.map(bolha).join('')}</div><p class="rot">Corpo</p><div class="prat">${cor.map(bolha).join('')}</div></section>
  ${zona('aberto','claro','',300,.64)}
  <section class="z claro" id="fundo" data-nivel=".88" data-metros="1200" data-nome="${n}">
    ${prox?`<div class="mare"><a class="vigia" href="#/p/${prox.id}" onclick="morfa(this)"><img src="${img(prox.fotos[0],1024)}" alt="" loading="lazy"></a><div><p class="sel">Próxima maré · ${quando(prox.estreia)}</p><h3>${esc(prox.nome)}</h3><p class="fr">${esc(prox.frase)}</p><p class="tempo" data-fim="${prox.estreia}">${falta(prox.estreia)}</p><button class="pil chei" onclick="fila('${prox.id}')"><span>Me avise antes de abrir</span></button></div></div>`:''}
    <header class="cab"><span class="m">${fx}</span><h2>${n}</h2><p>${sub}</p></header><div class="bolhas">${fundo.map(bolha).join('')}</div></section>
  <section class="z claro card" id="cardume" data-nivel=".95" data-metros="6000" data-nome="Cardume"><div><h2>O cardume sabe antes</h2><ul><li>Aviso no celular quando um perfume volta à tona</li><li>Entrada antes de abrir para todo mundo</li><li>Votação de qual sereia volta primeiro</li><li>Uma surpresa na caixinha do seu aniversário</li></ul><button class="pil chei" style="min-height:58px;padding:0 34px;font-size:19px" onclick="baixar()"><span>Baixar o app</span></button></div>
    <div class="cel" aria-hidden="true"><div class="tela"><div class="hora">18:58</div><div class="dia">sexta-feira</div><div class="push"><b>Fada Marinha · agora</b>Sereias, a Guardiã das Flores voltou à tona.</div><div class="push"><b>Fada Marinha · agora</b>Sua caixinha está a caminho.</div></div></div></section>
  <footer class="leito" data-nivel="1" data-metros="11000" data-nome="Leito do oceano"><h2>As sereias vão perfumar o mundo</h2><nav><a href="#/">Trocas e devoluções</a><a href="#/">Entrega</a><a href="#/">Privacidade</a><a href="#/">Fale com a Fada</a></nav><small>CNPJ e endereço da empresa entram aqui.</small><br><button class="pil" style="margin-top:22px" onclick="scrollTo({top:0,behavior:'smooth'})"><span>Voltar à tona ↑</span></button></footer>`
}
function detalhe(id){
  const p=Loja.produto(M,id);if(!p)return `<section class="z claro"><h2 style="font:400 60px var(--conto)">Esse perfume foi com a maré</h2><a href="#/perfumes">Ver os perfumes</a></section>`;
  const niv=NIVEL[p.zona]||.5,tom=niv<.3?'':'claro';
  let h=(p.historia||'').trim();if(h.length>=1290)h=h.slice(0,h.lastIndexOf('.')+1);
  return `<article class="det ${tom}" data-nivel="${niv}" data-metros="${({clara:30,recife:200,ritual:420,aberto:1000,fundo:3000})[p.zona]}" data-nome="${esc(p.nome)}">
   <div class="det-foto"><span class="vigia"><img id="grande" src="${img(p.fotos[0],1024)}" alt="${esc(p.nome)}"></span><div class="miudas">${p.fotos.slice(0,6).map(f=>`<button aria-label="Ver outra foto" onclick="grande.src='${img(f,1024)}'"><img src="${img(f,240)}" alt="" loading="lazy"></button>`).join('')}</div></div>
   <div><a class="volta" href="#/perfumes">← Voltar ao mar</a><h1>${esc(p.nome)}</h1><p class="fr">${esc(p.frase)}</p>
   <p style="font:400 15px var(--mono)">${esc(p.medida)} · ${estado(p)}${p.status!=='disponivel'&&p.fila?` · ${p.fila} esperando`:''}</p>
   <div class="pr">${R(p.preco)}<small>${p.status==='estreia'?'Abre '+quando(p.estreia):(p.preco>=100?Loja.parcela(p.preco,3)+' ou Pix':'no Pix ou cartão')}</small></div>${acao(p)}
   ${p.notas?`<p class="nt">${esc(p.notas)}</p>`:''}<div class="hist">${h.split(/\n+/).map(t=>`<p>${esc(t)}</p>`).join('')}</div></div></article>`
}

/* água: um único desenho no fundo da página inteira */
const FS=`precision mediump float;uniform vec2 R;uniform float T,N,L;
vec3 c0=vec3(.749,.937,.918),c1=vec3(.341,.776,.788),c2=vec3(.075,.533,.635),c3=vec3(.043,.31,.525),c4=vec3(.039,.118,.29),c5=vec3(.02,.039,.133);
vec3 ramp(float x){if(x<.12)return mix(c0,c1,x/.12);if(x<.32)return mix(c1,c2,(x-.12)/.2);if(x<.55)return mix(c2,c3,(x-.32)/.23);if(x<.8)return mix(c3,c4,(x-.55)/.25);return mix(c4,c5,clamp((x-.8)/.2,0.,1.));}
float cau(vec2 uv,float t){vec2 p=mod(uv*6.28318,6.28318)-250.,i=p;float c=1.,a=.005;for(int n=0;n<4;n++){float q=t*(1.-(3.5/float(n+1)));i=p+vec2(cos(q-i.x)+sin(q+i.y),sin(q-i.y)+cos(q+i.x));c+=1./length(vec2(p.x/(sin(i.x+q)/a),p.y/(cos(i.y+q)/a)));}c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
float rd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec2 uv=gl_FragCoord.xy/R,p=uv;float as=R.x/R.y;p.x*=as;
float onda=L+.012*sin(p.x*5.+T*.8)+.007*sin(p.x*11.-T*1.1)+.004*sin(p.x*23.+T*1.7);
float prof=clamp(N+(1.-uv.y)*.06,0.,1.);vec3 c=ramp(prof);
float ra=pow(max(0.,sin(p.x*3.2+uv.y*1.5+T*.12)*.5+.5),3.)*(1.-smoothstep(.0,.58,N))*uv.y;c+=vec3(.55,.75,.7)*ra*.2;
float k=1.-smoothstep(.1,.64,N);if(k>.01)c+=vec3(.82,1.,.95)*cau(p*1.25+vec2(0.,N*3.),T*.32)*k*.36;
float pl=smoothstep(.56,.96,N);if(pl>.0){vec2 q=p*vec2(58.,58.)+vec2(0.,T*.5);vec2 g=floor(q);float r=rd(g);float b=step(.988,r)*(.3+.5*sin(T*(.6+r*2.4)+r*40.));c+=vec3(.72,.9,1.)*b*smoothstep(.3,.0,length(fract(q)-.5))*pl;}
if(uv.y>onda){float h=(uv.y-onda)/(1.-onda+.001);vec3 ceu=mix(vec3(1.,.9,.77),vec3(.985,.97,.92),h);float s=smoothstep(.62,.0,distance(vec2(p.x-as*.5,(uv.y-onda)*1.15),vec2(0.,.05)));ceu+=vec3(.2,.13,.0)*s;c=ceu;}
c=mix(c,vec3(1.),smoothstep(.0055,.0,abs(uv.y-onda))*.9);gl_FragColor=vec4(c,1.);}`;
let gl,U={},nivelAtual=0,linha=.62,pede=true;
(function(){const cv=$('#agua');gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'});if(!gl)return;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
 ['R','T','N','L'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
 function tam(){const q=innerWidth<820?.55:Math.min(1,1500/innerWidth);cv.width=Math.round(innerWidth*q);cv.height=Math.round(innerHeight*q);gl.viewport(0,0,cv.width,cv.height);pede=true}
 addEventListener('resize',tam);tam();
 let ult=0;function pinta(t){gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,reduz?12:t/1000);gl.uniform1f(U.N,nivelAtual);gl.uniform1f(U.L,linha);gl.drawArrays(gl.TRIANGLES,0,3)}
 function quadro(t){requestAnimationFrame(quadro);if(document.hidden)return;if(reduz&&!pede)return;if(t-ult<(innerWidth<820?33:16))return;ult=t;pede=false;pinta(t)}
 pinta(0);requestAnimationFrame(quadro)})();

let marcos=[];
function medeMarcos(){marcos=$$('[data-nivel]').map(s=>({y:s.getBoundingClientRect().top+scrollY,n:+s.dataset.nivel,m:+s.dataset.metros,nome:s.dataset.nome})).sort((a,b)=>a.y-b.y)}
function rolou(){
  const vh=innerHeight,y=scrollY+vh*.42,det=$('.det');
  linha=det?2:.6+(scrollY/vh)*.95;
  let a=marcos[0],b=marcos[marcos.length-1];
  for(let i=0;i<marcos.length-1;i++)if(y>=marcos[i].y&&y<marcos[i+1].y){a=marcos[i];b=marcos[i+1];break}
  if(!a)return;
  const q=det||b===a?1:Math.min(1,Math.max(0,(y-a.y)/(b.y-a.y)));
  nivelAtual=det?a.n:a.n+(b.n-a.n)*q;pede=true;
  const m=Math.round((det?a.m:a.m+(b.m-a.m)*q)/5)*5;
  $('#metros').innerHTML=(m?'−'+m.toLocaleString('pt-BR'):'0')+' m<small>'+esc(a.nome)+'</small>';
  const total=document.documentElement.scrollHeight-vh;$('#medidor').style.setProperty('--pos',(100*scrollY/Math.max(1,total)).toFixed(1)+'%');
  const emCima=!det&&scrollY<vh*.72;$('#topo').classList.toggle('solido',!emCima);
  document.documentElement.style.setProperty('--cor-topo',emCima?'#0A1E4A':'#F7F3E6');
  $('#medidor').style.display=det?'none':'';
}
addEventListener('scroll',rolou,{passive:true});addEventListener('resize',()=>{medeMarcos();rolou()});

const LUGAR={mergulho:'mergulho',perfumes:'perfumes',pocoes:'pocoes',oraculo:'oraculo',cardume:'cardume'};
let naHome=false,primeira=true;
function rota(){const [a,b]=location.hash.replace(/^#\/?/,'').split('/');return {a:a||'',b}}
function desenha(){const {a,b}=rota(),main=$('#conteudo');
 const faz=()=>{if(a==='p'){main.innerHTML=detalhe(b);naHome=false;scrollTo({top:0,behavior:'instant'})}
  else{if(!naHome){main.innerHTML=home();naHome=true}
   if(LUGAR[a]){const e=document.getElementById(LUGAR[a]);if(e)requestAnimationFrame(()=>{e.scrollIntoView({behavior:reduz?'auto':'smooth'})})}else if(a==='')scrollTo({top:0,behavior:'instant'})}
  medeMarcos();rolou();atualizaSaco()};
 if(document.startViewTransition&&!reduz&&!primeira&&document.visibilityState==='visible'&&(a==='p'||!naHome)){const t=document.startViewTransition(faz);t.ready.catch(()=>{});t.finished.catch(()=>{})}else faz();primeira=false}
addEventListener('hashchange',desenha);
function atualizaSaco(){const n=Loja.sacola(M).reduce((s,i)=>s+i.qtd,0);$('#saco').textContent=`Sacola (${n})`}
function colocar(id){Loja.colocar(M,id);atualizaSaco();abreSacola()}
function abreSacola(){const ps=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),total=ps.reduce((s,x)=>s+x.p.preco*x.qtd,0),g=$('#gav');
 g.innerHTML=`<div class="gav"><button class="fechar" aria-label="Fechar" onclick="gav.close()">×</button><h2>Sua caixinha</h2>${ps.length?`<ul class="itens">${ps.map(x=>`<li><img src="${img(x.p.fotos[0],240)}" alt=""><div>${esc(x.p.nome)}<br>${x.qtd} × ${R(x.p.preco)}</div><button onclick="Loja.tirar(M,'${x.id}');abreSacola();atualizaSaco()">Tirar</button></li>`).join('')}</ul><div class="tot"><span>Total</span><span>${R(total)}</span></div><p class="miudo">${Loja.parcela(total,3)} ou Pix. O frete é calculado no próximo passo.</p><button class="acao" onclick="pagar()">Ir para o pagamento</button>`:`<div class="itens"><p style="margin-top:18px">Sua caixinha está vazia.</p></div><a class="acao" href="#/perfumes" onclick="gav.close()">Ver os perfumes</a>`}</div>`;if(!g.open)g.showModal()}
function abre(h){const d=$('#dlg');d.innerHTML=`<div class="modal"><button class="fechar" aria-label="Fechar" onclick="dlg.close()">×</button>${h}</div>`;if(!d.open)d.showModal()}
function abreMenu(){abre(`<ul class="lista-menu"><li><a href="#/perfumes" onclick="dlg.close()">Perfumes</a></li><li><a href="#/pocoes" onclick="dlg.close()">Cabelo e corpo</a></li><li><a href="#/oraculo" onclick="dlg.close()">Qual sereia é você</a></li><li><a href="#/cardume" onclick="dlg.close()">Cardume</a></li></ul>`)}
function pagar(){gav.close();abre(`<h2>Aqui entra o pagamento</h2><p>No site de verdade, este botão abre o pagamento da Nuvemshop que a Fada já usa: Pix, cartão, frete e nota fiscal.</p><button class="acao" onclick="dlg.close()">Entendi</button>`)}
function fila(id){const p=Loja.produto(M,id);abre(`<h2>${esc(p.nome)}</h2><p>${p.status==='estreia'?`Abre ${quando(p.estreia)}. Quem está na lista recebe o aviso antes.`:`Quando voltar à tona, você recebe o aviso antes de abrir para todo mundo.`}</p>
 <form onsubmit="entra(event,'${id}')"><label class="campo">Seu nome<input required name="nome" autocomplete="name"></label><label class="campo">WhatsApp com DDD<input required name="wa" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999"></label><label class="campo">E-mail<input name="email" type="email" autocomplete="email"></label><label class="op"><input type="checkbox" required name="ok">Aceito receber este aviso e novidades da Fada Marinha. Posso sair quando quiser.</label><button class="acao">Entrar na fila</button></form>`)}
function entra(e,id){e.preventDefault();const f=e.target,p=Loja.produto(M,id),pos=Loja.entrarNaFila(M,id,{nome:f.nome.value,wa:f.wa.value,email:f.email.value});abre(`<h2>Você é a ${pos}ª sereia da fila</h2><p>Avisamos no seu WhatsApp quando ${esc(p.nome)} voltar à tona. Com o app no celular, o aviso chega na hora.</p><button class="acao" onclick="baixar()">Baixar o app</button>`)}
function baixar(){const c=Instalar.conteudo();abre(`<h2>${c.t}</h2>${c.p.length>1?`<ol class="passos">${c.p.map(x=>`<li>${x}</li>`).join('')}</ol>`:`<p>${c.p[0]}</p>`}${c.botao?`<button class="acao" onclick="Instalar.tocar().then(()=>dlg.close())">Baixar agora</button>`:''}${c.copiar?`<button class="acao" onclick="Instalar.copiarEndereco();this.textContent='Endereço copiado'">Copiar o endereço</button>`:''}`)}
/* cada foto da loja existe em tamanhos diferentes: se um faltar, tenta os outros */
const TAMS=['-1024-1024.webp','-640-0.webp','-480-0.webp','-320-0.webp','-240-0.webp'];
addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;const u=i.src,k=TAMS.findIndex(t=>u.endsWith(t));if(k<0)return;const n=+(i.dataset.tent||0);if(n>=TAMS.length-1)return;i.dataset.tent=n+1;i.src=u.slice(0,-TAMS[k].length)+TAMS[(k+1)%TAMS.length]},true);
const gav=$('#gav'),dlg=$('#dlg'),grande=null;
[gav,dlg].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
Loja.aoMudar(()=>{naHome=false;if(!dlg.open&&!gav.open)desenha()});
setInterval(()=>$$('[data-fim]').forEach(e=>e.textContent=falta(e.dataset.fim)),30000);
desenha();
addEventListener('load',()=>{medeMarcos();rolou()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{medeMarcos();rolou()});
</script>
