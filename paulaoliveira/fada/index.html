<link rel="apple-touch-icon" href="icone-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://acdn-us.mitiendanube.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Figtree:wght@400;500;600&family=IM+Fell+Double+Pica:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--barra:30px;--mar:#0A1E4A;--espuma:#F7F3E6;--ouro:#E4BF6C;--ouro-e:#7A5A12;--conto:'IM Fell Double Pica','Iowan Old Style',Georgia,serif;--tx:'Figtree',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:#0B4F86;color:var(--mar);font:400 1.09rem/1.5 var(--tx);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.pular{position:fixed;left:12px;top:-80px;z-index:90;background:#fff;color:#000;padding:10px 14px}
.pular:focus{top:40px}
#agua{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(#BFEFEA,#0B4F86)}
.previa{position:fixed;inset:0 0 auto 0;height:var(--barra);z-index:70;background:#061233;color:#fff;display:flex;align-items:center;justify-content:center;font:500 13.5px/1 var(--tx);padding:0 44px;white-space:nowrap;overflow:hidden}
.previa span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.previa button{position:absolute;right:0;top:0;height:30px;width:44px;font-size:18px}
@media(max-width:640px){.previa{justify-content:flex-start;padding:0 44px 0 12px;font-size:12.5px}}

.topo{position:fixed;left:0;right:0;top:var(--barra);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:8px clamp(14px,3vw,40px);color:var(--cor-topo,var(--mar));transition:color .4s,background .4s}
.topo.solido{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 40%),rgba(10,30,74,.8);-webkit-backdrop-filter:blur(22px) saturate(160%) brightness(.84);backdrop-filter:blur(22px) saturate(160%) brightness(.84);color:var(--espuma)}
.marca{display:flex;align-items:center;gap:10px;font:400 clamp(23px,2vw,28px)/1 var(--conto);text-decoration:none}
.marca img{width:46px;height:46px;border-radius:50%;background:#0A1E4A;object-fit:cover}
.menu{display:flex;gap:clamp(16px,2.4vw,34px);font-weight:500;font-size:16px}
.menu a{text-decoration:none;padding:12px 0}
.menu a:hover{text-decoration:underline;text-underline-offset:5px}
.direita{display:flex;gap:18px;align-items:center}
.saco,.abre-menu,.lnk{display:inline-flex;align-items:center;font-weight:500;font-size:16px;min-height:44px;text-decoration:none}
.abre-menu{display:none}
@media(max-width:1200px){.menu{display:none}.abre-menu{display:inline-flex}}

/* medidor de profundidade */
.medidor{position:fixed;right:clamp(10px,1.6vw,24px);top:50%;transform:translateY(-50%);z-index:50;height:46vh;width:2px;background:color-mix(in srgb,var(--cor-topo,var(--mar)) 32%,transparent);color:var(--cor-topo,var(--mar));transition:opacity .4s}
.medidor>b{position:absolute;left:0;top:var(--pos,0%);width:10px;height:10px;margin:-5px 0 0 -4px;border-radius:50%;background:var(--ouro);box-shadow:0 0 12px var(--ouro);pointer-events:none}
#metros{position:absolute;right:18px;top:var(--pos,0%);transform:translateY(-50%);white-space:nowrap;text-align:right;font:400 14px/1.15 var(--mono);color:inherit;pointer-events:none}
#metros small{display:block;font:400 12.5px/1.15 var(--mono);opacity:.82}
.tick{position:absolute;left:-10px;width:22px;height:26px;margin-top:-13px;display:grid;place-items:center}
.tick::before{content:"";width:9px;height:1.5px;background:currentColor;opacity:.75;transition:width .2s}
.tick:hover::before{width:16px}
.tick span{position:absolute;right:30px;top:50%;transform:translate(6px,-50%);opacity:0;white-space:nowrap;background:#061233eb;color:#fff;padding:6px 10px;border-radius:14px;font:400 13px/1.1 var(--mono);pointer-events:none;transition:opacity .18s,transform .18s}
.tick:hover span,.tick:focus-visible span{opacity:1;transform:translate(0,-50%)}
.tick small{opacity:.78;margin-left:8px;font-size:12px}
@media(max-width:820px){.medidor{top:auto;bottom:calc(var(--tab) + 10px);right:auto;left:10px;transform:none;height:auto;width:auto;background:#061233e0;border-radius:30px;color:#fff}.medidor>b,#ticks{display:none}#metros{position:static;transform:none;display:block;padding:12px 14px;font-size:13px;pointer-events:auto}#metros small{display:inline;margin-left:8px;font-size:12.5px}}
main{position:relative;z-index:1}
.z{position:relative;padding:clamp(70px,12vh,150px) clamp(16px,6vw,110px)}
.z.claro{color:var(--espuma);text-shadow:0 1px 14px #061432a6,0 0 2px #06143270}
.z.escuro{color:var(--mar)}

/* superfície */
.sup-wrap{position:relative;height:calc(100svh + 115vh)}
.sup{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:calc(var(--barra) + 74px) 16px 22px;color:var(--mar)}
.sup-baixo{display:flex;flex-direction:column;align-items:center}
.sup-acoes{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 22px}
@media(min-aspect-ratio:4/3){.sup p{max-width:none!important}}
@media(max-height:700px){.mergulhar{min-height:50px!important}}
@media(max-height:540px),(prefers-reduced-motion:reduce){.sup-wrap{height:auto}.sup{position:relative;height:auto;min-height:100svh}}
.tit{position:relative;font:400 clamp(56px,min(13.4vw,24svh),214px)/.88 var(--conto);letter-spacing:-.018em}
.tit .l{display:block}
.tit em.l{font-style:italic}
.c-ar{display:block;color:var(--mar)}
.c-agua{display:none;position:absolute;inset:0;color:#0C3070;opacity:.94}
.agua .c-agua{display:block}
.c-agua .l{transform-origin:50% 0}
@media(max-height:700px){.tit{font-size:clamp(56px,min(13.4vw,22.5svh),214px)}}
@media(max-width:640px){.tit{font-size:min(21.5vw,15svh)}}
.sup p{font-size:clamp(18px,min(1.7vw,3.2svh),24px);margin:clamp(10px,2svh,24px) auto clamp(12px,2.2svh,26px);max-width:31ch;line-height:1.3;font-weight:500}
.mergulhar{display:inline-flex;align-items:center;gap:10px;min-height:58px;padding:0 32px;background:var(--mar);color:var(--espuma);border-radius:40px;font:500 19px/1 var(--tx);text-decoration:none;transition:transform .25s}
.mergulhar:hover{transform:translateY(5px)}

/* bem-vinda */
.bem{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(24px,5vw,80px);align-items:center}
.bem h2{font:400 clamp(50px,7.4vw,118px)/.94 var(--conto)}
.bem p{font-size:clamp(20px,1.65vw,24px);line-height:1.38;margin-top:24px;max-width:33em;font-weight:500}
.vers{list-style:none;padding:0;margin-top:28px;font:italic 400 clamp(30px,3.1vw,46px)/1.12 var(--conto)}
.bem figure{aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--ouro-e),0 0 0 14px #ffffff2e}
.bem figure img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.bem{grid-template-columns:1fr}.bem figure{max-width:82vw;margin:auto}}

/* zona */
.cab{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;margin-bottom:clamp(30px,5vw,68px)}

.cab .m{font:400 clamp(16px,1.3vw,19px)/1 var(--mono);grid-column:1/-1;margin-bottom:10px}
.cab h2{font:400 clamp(66px,11vw,180px)/.86 var(--conto);letter-spacing:-.015em}
.cab p{font:italic 400 clamp(24px,2.3vw,35px)/1.08 var(--conto);padding-bottom:.45em;max-width:15em}
@media(max-width:820px){.cab{grid-template-columns:1fr}.cab p{padding:0}}
.bolhas{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(22px,3vw,44px) clamp(14px,2vw,30px)}
.bolha{position:relative;grid-column:span 3;display:flex;flex-direction:column;align-items:center;text-align:center}
.bolha:nth-child(4n+1){grid-column:span 4}
.bolha:nth-child(4n+2){margin-top:clamp(30px,7vw,100px)}
.bolha:nth-child(4n+3){grid-column:span 2;margin-top:clamp(8px,2vw,30px)}
.bolha:nth-child(4n){margin-top:clamp(50px,9vw,130px)}
.vigia{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px var(--ouro),0 0 0 8px #ffffff1c;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.vigia img{width:100%;height:100%;object-fit:cover}
.bolha:hover .vigia{transform:translateY(-10px) scale(1.03)}
.bolha h3{font:400 clamp(24px,2.1vw,33px)/1.02 var(--conto);margin-top:14px}
.bolha a.t{text-decoration:none}
.bolha .inf{font-size:16px;margin-top:4px;font-weight:500}
.bolha .est{font:400 13.5px/1.2 var(--mono);margin-top:4px}
.pil{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:9px;padding:0 18px;border-radius:30px;font:500 15.5px/1 var(--tx);box-shadow:inset 0 0 0 1.5px currentColor;transition:background .2s,color .2s}
.pil:hover{background:currentColor}
.pil:hover span{color:#0B3F70}
.z.escuro .pil:hover span{color:#BFEFEA}
.pil.chei{background:var(--ouro);color:#201505;box-shadow:none}
.pil.chei:hover{background:var(--espuma)}
.pil.chei:hover span{color:#201505}
@media(max-width:820px){.bolhas{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 16px}.bolha,.bolha:nth-child(n){grid-column:span 1;margin-top:0}.bolha:nth-child(even){margin-top:46px}.bolha:nth-child(3n+1){grid-column:span 2;width:74%;justify-self:center;margin-top:0}}

/* oráculo */
.oraculo{text-align:center}
.oraculo h2{font:400 clamp(60px,10vw,160px)/.9 var(--conto)}
.oraculo .sub{font-size:clamp(20px,1.7vw,24px);font-weight:500;margin-top:14px}
.pergunta{margin-top:clamp(28px,4vw,50px);min-height:320px}
.pergunta h3{font:italic 400 clamp(32px,3.8vw,58px)/1.06 var(--conto);margin-bottom:24px}
.respostas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:1100px;margin:auto}
.respostas button{min-height:120px;padding:16px;border-radius:26px;background:#ffffff42;font:500 clamp(18px,1.5vw,21px)/1.2 var(--tx);transition:background .2s,transform .2s;color:var(--mar)}
.respostas button:hover{background:#ffffffa6;transform:translateY(-4px)}
@media(max-width:820px){.respostas{grid-template-columns:1fr 1fr}.respostas button{min-height:92px}}
.pontos{font:400 14.5px/1 var(--mono);margin-bottom:14px}
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:center;text-align:left;max-width:1000px;margin:auto}
.result .vigia{max-width:380px;justify-self:center}
.result h3{font:400 clamp(44px,5.6vw,84px)/.94 var(--conto)}
.result p{font-size:20px;margin:12px 0 18px;font-weight:500}
@media(max-width:820px){.result{grid-template-columns:1fr;text-align:center}}

/* prateleira */
.prat{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x proximity;padding:14px clamp(16px,6vw,110px) 18px;margin:0 calc(clamp(16px,6vw,110px)*-1);scrollbar-width:none}
.prat::-webkit-scrollbar{display:none}
.prat .bolha,.prat .bolha:nth-child(n){flex:0 0 clamp(150px,17vw,230px);grid-column:auto;margin:0;scroll-snap-align:center;width:auto}
.prat .bolha h3{font-size:clamp(22px,1.7vw,27px)}
.rot{font:italic 400 clamp(34px,3.6vw,54px)/1 var(--conto);margin:30px 0 8px}

/* próxima maré */
.mare{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,6vw,100px);align-items:center;margin-bottom:clamp(50px,8vw,120px)}
.mare .vigia{box-shadow:0 0 0 2px var(--ouro),0 0 60px #e4bf6c55,0 0 0 16px #ffffff12}
.mare .sel{font:400 clamp(16px,1.3vw,19px)/1.2 var(--mono);color:var(--ouro)}
.mare h3{font:400 clamp(58px,8.4vw,136px)/.9 var(--conto);margin:10px 0}
.mare .fr{font:italic 400 clamp(26px,2.4vw,37px)/1.12 var(--conto)}
.mare .tempo{font:400 clamp(30px,3vw,46px)/1 var(--mono);margin:20px 0}
.mare .pil{min-height:56px;padding:0 30px;font-size:18px}
@media(max-width:820px){.mare{grid-template-columns:1fr;text-align:center}.mare .vigia{max-width:78vw;margin:auto}}

/* cardume */
.card{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:30px;align-items:center}
.card h2{font:400 clamp(60px,9.6vw,156px)/.9 var(--conto)}
.card ul{list-style:none;padding:0;margin:26px 0 28px;font-size:clamp(20px,1.7vw,24px);font-weight:500}
.card li{padding:9px 0;border-top:1px solid #f7f3e640}
.cel{justify-self:center;width:min(290px,74vw);aspect-ratio:9/18.6;border-radius:42px;background:#02050f;padding:9px;box-shadow:0 30px 70px #0009,0 0 0 1px #e4bf6c55}
.tela{width:100%;height:100%;border-radius:34px;background:linear-gradient(#0E5F8F,#0A1E4A);display:flex;flex-direction:column;align-items:center;padding-top:44px;color:#fff;overflow:hidden;text-shadow:none}
.hora{font:400 62px/1 var(--conto)}
.dia{font-size:15px;margin-bottom:24px}
.push{width:92%;background:#ffffffeb;color:#111;border-radius:18px;padding:11px 13px;font:400 15px/1.28 var(--tx)}
.push b{display:block;font:500 13px/1.2 var(--tx);color:#555;margin-bottom:2px}
.push+.push{margin-top:8px}
@media(max-width:820px){.card{grid-template-columns:1fr}}
.leito{text-align:center;padding:clamp(70px,14vh,170px) 16px 80px;color:var(--espuma)}
.leito h2{font:italic 400 clamp(40px,6vw,92px)/1 var(--conto)}
.leito nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;margin:30px 0 14px;font-size:16px}
.leito small{font-size:15px;opacity:.82}

/* detalhe */
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);min-height:100vh;padding:calc(var(--barra) + 90px) clamp(16px,6vw,110px) 80px;align-items:start}
.det.claro{color:var(--espuma);text-shadow:0 1px 16px #06143266}
.det-foto{position:sticky;top:calc(var(--barra) + 80px)}
.det-foto .vigia{view-transition-name:foto;box-shadow:0 0 0 2px var(--ouro),0 0 0 16px #ffffff14}
.miudas{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.miudas button{width:64px;height:64px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1.5px var(--ouro)}
.miudas img{width:100%;height:100%;object-fit:cover}
.det h1{font:400 clamp(58px,7.6vw,122px)/.9 var(--conto)}
.det .fr{font:italic 400 clamp(26px,2.5vw,38px)/1.14 var(--conto);margin:16px 0}
.det .pr{font:400 clamp(30px,2.8vw,42px)/1 var(--mono);margin-top:20px}
.det .pr small{display:block;font:500 16px/1.3 var(--tx);margin-top:6px}
.det .pil{min-height:56px;padding:0 30px;font-size:18px;margin-top:16px}
.det .nt{margin-top:22px;font:400 16px/1.5 var(--mono)}
.det .hist{margin-top:24px;font-size:19px;line-height:1.5;max-width:36em}
.det .hist p+p{margin-top:.7em}
.volta{display:inline-block;margin-bottom:20px;font-weight:500;text-decoration:none;min-height:44px}
@media(max-width:820px){.det{grid-template-columns:1fr}.det-foto{position:static}.det-foto .vigia{max-width:82vw;margin:auto}}

dialog{border:0;padding:0;color:var(--mar);background:#F7F3E6;font:400 18px/1.4 var(--tx);max-width:none}
dialog::backdrop{background:#02081dB3}
.modal{width:min(480px,calc(100vw - 24px));margin:auto;padding:28px;border-radius:28px}
dialog#dlg{border-radius:28px;margin:auto}
.modal h2{font:400 clamp(35px,5vw,45px)/1 var(--conto);margin-bottom:10px;padding-right:32px}
.fechar{position:absolute;right:8px;top:8px;width:44px;height:44px;font-size:26px;line-height:1}
.campo{display:block;margin-top:12px;font-size:16px;font-weight:500}
.campo input{display:block;width:100%;height:50px;margin-top:3px;padding:0 14px;font:inherit;font-weight:400;border:0;border-radius:14px;box-shadow:inset 0 0 0 1.5px #0a1e4a55;background:#fff;color:var(--mar)}
.op{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:15.5px;line-height:1.3}
.op input{width:22px;height:22px;margin:0;accent-color:var(--mar);flex:none}
.acao{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin-top:18px;background:var(--mar);color:var(--espuma);border-radius:40px;font:500 18px/1 var(--tx);text-decoration:none}
dialog.gaveta{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(430px,100vw)}
.gav{display:flex;flex-direction:column;height:100%;padding:24px}
.gav h2{font:400 44px/1 var(--conto)}
.itens{flex:1;overflow:auto;margin:14px 0;list-style:none;padding:0}
.itens li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border-top:1px solid #0a1e4a33;padding:9px 0}
.itens img{width:64px;height:64px;object-fit:cover;border-radius:50%}
.itens button{font-size:15px;text-decoration:underline;min-height:44px}
.tot{display:flex;justify-content:space-between;font:400 26px/1 var(--mono)}
.miudo{font-size:15px;margin-top:8px}
ol.passos{padding-left:1.2em;margin-top:6px}ol.passos li{margin-top:5px}
.lista-menu{list-style:none;padding:0;font:400 36px/1.3 var(--conto)}
.lista-menu a{text-decoration:none;display:block;padding:6px 0}
::view-transition-old(foto),::view-transition-new(foto){animation-duration:.5s}

/* ---------- v2: revisão de UX ---------- */
:root{--tab:0px;--ease:cubic-bezier(.2,.8,.2,1)}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main:focus{outline:none}
[id]{scroll-margin-top:calc(var(--barra) + 84px)}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
.bolha .inf,.det .pr,.tot,.qtd b,.tempo{font-variant-numeric:tabular-nums}
s{opacity:.72;font-size:.86em;margin-right:.3em}
.nb{display:inline-block;white-space:nowrap}
dialog{overscroll-behavior:contain}
dialog#dlg[open]{animation:surge .3s var(--ease)}
dialog.gaveta[open]{animation:gaveta .34s var(--ease)}
.modal:focus,.gav:focus{outline:none}
@keyframes surge{from{opacity:0;transform:translateY(18px)}}
@keyframes gaveta{from{transform:translateX(100%)}}
@keyframes lencol{from{transform:translateY(100%)}}
@media(max-width:560px){dialog#dlg{margin:auto 0 0;width:100%;border-radius:28px 28px 0 0}.modal{width:100%;padding:24px 18px calc(22px + env(safe-area-inset-bottom))}dialog#dlg[open]{animation-name:lencol}}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.marca img{box-shadow:0 0 0 1px #e4bf6c99}

function muda(id,d){const it=Loja.sacola(M).find(i=>i.id===id);if(!it)return;semAvisar(()=>Loja.quantidade(M,id,it.qtd+d));abreSacola();atualizaSaco()}
function aplicaCupom(e){e.preventDefault();const c=Rec.cupom(M,e.target.querySelector('input').value);bolsa.cupom=c;bolsa.erro=c?'':'Esse cupom não existe. Confira as letras e tente de novo.';abreSacola()}
function calcFrete(e){e.preventDefault();const v=e.target.querySelector('input').value,o=Rec.frete(v);bolsa.cep=v;bolsa.opcoes=o;bolsa.envio=o?o[0]:null;bolsa.erro=o?'':'O CEP tem 8 números. Confira e tente de novo.';abreSacola()}
function escolheEnvio(id){bolsa.envio=bolsa.opcoes.find(o=>o.id===id);abreSacola()}
function frete(e){e.preventDefault();const o=Rec.frete(e.target.querySelector('input').value);$('#fr').innerHTML=o?`<ul class="fr-op">${o.map(x=>`<li><span>${x.nome}</span><b style="font-weight:500">${R(x.valor)}</b></li>`).join('')}</ul><small>Valores de exemplo para São Paulo/SP.</small>`:'<p>O CEP tem 8 números. Confira e tente de novo.</p>'}
function abreSacola(){
 const foco=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null;
 const ps=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),sub=ps.reduce((s,x)=>s+x.p.preco*x.qtd,0),desc=bolsa.cupom?Math.round(sub*bolsa.cupom.pct)/100:0,env=bolsa.envio?bolsa.envio.valor:0,total=sub-desc+env,g=$('#gav');
 g.innerHTML=`<div class="gav" tabindex="-1" autofocus><button class="fechar" aria-label="Fechar" onclick="gav.close()">×</button><h2>Sua caixinha</h2>${ps.length?`<ul class="itens">${ps.map(x=>`<li><img src="${img(x.p.fotos[0],240)}" alt=""><div>${esc(x.p.nome)}<br>${R(x.p.preco)}</div><div class="qtd"><button data-f="m${x.id}" aria-label="Tirar um ${esc(x.p.nome)}" onclick="muda('${x.id}',-1)">−</button><b aria-live="polite">${x.qtd}</b><button data-f="p${x.id}" aria-label="Colocar mais um ${esc(x.p.nome)}" onclick="muda('${x.id}',1)">+</button></div></li>`).join('')}</ul>
 <div class="gav-fim">${bolsa.erro?`<p class="erro" role="alert">${bolsa.erro}</p>`:''}<form class="linha-f" onsubmit="calcFrete(event)"><input inputmode="numeric" name="cep" autocomplete="postal-code" aria-label="CEP para calcular o frete" placeholder="CEP para o frete…" value="${esc(bolsa.cep)}" oninput="Rec.mascaraCep(this)"><button>Calcular</button></form><a class="sei-cep" href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" rel="noopener">Não sei meu CEP</a>
 ${bolsa.opcoes?bolsa.opcoes.map(o=>`<label class="env"><input type="radio" name="env" ${bolsa.envio&&bolsa.envio.id===o.id?'checked':''} onchange="escolheEnvio('${o.id}')">${o.nome}<b>${R(o.valor)}</b></label>`).join('')+'<p class="miudo" style="margin-top:0">Valores de exemplo para São Paulo/SP.</p>':''}
 <details class="dob" ${bolsa.cupom?'open':''}><summary>Tenho um cupom</summary><form class="linha-f" onsubmit="aplicaCupom(event)"><input name="cupom" autocomplete="off" spellcheck="false" aria-label="Código do cupom" placeholder="Para testar: CARDUME10…" value="${bolsa.cupom?bolsa.cupom.codigo:''}"><button>Aplicar</button></form></details>
 <div class="soma"><div><span>Subtotal</span><span>${R(sub)}</span></div>${desc?`<div><span>Cupom ${bolsa.cupom.codigo}</span><span>−${R(desc)}</span></div>`:''}${env?`<div><span>Frete</span><span>${R(env)}</span></div>`:''}</div>
 <div class="tot"><span>Total</span><span>${R(total)}</span></div><p class="miudo">${Loja.parcela(total,3)} ou Pix.</p><button class="acao" onclick="pagar()">Ir para o pagamento</button></div>`:`<div class="itens"><p style="margin-top:18px">Sua caixinha está vazia.</p></div><a class="acao" href="#/perfumes" onclick="gav.close()">Ver os perfumes</a>`}</div>`;
 if(!g.open)g.showModal();
 if(foco){const f=g.querySelector(`[data-f="${foco}"]`);if(f)f.focus()}}
function abreBusca(){
 const b=$('#bus'),q=Rec.notas(Loja.produtos(M),8);
 b.innerHTML=`<div class="b-in"><div class="b-top"><label class="b-campo">${Rec.ico('busca')}<span class="so-leitor">Buscar</span><input id="b-q" type="search" placeholder="Nome ou nota: baunilha…" autocomplete="off" spellcheck="false" oninput="buscaViva(this.value)"></label><button class="lnk" onclick="bus.close()">Fechar</button></div><div class="b-chips">${q.map(n=>`<button class="b-chip" onclick="poeBusca('${n}')">${n}</button>`).join('')}</div><div id="b-res"></div></div>`;
 if(!b.open)b.showModal();
 if(matchMedia('(pointer:fine)').matches)$('#b-q').focus();
 buscaViva('');
}
function poeBusca(n){$('#b-q').value=n;buscaViva(n)}
function linhaRes(p){return `<li><a href="#/p/${p.id}"><img src="${img(p.fotos[0]||'',240)}" alt="" loading="lazy"><span><span class="n">${esc(p.nome)}</span><span class="e">${esc(p.medida)} · ${estado(p)}</span></span><span class="v">${precoLinha(p)}</span></a></li>`}
function buscaViva(v){
 const r=$('#b-res'),todos=Loja.produtos(M);
 if(!v.trim()){const l=todos.filter(p=>p.status==='disponivel');r.innerHTML=`<p class="b-n">À tona agora</p><ul class="res-l">${l.map(linhaRes).join('')}</ul>`;return}
 const l=Rec.buscar(todos,v);
 r.innerHTML=l.length?`<p class="b-n" aria-live="polite">${l.length} ${l.length===1?'resultado':'resultados'}</p><ul class="res-l">${l.map(linhaRes).join('')}</ul>`:`<p class="b-n" aria-live="polite">Nada com “${esc(v)}”</p><p>Tente uma nota, como baunilha, coco ou jasmim, ou <a href="#/perfumes">mergulhe nos perfumes</a>.</p>`;
}
/* som do mar: feito na hora pelo navegador, muda com a profundidade */
let SOM=null;
function ruido(A,k){const n=A.sampleRate*6|0,b=A.createBuffer(2,n,A.sampleRate),f=A.sampleRate*.5|0;for(let c=0;c<2;c++){const d=b.getChannelData(c);let u=0,mx=0;for(let i=0;i<n;i++){u+=k*((Math.random()*2-1)-u);d[i]=u;mx=Math.max(mx,Math.abs(u))}for(let i=0;i<n;i++)d[i]/=mx;for(let i=0;i<f;i++){const g=i/f;d[i]=d[i]*g+d[n-f+i]*(1-g)}}const s=A.createBufferSource();s.buffer=b;s.loop=true;s.loopEnd=(n-f)/A.sampleRate;return s}
function criaSom(){
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
 const A=new C(),m=A.createGain();m.gain.value=0;m.connect(A.destination);
 const r1=ruido(A,.28),lp=A.createBiquadFilter(),hp=A.createBiquadFilter(),g1=A.createGain(),ge=A.createGain();lp.type='lowpass';lp.frequency.value=2400;hp.type='highpass';hp.frequency.value=120;g1.gain.value=.34;ge.gain.value=.6;
 r1.connect(hp);hp.connect(lp);lp.connect(ge);ge.connect(g1);g1.connect(m);
 [[.083,.26],[.137,.14]].forEach(([f,a])=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=a;o.connect(g);g.connect(ge.gain);o.start()});
 const r2=ruido(A,.018),lp2=A.createBiquadFilter(),g2=A.createGain();lp2.type='lowpass';lp2.frequency.value=190;g2.gain.value=0;r2.connect(lp2);lp2.connect(g2);g2.connect(m);
 r1.start();r2.start();
 return {A,m,lp,g1,g2,on:false,t:0};
}
function somBolha(){const A=SOM.A,o=A.createOscillator(),g=A.createGain(),t=A.currentTime,f=300+Math.random()*560,d=.05+Math.random()*.1;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.9,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05+.07*nivelAtual,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(SOM.m);o.start(t);o.stop(t+d+.02)}
function agendaBolha(){clearTimeout(SOM.t);if(!SOM.on)return;SOM.t=setTimeout(()=>{if(SOM.on&&nivelAtual>.12&&!document.hidden)somBolha();agendaBolha()},500+Math.random()*3200*(1.25-nivelAtual))}
function ajustaSom(){if(!SOM||!SOM.on)return;const t=SOM.A.currentTime,N=Math.max(nivelAtual,progresso*.22),s=(a,b,x)=>{const k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k)};SOM.g1.gain.setTargetAtTime(.34*(1-s(.04,.62,N)),t,.4);SOM.lp.frequency.setTargetAtTime(2400-1900*s(0,.5,N),t,.4);SOM.g2.gain.setTargetAtTime(.75*s(.12,.8,N),t,.5)}
function alternaSom(){
 if(!SOM)SOM=criaSom();if(!SOM)return;
 const b=$('#som'),t=SOM.A.currentTime;SOM.on=!SOM.on;
 if(SOM.on){SOM.A.resume();SOM.m.gain.cancelScheduledValues(t);SOM.m.gain.setTargetAtTime(.8,t,.5);ajustaSom();agendaBolha()}
 else{SOM.m.gain.cancelScheduledValues(t);SOM.m.gain.setTargetAtTime(0,t,.18);clearTimeout(SOM.t);setTimeout(()=>{if(!SOM.on)SOM.A.suspend()},900)}
 b.setAttribute('aria-pressed',SOM.on);b.setAttribute('aria-label',SOM.on?'Desligar o som do mar':'Ligar o som do mar');b.innerHTML=Rec.ico(SOM.on?'somon':'somoff');
}
document.addEventListener('visibilitychange',()=>{if(!SOM||!SOM.on)return;SOM.m.gain.setTargetAtTime(document.hidden?0:.8,SOM.A.currentTime,.2)});
function abre(h){const d=$('#dlg');d.innerHTML=`<div class="modal" tabindex="-1" autofocus><button class="fechar" aria-label="Fechar" onclick="dlg.close()">×</button>${h}</div>`;if(!d.open)d.showModal()}
function abreMenu(){abre(`<ul class="lista-menu">${[['tudo','O mar inteiro'],['perfumes','Perfumes'],['pocoes','Cabelo e corpo'],['oraculo','Qual sereia é você'],['cardume','Cardume'],['pg/quem-somos','Quem somos'],['pg/contato','Fale com a Fada'],['conta','Minha conta']].map(([a,t])=>`<li><a href="#/${a}" onclick="dlg.close()">${t}</a></li>`).join('')}</ul>`)}
function pagar(){gav.close();abre(`<h2>Aqui entra o pagamento</h2><p>No site de verdade, este botão abre o pagamento da Nuvemshop que a Fada já usa: Pix, cartão, frete e nota fiscal.</p><button class="acao" onclick="dlg.close()">Entendi</button>`)}
function fila(id){const p=Loja.produto(M,id);abre(`<h2>${esc(p.nome)}</h2><p>${p.status==='estreia'?`Abre ${quando(p.estreia)}. Quem está na lista recebe o aviso antes.`:`Quando voltar à tona, você recebe o aviso antes de abrir para todo mundo.`}</p>
 <form onsubmit="entra(event,'${id}')"><label class="campo">Seu nome<input required name="nome" autocomplete="name"></label><label class="campo">WhatsApp com DDD<input required name="wa" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999…" oninput="Rec.mascaraTel(this)"></label><label class="op"><input type="checkbox" required name="ok">Aceito receber este aviso e novidades da Fada Marinha. Posso sair quando quiser.</label><button class="acao">Entrar na fila</button></form>`)}
function entra(e,id){e.preventDefault();const f=e.target,p=Loja.produto(M,id);let pos=0;semAvisar(()=>{pos=Loja.entrarNaFila(M,id,{nome:f.nome.value,wa:f.wa.value,meu:true});Loja.mexe(s=>{if(s.espera[0])s.espera[0].senha=pos})});
 const url=location.href.split('#')[0]+'#/p/'+id,txt=`Sou a ${pos}ª sereia na fila de ${p.nome}, da Fada Marinha.`;
 abre(`<h2>Você é a ${pos}ª sereia da fila</h2>${concha(Loja.produto(M,id),pos)}<p>Avisamos no seu WhatsApp quando ${esc(p.nome)} voltar à tona, antes de abrir para todo mundo.</p><a class="acao" href="${Rec.redes(url,txt)[0].u}" target="_blank" rel="noopener">Chamar uma amiga</a><button class="acao vazada" onclick="baixar()">Baixar o app</button>`)}
function baixar(){const c=Instalar.conteudo();abre(`<h2>${c.t}</h2>${c.p.length>1?`<ol class="passos">${c.p.map(x=>`<li>${x}</li>`).join('')}</ol>`:`<p>${c.p[0]}</p>`}${c.botao?`<button class="acao" onclick="Instalar.tocar().then(()=>dlg.close())">Baixar agora</button>`:''}${c.copiar?`<button class="acao" onclick="Instalar.copiarEndereco();this.textContent='Endereço copiado'">Copiar o endereço</button>`:''}`)}
/* cada foto da loja existe em tamanhos diferentes: se um faltar, tenta os outros */
const TAMS=['-1024-1024.webp','-640-0.webp','-480-0.webp','-320-0.webp','-240-0.webp'];
addEventListener('error',e=>{const i=e.target;if(i.tagName!=='IMG')return;const u=i.src,k=TAMS.findIndex(t=>u.endsWith(t));if(k<0)return;const n=+(i.dataset.tent||0);if(n>=TAMS.length-1)return;i.dataset.tent=n+1;i.src=u.slice(0,-TAMS[k].length)+TAMS[(k+1)%TAMS.length]},true);
const gav=$('#gav'),dlg=$('#dlg'),bus=$('#bus');
[gav,dlg].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
bus.addEventListener('click',e=>{if(e.target.closest('a'))bus.close()});
Loja.aoMudar(()=>{if(semAviso)return;naHome=false;if(!dlg.open&&!gav.open){const y=scrollY;desenha(true);scrollTo({top:y,behavior:'instant'})}});
setInterval(()=>$$('[data-fim]').forEach(e=>e.textContent=falta(e.dataset.fim)),30000);
Rec.hidrataIcones();
Rec.mostraCookies();
iniciaPeixes();
desenha();
addEventListener('load',()=>{medeMarcos();rolou()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{medeMarcos();rolou()});
</script>
