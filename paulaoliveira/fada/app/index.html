<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fada Marinha</title>
<meta name="description" content="O app da Fada Marinha: perfumaria botânica, cosméticos naturais, Escola da Fada e Receitas exclusivas para membros.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5EBDF">
<meta property="og:title" content="Fada Marinha · o app">
<meta property="og:description" content="Perfumes, Escola da Fada, Receitas exclusivas e o Clube da Fada.">
<meta property="og:image" content="compartilhar.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fada Marinha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="arte/agua.webp">
<style>
/* Paleta e letras tiradas da prancha que a Fada mandou: creme, areia, azul-claro, ardósia, pérola; Montserrat + Cormorant Garamond */
:root{--creme:#F5EBDF;--creme2:#EFE2D3;--cartao:#FBF5EE;--areia:#D9BC9A;--azul:#B9C9CC;--ardosia:#5F7D82;--perola:#E9D9D1;--ouro:#A98451;--ouro-c:#C9A46A;--ouro-e:#7A5A2E;--tinta:#33241A;--tinta2:#6F5B4A;--linha:#33241a1c;
 --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',system-ui,-apple-system,sans-serif;
 --topo:calc(56px + env(safe-area-inset-top));--nav:calc(66px + env(safe-area-inset-bottom));--ease:cubic-bezier(.2,.8,.2,1);
 --dourado:linear-gradient(180deg,#A07D4E,#7E5D34)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E7DACB;-webkit-text-size-adjust:100%;scroll-padding-top:var(--topo)}
body{position:relative;max-width:480px;min-height:100svh;margin:0 auto;padding-bottom:calc(var(--nav) + 18px);color:var(--tinta);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
 background:radial-gradient(130% 55% at 100% 0%,#fff9 0,#fff0 60%),radial-gradient(110% 45% at 0% 100%,#B9C9CC40 0,#B9C9CC00 70%),var(--creme)}
@media(min-width:520px){body{box-shadow:0 0 0 1px #33241a10,0 40px 90px -40px #5a3f2480}}
img{display:block;max-width:100%}
#conteudo{display:flow-root;outline:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ouro-e);outline-offset:3px;border-radius:6px}
.fixo{position:fixed;left:50%;width:min(100%,480px);transform:translateX(-50%)}

/* ícones de linha dourada */
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.estrela{display:block;width:14px;height:14px;fill:var(--ouro)}

/* topo */
.topo{top:0;z-index:40;height:var(--topo);padding:env(safe-area-inset-top) 10px 0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;transition:background .35s,box-shadow .35s}
.topo.rolou{background:color-mix(in srgb,var(--creme) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 1px 0 var(--linha)}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--tinta)}
.ib .pt{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--ouro);box-shadow:0 0 0 2px var(--creme)}
.marca{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font:500 12px/1 var(--sans);letter-spacing:.3em;color:var(--ouro-e);padding-left:.3em}
.marca .estrela{width:11px;height:11px;transition:transform .2s linear}
body.sem-topo .topo{display:none}

/* navegação de baixo */
.nav{bottom:0;z-index:40;height:var(--nav);padding:0 6px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--cartao) 82%,transparent);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:0 -1px 0 var(--linha)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font:500 11px/1 var(--sans);color:var(--tinta2)}
.nav a .i{width:23px;height:23px}
.nav a[aria-current=page]{color:var(--ouro-e)}
.nav a[aria-current=page] .i{stroke-width:1.8}
.nav a[aria-current=page]::before{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:var(--ouro)}
.sacola-f{bottom:calc(var(--nav) + 12px);z-index:39;display:flex;justify-content:flex-end;padding:0 14px;pointer-events:none}
.sacola-f button{pointer-events:auto;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 14px;border-radius:26px;background:var(--dourado);color:#FFF8EE;font:600 13px/1 var(--sans);box-shadow:0 12px 26px -10px #5a3f2499}
.sacola-f[hidden]{display:none}

/* tipografia */
.titulo{font:italic 500 40px/1.02 var(--serif);letter-spacing:-.01em;color:var(--tinta)}
.rotulo{font:500 11px/1.2 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ouro-e)}
.lead{font:400 19px/1.35 var(--serif);color:var(--tinta2)}
.cab{padding:calc(var(--topo) + 6px) 22px 6px;text-align:center}
.cab .estrela{margin:0 auto 12px;width:16px;height:16px}
.cab .lead{max-width:24ch;margin:10px auto 0}
.secao{padding:28px 18px 0}
.secao h2{font:italic 500 28px/1.05 var(--serif);margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.secao h2 a{font:500 12px/1 var(--sans);font-style:normal;color:var(--ouro-e);text-decoration:none;white-space:nowrap}

/* botões */
.acao{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:0 22px;border:0;border-radius:30px;background:var(--dourado);color:#FFF8EE;font:600 12.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;box-shadow:0 12px 24px -14px #7a5a2ecc,inset 0 1px 0 #ffffff40;cursor:pointer;transition:transform .2s var(--ease),filter .2s}
.acao:active{transform:scale(.98)}
.acao.vazada{background:transparent;color:var(--ouro-e);box-shadow:inset 0 0 0 1.3px var(--ouro)}
.acao.curta{width:auto;display:inline-flex;min-height:44px;padding:0 22px;margin-top:12px}
.campo{display:block;margin-top:12px;font:500 13px/1.3 var(--sans);color:var(--tinta2)}
.campo input,.campo select,.campo textarea{display:block;width:100%;margin-top:6px;padding:13px 14px;border:0;border-radius:14px;background:#fff;color:var(--tinta);font:400 16px/1.3 var(--sans);box-shadow:inset 0 0 0 1.2px #33241a26}
.miudo{font-size:13px;line-height:1.4;color:var(--tinta2);margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px;line-height:1.35;color:var(--tinta2)}
.op input{margin-top:2px;accent-color:var(--ouro-e);width:18px;height:18px;flex:none}

/* revelar ao rolar */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.vis{opacity:1;transform:none}

/* ---------- abertura ---------- */
.abertura{position:fixed;inset:0;z-index:90;overflow:hidden;background:#DCE3E0;transition:opacity .7s var(--ease),transform .9s var(--ease)}
.abertura.sai{opacity:0;transform:scale(1.04);pointer-events:none}
.ab-mar{position:absolute;inset:-12%;}
.ab-mar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) saturate(1.08);animation:mar 18s ease-in-out infinite alternate}
.ab-mar img.m2{mix-blend-mode:screen;opacity:.55;animation-duration:23s;animation-direction:alternate-reverse}
@keyframes mar{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.22) translate(-4%,3%)}}
.ab-veu{position:absolute;inset:0;background:linear-gradient(180deg,#F5EBDF00 0%,#F5EBDF55 30%,#F5EBDFd9 58%,#F5EBDF 82%)}
.ab-luz{position:absolute;inset:0;mix-blend-mode:soft-light;background:radial-gradient(40% 30% at 30% 20%,#fff 0,#fff0 70%),radial-gradient(35% 25% at 75% 35%,#fff 0,#fff0 70%);animation:luz 9s ease-in-out infinite alternate}
@keyframes luz{to{transform:translate(6%,4%) scale(1.1);opacity:.6}}
.ab-concha{position:absolute;left:-30px;bottom:-20px;width:50%;max-width:230px;-webkit-mask:radial-gradient(closest-side at 45% 60%,#000 40%,#0000 100%);mask:radial-gradient(closest-side at 45% 60%,#000 40%,#0000 100%);opacity:.95}
.ab-in{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 34px calc(env(safe-area-inset-bottom) + 34px);text-align:center}
.sereia{width:210px;aspect-ratio:640/514;-webkit-mask:url(arte/sereia-mascara.png) center/contain no-repeat;mask:url(arte/sereia-mascara.png) center/contain no-repeat;background:linear-gradient(105deg,#8E6A37 0%,#B48F59 30%,#F3DFB2 46%,#FFF4D9 50%,#F3DFB2 54%,#B48F59 70%,#8E6A37 100%) 0 0/300% 100%;animation:ouro 6s ease-in-out infinite}
@keyframes ouro{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.ab-nome{margin-top:14px;font:400 23px/1 var(--sans);letter-spacing:.32em;padding-left:.32em;color:#8E6A37}
.ab-in .estrela{margin:18px auto 0;width:16px;height:16px}
.ab-frase{margin-top:22px;font:italic 500 23px/1.32 var(--serif);color:var(--tinta);max-width:17ch}
.ab-in .acao{max-width:260px;margin-top:34px}
.ab-in>*{animation:sobe 1.1s var(--ease) both}
.ab-in>:nth-child(2){animation-delay:.12s}.ab-in>:nth-child(3){animation-delay:.2s}.ab-in>:nth-child(4){animation-delay:.32s}.ab-in>:nth-child(5){animation-delay:.46s}.ab-in>:nth-child(6){animation-delay:.6s}
@keyframes sobe{from{opacity:0;transform:translateY(18px)}}

/* ---------- início ---------- */
.heroi{position:relative;display:block;margin:calc(var(--topo) + 4px) 14px 0;height:214px;border-radius:26px;overflow:hidden;text-decoration:none;background:#EADBCB;box-shadow:0 18px 40px -26px #5a3f2499}
.heroi .h-img{position:absolute;inset:-10% -6% -10% 16%;will-change:transform}
.heroi .h-img img{width:100%;height:100%;object-fit:cover}
.heroi::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#F3E6D6 0%,#F3E6D6 22%,#F3E6D6cc 36%,#F3E6D600 70%)}
.heroi .h-tx{position:absolute;z-index:1;left:22px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;will-change:transform}
.heroi h1{font:italic 500 40px/.98 var(--serif)}
.heroi span{margin-top:14px;font:500 12.5px/1 var(--sans);color:var(--tinta2);display:flex;gap:8px;align-items:center}
.ladrilhos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 14px 0}
.ladrilhos a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1.02;padding:10px 6px;border-radius:20px;background:linear-gradient(180deg,#FCF7F1,#F4E8DA);box-shadow:0 1px 0 #fff inset,0 10px 22px -18px #5a3f2499,0 0 0 1px #33241a0d;text-decoration:none;text-align:center;font:600 15.5px/1.05 var(--serif);color:var(--tinta);transition:transform .25s var(--ease)}
.ladrilhos a:active{transform:scale(.96)}
.ladrilhos .i{width:32px;height:32px;color:var(--ouro);stroke-width:1.2}
.mare{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;align-items:center;padding:20px 18px;border-radius:24px;background:linear-gradient(135deg,#EEF1EE,#E3E9E8 55%,#F1E6DA);overflow:hidden;text-decoration:none;box-shadow:0 0 0 1px #33241a0d}
.mare .rotulo{color:var(--ardosia)}
.mare h3{font:italic 500 32px/1 var(--serif);margin:8px 0 6px}
.mare p{font-size:13.5px;line-height:1.4;color:var(--tinta2)}
.mare .conta{display:flex;gap:6px;margin-top:12px}
.mare .conta b{display:grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border-radius:12px;background:#ffffffb3;font:600 16px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--tinta)}
.mare .conta small{display:block;font:500 9.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);margin-top:2px}
.mare .conta span{display:flex;flex-direction:column;align-items:center}
.mare figure{position:relative;height:190px;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px -18px #33241a99}
.trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 18px 14px;margin:0 -18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.trilho>*{scroll-snap-align:center;flex:0 0 62%;transition:transform .15s linear,opacity .15s linear;will-change:transform}
.clube-c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:20px;border-radius:24px;background:linear-gradient(120deg,#F4E6D7,#E9D9D1 45%,#D7E0DF);text-decoration:none;position:relative;overflow:hidden;box-shadow:0 0 0 1px #33241a0d}
.clube-c::after{content:"";position:absolute;right:-30px;bottom:-30px;width:150px;aspect-ratio:640/514;-webkit-mask:url(arte/sereia-mascara.png) center/contain no-repeat;mask:url(arte/sereia-mascara.png) center/contain no-repeat;background:#A98451;opacity:.16}
.clube-c b{display:block;font:italic 500 26px/1 var(--serif)}
.clube-c small{display:block;margin-top:6px;font-size:13px;color:var(--tinta2)}
.clube-c strong{font:500 30px/1 var(--sans);color:var(--ouro-e);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.rodape{padding:34px 22px 10px;text-align:center;color:var(--tinta2)}
.rodape .estrela{margin:0 auto 10px}
.rodape p{font:500 10.5px/1.9 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.rodape small{display:block;margin-top:10px;font-size:12px}

/* cartão de produto */
.prod{display:block;text-decoration:none;border-radius:20px;background:var(--cartao);overflow:hidden;box-shadow:0 0 0 1px #33241a0d,0 14px 26px -22px #5a3f2499}
.prod figure{position:relative;aspect-ratio:1/1.08;overflow:hidden;background:#EFE4D7}
.prod figure img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.prod:active figure img{transform:scale(1.04)}
.prod .selo{position:absolute;left:10px;top:10px;padding:6px 10px 5px;border-radius:14px;font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;background:#ffffffd9;color:var(--tinta2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prod .selo.ok{background:var(--dourado);color:#FFF8EE}
.prod .selo.vem{background:#5F7D82e6;color:#fff}
.prod .tx{padding:11px 13px 14px}
.prod b{display:block;font:600 18px/1.08 var(--serif)}
.prod small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font:500 10.5px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.prod .pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:8px;font:600 14px/1 var(--sans)}
.prod .pr i{font:400 11.5px/1.2 var(--sans);font-style:normal;color:var(--tinta2);text-align:right}

/* ---------- loja ---------- */
.seg{position:sticky;top:var(--topo);z-index:20;margin:14px 14px 0;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);border-radius:30px;background:color-mix(in srgb,var(--creme2) 80%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px #33241a12}
.seg button{position:relative;z-index:1;height:40px;border-radius:26px;font:500 13px/1 var(--sans);color:var(--tinta2);transition:color .3s}
.seg button[aria-pressed=true]{color:#FFF8EE}
.seg .pilula{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:26px;background:var(--dourado);transition:transform .45s var(--ease)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 15px;border-radius:20px;font:500 12.5px/1 var(--sans);color:var(--tinta2);box-shadow:inset 0 0 0 1.2px #33241a22;background:#fff6}
.chips button[aria-pressed=true]{background:var(--tinta);color:var(--creme);box-shadow:none}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 14px 0}
.vazio{padding:30px 22px;text-align:center;color:var(--tinta2);font:italic 400 20px/1.3 var(--serif)}

/* ---------- produto ---------- */
body.tela-p .topo{display:none}
.p-heroi{position:relative;height:72svh;max-height:640px;overflow:hidden;background:#E9DED2}
.p-fotos{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;will-change:transform}
.p-fotos::-webkit-scrollbar{display:none}
.p-fotos img{flex:0 0 100%;height:100%;object-fit:cover;scroll-snap-align:center}
.p-heroi::after{content:"";position:absolute;inset:auto 0 0 0;height:58%;pointer-events:none;background:linear-gradient(180deg,#F5EBDF00,#F5EBDFcc 48%,#F5EBDF 86%)}
.p-flut{position:fixed;z-index:41;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.p-flut .ib{pointer-events:auto;background:#ffffff8c;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 18px -10px #33241a66}
.p-flut .ib[aria-pressed=true]{color:#B5523E}
.p-flut .ib[aria-pressed=true] .i{fill:currentColor}
.p-barra{position:fixed;z-index:40;top:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:var(--topo);padding:env(safe-area-inset-top) 64px 0;display:flex;align-items:center;justify-content:center;font:italic 500 21px/1 var(--serif);background:color-mix(in srgb,var(--creme) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 1px 0 var(--linha);opacity:0;pointer-events:none;transition:opacity .25s}
.p-barra.on{opacity:1}
.p-tit{position:absolute;z-index:2;left:0;right:0;bottom:22px;text-align:center;padding:0 20px;will-change:transform,opacity}
.p-tit h1{font:italic 500 50px/.95 var(--serif);color:var(--tinta)}
.p-tit .rotulo{margin-top:10px;color:var(--tinta2)}
.p-tit .acao{width:auto;display:inline-flex;min-height:44px;margin-top:16px;padding:0 30px}
.p-pontos{position:absolute;z-index:2;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:6px}
.p-pontos i{width:6px;height:6px;border-radius:50%;background:#33241a33;transition:background .3s,width .3s}
.p-pontos i.on{background:var(--ouro-e);width:16px;border-radius:4px}
.p-folha{position:relative;z-index:3;padding:22px 20px 0}
.p-preco{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.p-preco b{font:500 28px/1 var(--sans)}
.p-preco s{display:block;font-size:13px;color:var(--tinta2);margin-bottom:4px}
.p-preco .est{text-align:right;font:500 12px/1.35 var(--sans);color:var(--ardosia)}
.p-frase{margin-top:18px;font:italic 500 23px/1.25 var(--serif)}
.notas{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.notas span{padding:8px 13px;border-radius:18px;background:#fff9;box-shadow:inset 0 0 0 1px #33241a14;font:500 12.5px/1 var(--sans)}
.p-hist{margin-top:14px;font:400 18px/1.45 var(--serif);color:var(--tinta2)}
.p-hist p+p{margin-top:.7em}
.p-ganha{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,#F4E6D7,#E9D9D1);font-size:13.5px}
.p-ganha .estrela{flex:none}

/* ---------- escola e receitas ---------- */
.foto-c{position:relative;margin:18px 18px 0;height:190px;border-radius:24px;overflow:hidden;box-shadow:0 18px 34px -26px #33241aaa}
.lista{list-style:none;padding:14px 18px 0;display:grid;gap:10px}

  if(a==='p')h=produto(b);else if(a==='escola'&&b)h=curso(b);else if(a==='receitas'&&b)h=receita(b);else h=(TELAS[a]||inicio)(qs);
  main.innerHTML=h;
  document.body.className=(a==='p'?'tela-p':'')+((a==='escola'||a==='receitas')&&b?' sem-topo':'');
  const aba=a==='p'?'loja':a==='lancamentos'||a==='clube'||a==='pontos'||a==='avisos'||a==='favoritos'?'':a||'inicio';
  $$('.nav a').forEach(x=>{if(x.dataset.aba===(aba||'x'))x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  document.title=tituloDe(a,b);
  if(!fica){scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true})}
  monta();
 };
 if(!fica&&!primeira&&document.startViewTransition&&!reduz){const t=document.startViewTransition(faz);t.ready.catch(()=>{});t.finished.catch(()=>{})}else faz();
 primeira=false;
}
function tituloDe(a,b){const n={loja:'Loja',escola:'Escola da Fada',receitas:'Receitas da Fada',lancamentos:'Lançamentos',avisos:'Avisos',perfil:'Perfil',clube:'Clube da Fada',pontos:'Clube da Fada',favoritos:'Favoritos'};if(a==='p'){const p=Loja.produto(M,b);return (p?p.nome+' · ':'')+'Fada Marinha'}return (n[a]?n[a]+' · ':'')+'Fada Marinha'}
addEventListener('hashchange',()=>desenha());

/* ---------- movimento ao rolar ---------- */
let efeitos=[],agendado=false,io;
function monta(){
 efeitos=[];
 const topo=$('#topo'),est=$('.marca .estrela');
 efeitos.push(y=>{topo.classList.toggle('rolou',y>8);if(est&&!reduz)est.style.transform=`rotate(${y*.25}deg)`});
 if(!reduz){
  $$('[data-px]').forEach(el=>{const k=+el.dataset.px;efeitos.push(()=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<-80||r.top>innerHeight+80)return;const c=(r.top+r.height/2-innerHeight/2)/innerHeight;el.style.transform=`translate3d(0,${(c*k*100).toFixed(1)}%,0)`})});
  const heroi=$('#p-heroi');
  if(heroi){const tit=$('#p-tit'),fotos=$('#p-fotos'),barra=$('#p-barra');efeitos.push(y=>{const h=heroi.offsetHeight,t=Math.min(1,y/h);fotos.style.transform=`translate3d(0,${y*.42}px,0) scale(${1+t*.12})`;tit.style.transform=`translate3d(0,${-y*.18}px,0)`;tit.style.opacity=1-Math.min(1,t*1.8);barra.classList.toggle('on',y>h-120)})}
 }else{const heroi=$('#p-heroi');if(heroi){const barra=$('#p-barra');efeitos.push(y=>barra.classList.toggle('on',y>heroi.offsetHeight-120))}}
 /* trilhos: o cartão do meio cresce, os das pontas recuam */
 $$('.trilho').forEach(tr=>{const vai=()=>{const r=tr.getBoundingClientRect(),c=r.left+r.width/2;[...tr.children].forEach(el=>{const b=el.getBoundingClientRect(),d=Math.min(1,Math.abs(b.left+b.width/2-c)/r.width);el.style.transform=reduz?'':`scale(${(1-d*.12).toFixed(3)})`;el.style.opacity=(1-d*.35).toFixed(2)})};tr.addEventListener('scroll',()=>requestAnimationFrame(vai),{passive:true});vai()});
 /* fotos do produto: bolinhas acompanham o deslize */
 const pf=$('#p-fotos'),pp=$('#p-pontos');if(pf&&pp)pf.addEventListener('scroll',()=>{const i=Math.round(pf.scrollLeft/pf.clientWidth);[...pp.children].forEach((e,k)=>e.classList.toggle('on',k===i))},{passive:true});
 /* revelar */
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'});
 $$('.rv').forEach(e=>io.observe(e));
 roda();atualizaSacola();atualizaSino();
}
function roda(){const y=scrollY;efeitos.forEach(f=>f(y))}
addEventListener('scroll',()=>{if(agendado)return;agendado=true;requestAnimationFrame(()=>{agendado=false;roda()})},{passive:true});
addEventListener('resize',roda);
setInterval(()=>$$('.conta[data-fim]').forEach(e=>e.innerHTML=contaHTML(falta(e.dataset.fim))),30000);

/* ---------- ações ---------- */
function abre(h){const d=$('#dlg');d.innerHTML=`<button class="fechar" aria-label="Fechar" onclick="dlg.close()">${I('<path d="M6 6l12 12M18 6 6 18"/>')}</button>${h}`;if(!d.open)d.showModal()}
const dlg=$('#dlg');dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
function toast(t){const e=$('#toast');e.firstElementChild.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function baixar(){abre(Instalar.html())}
function conversa(txt){window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(txt),'_blank','noopener')}
function favorita(id,b){let f=favs();f=f.includes(id)?f.filter(x=>x!==id):[id,...f];try{localStorage.setItem('fada_favs',JSON.stringify(f))}catch(e){}b.setAttribute('aria-pressed',f.includes(id));toast(f.includes(id)?'Guardado nos favoritos':'Tirado dos favoritos')}
function abreMenu(){abre(`<h2>Fada Marinha</h2><ul class="menu-g">${[['loja?c=perfume','Perfumes'],['loja?c=corpo','Cosméticos naturais'],['loja?c=cabelo','Cabelo'],['escola','Escola da Fada'],['receitas','Receitas da Fada'],['lancamentos','Lançamentos exclusivos'],['clube','Clube da Fada'],['avisos','Avisos']].map(([a,t])=>`<li><a href="#/${a}" onclick="dlg.close()">${t}<small>→</small></a></li>`).join('')}<li><a href="../">Site da Fada<small>↗</small></a></li><li><a href="../../">Todos os links<small>↗</small></a></li></ul><p class="miudo">Prévia feita pela Ti Artes. Pagamento, login do Google e avisos de verdade entram na versão final.</p>`)}
let semAviso=false;
function colocar(id){semAviso=true;Loja.colocar(M,id);semAviso=false;const p=Loja.produto(M,id);toast(p.nome+' na sacola');atualizaSacola()}
function atualizaSacola(){const it=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),n=it.reduce((s,x)=>s+x.qtd,0),v=it.reduce((s,x)=>s+x.p.preco*x.qtd,0);$('#sacola-f').hidden=!n;$('#sacola-t').textContent=n?`Sacola · ${n} · ${R(v)}`:''}
function abreSacola(){const it=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),v=it.reduce((s,x)=>s+x.p.preco*x.qtd,0);
 abre(`<h2>Sacola</h2>${it.length?`<ul class="itens">${it.map(x=>`<li>${fotoTag(x.p.fotos[0],240,'')}<div><b>${esc(x.p.nome)}</b><small class="miudo">${esc(x.p.medida)} · ${R(x.p.preco)}</small></div><div class="qtd"><button onclick="qtd('${x.id}',-1)" aria-label="Tirar um">−</button><b>${x.qtd}</b><button onclick="qtd('${x.id}',1)" aria-label="Colocar mais um">+</button></div></li>`).join('')}</ul><div class="soma"><span>Total</span><span>${R(v)}</span></div><p class="miudo">${Loja.parcela(v,4)} ou Pix. Rende ${Pontos.rende(M,v).toLocaleString('pt-BR')} pontos no Clube da Fada.</p><button class="acao" onclick="pagar()">Finalizar compra</button>`:'<p>Sua sacola está vazia.</p><a class="acao" href="#/loja" onclick="dlg.close()">Ver a loja</a>'}`)}
function qtd(id,d){const it=Loja.sacola(M).find(i=>i.id===id);if(!it)return;semAviso=true;Loja.quantidade(M,id,it.qtd+d);semAviso=false;atualizaSacola();abreSacola()}
function pagar(){const it=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),v=it.reduce((s,x)=>s+x.p.preco*x.qtd,0);
 abre(`<h2>Pagamento</h2><p>Na versão de verdade, este passo abre o pagamento da loja da Fada na Nuvemshop: Pix, cartão, frete e nota fiscal. A compra entra na conta dela e os pontos caem sozinhos.</p><p>Esta compra rende <b>${Pontos.rende(M,v).toLocaleString('pt-BR')} pontos</b>.</p><button class="acao" onclick="simula()">Simular compra aprovada</button><button class="acao vazada" onclick="dlg.close()">Voltar</button>`)}
function simula(){const it=Loja.sacola(M).map(i=>({...i,p:Loja.produto(M,i.id)})).filter(x=>x.p),v=it.reduce((s,x)=>s+x.p.preco*x.qtd,0);dlg.close();semAviso=true;it.forEach(x=>Loja.tirar(M,x.id));semAviso=false;Pontos.compra(M,v,it.map(x=>x.p.nome).join(', '));atualizaSacola();ir('clube')}
function fila(id){const p=Loja.produto(M,id),c=Rec.conta(M);
 abre(`<h2>${esc(p.nome)}</h2><p>${p.status==='estreia'?`Abre ${esc(quando(p.estreia))}. Membros do Clube da Fada recebem o aviso e entram 1 hora antes.`:'Quando voltar à tona, você recebe o aviso antes de abrir para todo mundo.'}</p>
 <form onsubmit="entra(event,'${id}')"><label class="campo">Seu nome<input required name="nome" autocomplete="name" value="${c?esc(c.nome):''}"></label><label class="campo">WhatsApp com DDD<input required name="wa" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999" oninput="Rec.mascaraTel(this)"></label><label class="op"><input type="checkbox" required name="ok">Aceito receber este aviso e novidades da Fada Marinha. Posso sair quando quiser.</label><button class="acao">Entrar na fila</button></form>`)}
function entra(e,id){e.preventDefault();const f=e.target,p=Loja.produto(M,id);let pos=0;semAviso=true;pos=Loja.entrarNaFila(M,id,{nome:f.nome.value,wa:f.wa.value,meu:true});Loja.mexe(s=>{if(s.espera[0])s.espera[0].senha=pos});semAviso=false;
 Pontos.ganhar(M,'senha',Pontos.regras(M).senha,'Entrou na fila de '+p.nome,true);
 abre(`<h2>Você é a ${pos}ª da fila</h2><p>Avisamos no seu WhatsApp e no app quando ${esc(p.nome)} ${p.status==='estreia'?'abrir':'voltar à tona'}, antes de abrir para todo mundo.</p>${Pontos.permissao()==='granted'?'':`<button class="acao" onclick="Pontos.ativarAvisos(M);dlg.close()">Ligar os avisos do app</button>`}<button class="acao vazada" onclick="dlg.close()">Fechar</button>`)}
function atualizaSino(){$('#sino').hidden=Pontos.permissao()==='granted'}

/* ---------- abertura ---------- */
function entrarNoApp(){const ab=$('#abertura');try{localStorage.setItem('fada_app_entrou','1')}catch(e){}ab.classList.add('sai');setTimeout(()=>{ab.hidden=true;ab.classList.remove('sai');if(!Rec.conta(M))Pontos.entrada(M,true)},reduz?0:650)}
function abertura(){const pede=/[?&]app=1/.test(location.search);let ja=false;try{ja=!!localStorage.getItem('fada_app_entrou')}catch(e){}
 if(pede){try{const u=new URL(location.href);u.searchParams.delete('app');history.replaceState(null,'',u.toString())}catch(e){}}
 if(pede||!ja)$('#abertura').hidden=false}

Loja.aoMudar(()=>{if(semAviso)return;const a=rota().a;if(!dlg.open&&['','inicio','loja','lancamentos','perfil','favoritos','clube','pontos'].includes(a)){const y=scrollY;desenha(true);scrollTo({top:y,behavior:'instant'})}});
Pontos.aoMudar(()=>{const a=rota().a;if(['','inicio','clube','pontos','perfil','avisos','receitas'].includes(a)){const y=scrollY;desenha(true);scrollTo({top:y,behavior:'instant'})}atualizaSino()});
abertura();
desenha();
</script>
