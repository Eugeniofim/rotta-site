<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tutorial Espaço Anirvana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{--areia:#F5E3B8;--raio:#FFB987;--sol:#F47B2D;--acafrao:#FFC526;--folha:#9EC83C;--pri:#0E7266;--ink:#2C2B2B;--ink2:#4A443C}
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--areia);color:var(--ink);font-family:'Figtree',system-ui,sans-serif}
  .raios{position:absolute;left:1489px;top:540px;width:3200px;height:3200px;translate:-50% -50%;background:repeating-conic-gradient(from 3deg,var(--raio) 0deg 7deg,transparent 7deg 16deg);opacity:.75;animation:girar 120s linear infinite;z-index:0}
  @keyframes girar{to{rotate:360deg}}
  .marca{position:absolute;left:120px;top:70px;display:flex;align-items:center;gap:18px;z-index:2}
  .marca img{width:64px}
  .marca b{font-family:Montserrat;font-weight:800;font-size:30px;letter-spacing:-.02em}
  .marca small{display:block;font-size:18px;color:var(--ink2);font-weight:600}
  .legenda{position:absolute;left:120px;top:250px;width:900px;z-index:2;transition:opacity .35s ease,transform .35s ease}
  .legenda.troca{opacity:0;transform:translateY(14px)}
  .cap{display:inline-flex;align-items:center;gap:10px;background:var(--pri);color:#fff;font-weight:700;font-size:22px;padding:10px 20px;border-radius:999px;letter-spacing:.02em}
  .cap i{width:12px;height:12px;border-radius:50%;background:var(--acafrao)}
  .titulo{font-family:Montserrat;font-weight:800;font-size:74px;line-height:1.02;letter-spacing:-.035em;margin:30px 0 24px;text-wrap:balance}
  .texto{font-size:36px;line-height:1.35;color:var(--ink2);max-width:860px;text-wrap:pretty}
  .passos{position:absolute;left:120px;bottom:90px;display:flex;gap:10px;z-index:2}
  .passos span{width:46px;height:8px;border-radius:8px;background:rgba(44,43,43,.16);transition:background .4s}
  .passos span.feito{background:var(--pri)}
  .passos span.agora{background:var(--sol)}
  .celular{position:absolute;left:1278px;top:96px;width:422px;height:888px;padding:16px;border-radius:64px;background:#141210;box-shadow:0 2px 0 2px #3b352d inset,0 60px 120px -30px rgba(70,40,10,.55),0 18px 40px -12px rgba(70,40,10,.35);z-index:2}
  .tela{width:390px;height:856px;border-radius:48px;overflow:hidden;background:#F7E9C6;display:flex;flex-direction:column}
  .status{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-family:'Figtree';font-weight:700;font-size:16px;color:#2C2B2B;position:relative}
  .status .ilha{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#141210}
  .status .ic{display:flex;gap:6px;align-items:center}
  .status .bat{width:26px;height:12px;border:2px solid #2C2B2B;border-radius:4px;position:relative}
  .status .bat::after{content:"";position:absolute;inset:1px 5px 1px 1px;background:#2C2B2B;border-radius:1px}
  .status .sin{display:flex;gap:2px;align-items:flex-end;height:12px}
  .status .sin i{width:3px;background:#2C2B2B;border-radius:1px}
  .celular iframe{display:block;width:390px;flex:1;border:0;background:#F7E9C6}
  .dedo{position:absolute;z-index:5;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(44,43,43,.28);border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.25);left:0;top:0;transform:translate(1489px,1200px);transition:transform .6s cubic-bezier(.3,.8,.25,1),opacity .3s;pointer-events:none}
  .onda{position:absolute;z-index:4;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:4px solid var(--sol);pointer-events:none;animation:onda .6s ease-out forwards}
  @keyframes onda{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
  .capa{position:absolute;inset:0;z-index:10;background:var(--areia);display:grid;place-items:center;transition:opacity .7s ease;overflow:hidden}
  .capa.fora{opacity:0;pointer-events:none}
  .capa .dentro{position:relative;z-index:1;text-align:center;display:grid;justify-items:center;gap:18px}
  .capa img{width:200px}
  .capa .nm{font-family:Anton;font-size:120px;color:var(--pri);line-height:1}
  .capa h1{font-family:Montserrat;font-weight:800;font-size:84px;letter-spacing:-.035em;margin:0;line-height:1.02}
  .capa p{font-size:38px;color:var(--ink2);margin:0}
  .capa .link{font-family:Montserrat;font-weight:800;font-size:76px;color:var(--sol);letter-spacing:-.02em}
  .capa .raios{left:50%;top:50%}
</style>
</head>
<body>
  <div class="raios"></div>
  <div class="marca"><img src="logo-site.png" alt=""><div><b>Espaço Anirvana</b><small>Como usar o app</small></div></div>
  <div class="legenda" id="legenda"><span class="cap"><i></i><span id="lCap"></span></span><div class="titulo" id="lTit"></div><div class="texto" id="lTxt"></div></div>
  <div class="passos" id="passos"></div>
  <div class="celular"><div class="tela"><div class="status"><span>10:50</span><span class="ilha"></span><span class="ic"><span class="sin"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span class="bat"></span></span></div><iframe id="app" src="app/index.html"></iframe></div></div>
  <div class="dedo" id="dedo"></div>
  <div class="capa" id="capa"><div class="raios"></div><div class="dentro" id="capaDentro"></div></div>
<script>
  const TOTAL = 13;
  document.getElementById('passos').innerHTML = Array.from({length:TOTAL}, () => '<span></span>').join('');
  window.legenda = (cap, tit, txt, passo) => {
    const L = document.getElementById('legenda');
    L.classList.add('troca');
    setTimeout(() => {
      document.getElementById('lCap').textContent = cap;
      document.getElementById('lTit').textContent = tit;
      document.getElementById('lTxt').textContent = txt;
      [...document.querySelectorAll('#passos span')].forEach((s, i) => { s.className = i < passo - 1 ? 'feito' : i === passo - 1 ? 'agora' : ''; });
      L.classList.remove('troca');
    }, 360);
  };
  window.dedoPara = (x, y) => { document.getElementById('dedo').style.transform = `translate(${x}px,${y}px)`; };
  window.onda = (x, y) => { const o = document.createElement('div'); o.className = 'onda'; o.style.left = x + 'px'; o.style.top = y + 'px'; document.body.appendChild(o); setTimeout(() => o.remove(), 700); };
  window.capa = (html) => { const c = document.getElementById('capa'); document.getElementById('capaDentro').innerHTML = html; c.classList.remove('fora'); };
  window.tiraCapa = () => document.getElementById('capa').classList.add('fora');
  capa(`<img src="logo-site.png" alt=""><div class="nm">Namaskar!</div><h1>O app do Espaço Anirvana</h1><p>Tutorial rápido · administração, instrutores e alunos</p>`);
</script>
</body>
</html>
