<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espaço Anirvana</title>
<meta name="description" content="App do Espaço Anirvana: administração, instrutores e alunos">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5E3B8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anirvana">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: casca de app — trilho lateral no desktop, barra inferior no celular; cada painel abre com o sol da logo e os raios pêssego do site */
:root{
  /* cores do site anirvana.com.br: areia, raios pêssego, laranja, amarelo, verde, verde-mar do "Namaskar!" e grafite */
  --bg:#F7E9C6; --surface:#FFF9EC; --surface-2:#FCF2DA; --sunk:#F1DFB4;
  --ink:#2C2B2B; --ink-2:#4A443C; --muted:#6B5E4E; --line:#EBD9AC; --line-2:#DCC690;
  --pri:#0E7266; --pri-ink:#FFFFFF; --pri-soft:#D7ECE5;
  --sol:#F47B2D; --acafrao:#FFC526; --folha:#9EC83C; --raio:#FFB987; --areia:#F5E3B8;
  --sol-ink:#A84A0E; --folha-ink:#2F6B12; --acafrao-ink:#7A5A00;
  --ok:#2C7D38; --ok-bg:#E3F3E2; --warn:#8C6200; --warn-bg:#FCEFC4; --bad:#BC3328; --bad-bg:#FBE3E0;
  --chart-in:#00897A; --chart-out:#E5672A;
  --shadow:0 1px 2px rgba(80,55,20,.06),0 10px 30px -16px rgba(80,55,20,.28);
  --shadow-lg:0 2px 6px rgba(80,55,20,.08),0 30px 60px -24px rgba(80,55,20,.38);
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --f-display:'Montserrat','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-saudacao:'Anton','Montserrat',Impact,sans-serif;
  --rail:240px; --nav-h:64px;
}
/* tema único: as cores do site valem com o celular no modo claro ou escuro */
:root{color-scheme:light}

/* raios de sol, como no topo do site */
.raios{position:absolute;pointer-events:none;z-index:-1;background:repeating-conic-gradient(from 3deg,var(--raio) 0deg 7deg,transparent 7deg 16deg);-webkit-mask-image:radial-gradient(closest-side,#000 20%,transparent 100%);mask-image:radial-gradient(closest-side,#000 20%,transparent 100%);opacity:.55;animation:girar 160s linear infinite}
@keyframes girar{to{rotate:360deg}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;line-height:1.15}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:30px;height:30px}

/* ---------- casca ---------- */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.rail{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:auto;display:block}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2;white-space:nowrap}
.topbar .grow{flex:1}
.rolebtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;white-space:nowrap}
.rolebtn .av{width:28px;height:28px;font-size:11.5px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--sunk)}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;max-width:96px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:14px;position:relative}
.bnav button.on{color:var(--pri)}
.bnav button.on::before{content:"";position:absolute;top:2px;width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sol),var(--acafrao),var(--folha))}
.bnav .dot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--sol);color:#2C2B2B;font-size:10px;display:grid;place-items:center;font-weight:700}

@media (min-width:980px){
  .app{grid-template-columns:var(--rail) 1fr}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{padding:4px 8px 18px}
  .rail .brand img{width:40px}
  .rail .navi{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--ink-2);font-size:14.5px;width:100%;text-align:left}
  .rail .navi:hover{background:var(--sunk)}
  .rail .navi.on{background:var(--pri-soft);color:var(--pri)}
  .rail .navi .cnt{margin-left:auto;font-size:11.5px;background:var(--sol);color:#2C2B2B;border-radius:9px;padding:1px 7px}
  .rail .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;font-weight:700}
  .rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.4}
  .bnav{display:none}
  .topbar .brand{display:none}
  .main{padding-block:8px 48px;padding-left:32px;padding-right:32px}
  .topbar{margin-inline:-32px;padding-inline:32px}
}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.pad-lg{padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:17px}
.card-h .sub{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.split{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1100px){.split{grid-template-columns:1.35fr 1fr}.split.rev{grid-template-columns:1fr 1.35fr}}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.strong{font-weight:700}
.hr{height:1px;background:var(--line);margin:4px 0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.pagehead h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.025em}
.pagehead p{color:var(--muted);font-size:14px;margin-top:4px}
.pagehead > *{min-width:0;max-width:100%}

/* stat */
.stat{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:12.5px;color:var(--muted)}
.stat .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:13px;font-weight:650;font-size:14.5px;white-space:nowrap;transition:transform .15s ease,background .2s ease,box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--pri) 70%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sol{background:linear-gradient(135deg,var(--sol),color-mix(in srgb,var(--sol) 60%,var(--acafrao)));color:#2C2B2B;box-shadow:0 8px 20px -10px var(--sol)}
.btn.sec{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.sec:hover{background:var(--surface-2)}
.btn.ghost{color:var(--pri);padding:0 10px}
.btn.ghost:hover{background:var(--pri-soft)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* chips e status */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:11.5px;opacity:.7}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--sunk);color:var(--ink-2)}
.pill.pri{background:var(--pri-soft);color:var(--pri)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.real{background:var(--ok-bg);color:var(--ok)}
.fdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.fdot.ok{background:var(--ok)}.fdot.warn{background:var(--acafrao)}.fdot.bad{background:var(--bad)}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff;background:var(--c,#6B678C);letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:19px}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:650;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.li .main-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;flex:none}
.li.tap{cursor:pointer;border-radius:12px;padding-inline:8px;margin-inline:-4px}
.li.tap:hover{background:var(--surface-2)}
.ico-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ink-2)}

/* tabela */
.tbl-w{overflow-x:auto;margin-inline:-4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:560px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.tot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--line-2)}
.tbl td.neg{color:var(--bad)}
.tbl td.pos{color:var(--ok)}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:13px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:36px;padding:0 14px;border-radius:10px;font-weight:650;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:650;color:var(--ink-2)}
.field .help{font-size:12px;color:var(--muted)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-size:16px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.inp{height:84px;padding:12px 14px;resize:vertical}
.money{font-family:var(--f-display);font-size:34px;font-weight:700;height:64px;text-align:center;letter-spacing:-.02em}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;text-align:left;line-height:1.25}
.opt.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.opt .ic{width:18px;height:18px}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(14,12,34,.45);opacity:0;pointer-events:none;transition:opacity .25s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:71;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s linear .34s;overscroll-behavior:contain}
.sheet.on{transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s}
.sheet{visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 12px}
.sheet-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h h2{font-size:22px;flex:1}
.sheet-h p{font-size:13.5px;color:var(--muted);margin-top:4px}
.sheet .stack{display:grid;gap:16px}
.sheet-foot{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:12px calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
.sheet-foot .btn{flex:1}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 48px));border-radius:26px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .2s ease,visibility 0s linear .3s;pointer-events:none;max-height:88vh;padding:22px 26px 26px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .2s ease,visibility 0s}
  .sheet .grab{display:none}
  .sheet.wide{width:min(760px,calc(100vw - 48px))}
}

/* toast */
.toast{position:fixed;z-index:90;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);transition:all .3s cubic-bezier(.2,.9,.25,1);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:980px){.toast{bottom:28px;left:calc(50% + var(--rail) / 2)}}

/* faixa protótipo */
.proto{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:8px 12px;line-height:1.4}
.proto .ic{color:var(--sol-ink);flex:none}

/* ---------- SOL DE ARCOS (assinatura) ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-xl);padding:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media (min-width:700px){.hero{grid-template-columns:auto 1fr;padding:26px 30px;gap:30px}}
.solar{position:relative;width:min(280px,100%);margin:0 auto;aspect-ratio:280/170}
.solar svg{width:100%;height:100%;display:block;overflow:visible;position:relative}
.solar .raios{left:50%;top:89%;width:1100px;height:1100px;translate:-50% -50%}
.solar .trk{fill:none;stroke:var(--sunk);stroke-linecap:round}
.solar .arc{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.solar .seed{fill:var(--acafrao)}
.solar .center{position:absolute;left:0;right:0;bottom:2%;text-align:center}
.solar .center b{display:block;font-family:var(--f-display);font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.solar .center span{font-size:12px;color:var(--muted);font-weight:600}
.solar .center b.long{font-size:27px}
.legend{display:grid;gap:12px;position:relative;z-index:1;min-width:0}
.legend h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.025em}
.legend .lead{color:var(--muted);font-size:14px;margin-top:-6px}
.lg-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:14px}
.lg-row i{width:14px;height:14px;border-radius:50%;display:block}
.lg-row .lab{color:var(--ink-2);min-width:0}
.lg-row .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg-row .bar{grid-column:2/4;height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.lg-row .bar span{display:block;height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

/* alertas */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.alert .ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.alert.bad .ib{background:var(--bad-bg);color:var(--bad)}
.alert.warn .ib{background:var(--warn-bg);color:var(--warn)}
.alert.ok .ib{background:var(--ok-bg);color:var(--ok)}
.alert.pri .ib{background:var(--pri-soft);color:var(--pri)}
.alert .t{font-weight:700;font-size:14px;line-height:1.3}
.alert .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.alert .go{margin-left:auto;align-self:center;color:var(--muted)}
.alert.tap{cursor:pointer}
.alert.tap:hover{border-color:var(--line-2)}

/* gráfico */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bin{fill:var(--chart-in)}
.chart .bout{fill:var(--chart-out)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--sunk);fill-opacity:.7}
.chart .future{fill:var(--sunk)}
.ckey{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-weight:600}
.ckey span{display:inline-flex;align-items:center;gap:7px}
.ckey i{width:12px;height:12px;border-radius:3px;display:block}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;min-width:170px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;font-variant-numeric:tabular-nums}
.tip.on{opacity:1;transform:none}
.tip b{font-size:13px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13.5px}
.hbar .track{grid-column:1/3;height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-bottom:8px}
.hbar .track span{display:block;height:100%;border-radius:6px;background:var(--chart-out);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.saldos{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.saldos span{font-size:10.5px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;overflow:hidden}
.saldos span.pos{color:var(--ok)}.saldos span.neg{color:var(--bad)}

/* frequência em pontos */
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--sunk);display:block}
.dots i.on{background:var(--folha)}
.cal{display:grid;grid-template-columns:auto repeat(13,1fr);gap:4px;font-size:10.5px;color:var(--muted);align-items:center}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--sunk);display:block;max-width:22px}
.cal i.on{background:var(--folha)}
.cal i.fut{background:transparent;border:1px dashed var(--line-2)}
.cal i.today{outline:2px solid var(--sol);outline-offset:1px}

/* agenda */
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.week .day h4{font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 2px 8px;display:flex;justify-content:space-between}
.week .day h4.today{color:var(--sol-ink)}
.slot{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%;font-size:12.5px;position:relative;overflow:hidden}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line-2))}
.slot b{font-size:13.5px}
.slot.mine{background:var(--surface);box-shadow:var(--shadow)}
.slot.dim{opacity:.55}
@media (max-width:820px){.week{grid-template-columns:1fr}.week .day{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}.week .day h4{padding-top:12px}}

/* chamada */
.rollgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.roll{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);text-align:left;transition:all .2s ease;position:relative;min-height:64px}
.roll .nm{font-weight:650;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.roll{padding-right:34px}
.roll .pl{font-size:11.5px;color:var(--muted)}
.roll .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:all .2s}
.roll.on{border-color:var(--folha);background:color-mix(in srgb,var(--folha) 12%,var(--surface))}
.roll.on .ck{background:var(--folha);border-color:var(--folha);color:#fff;transform:scale(1.08)}
.roll .ck .ic{width:14px;height:14px;stroke-width:3}

/* ---------- LOJINHA 3D ---------- */
.shop-hero{position:relative;isolation:isolate;border-radius:var(--r-xl);background:var(--areia);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;padding:18px 0 6px}
.shop-hero .raios{width:1600px;height:1600px;left:50%;top:100%;translate:-50% -50%;opacity:.7}
.shop-hero .cap{display:flex;justify-content:space-between;align-items:center;padding:0 18px;gap:10px;flex-wrap:wrap}
.ring-stage{height:190px;perspective:1000px;position:relative;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.ring-stage:active{cursor:grabbing}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(calc(var(--r) * -1)) rotateX(-6deg) rotateY(var(--rot,0deg))}
.fcard{position:absolute;left:-62px;top:-66px;width:124px;height:132px;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,color-mix(in srgb,var(--hue) 30%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--hue) 40%,var(--line));box-shadow:0 18px 30px -18px rgba(20,16,50,.5);backface-visibility:hidden;text-align:left;transition:box-shadow .2s,border-color .2s}
.fcard .mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--f-display);font-size:17px;background:var(--hue);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.fcard b{font-size:13px;line-height:1.2;display:block}
.fcard small{font-size:11px;color:var(--muted);font-weight:600}
.fcard.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft),0 18px 30px -18px rgba(20,16,50,.5)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.prod{position:relative;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:var(--shadow);will-change:transform;min-width:0}
.prod:hover{box-shadow:var(--shadow-lg)}
.prod .ped{height:96px;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(90% 80% at 50% 110%,color-mix(in srgb,var(--hue) 55%,transparent),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--hue) 14%,var(--surface-2)),color-mix(in srgb,var(--hue) 30%,var(--surface-2)));transform:translateZ(18px)}
.prod .ped .ic{width:40px;height:40px;stroke-width:1.5;color:color-mix(in srgb,var(--hue) 70%,var(--ink));filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.prod:hover .ped .ic{transform:translateY(-4px) scale(1.06)}
.prod .ped::after{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.45),transparent 45%);opacity:0;transition:opacity .3s}
.prod:hover .ped::after{opacity:1}
.prod .nm{font-weight:700;font-size:13.5px;line-height:1.25;transform:translateZ(10px);min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .fo{font-size:11.5px;color:var(--muted);transform:translateZ(6px)}
.prod .pr{display:flex;align-items:center;justify-content:space-between;transform:translateZ(14px);margin-top:auto}
.prod .pr b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prod .add{width:34px;height:34px;border-radius:11px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
.prod .q{position:absolute;top:8px;right:8px;z-index:2;min-width:26px;height:26px;border-radius:13px;background:var(--sol);color:#2C2B2B;font-weight:800;font-size:12.5px;display:grid;place-items:center;padding:0 7px;transform:translateZ(30px);box-shadow:0 6px 12px -4px var(--sol)}
.cartbar{position:fixed;z-index:44;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);transform:translateY(calc(100% + var(--nav-h) + 60px));visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.25,1),visibility 0s linear .4s}
.cartbar.on{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.9,.25,1),visibility 0s}
.cartbar .ci{position:relative}
.cartbar .ci b{position:absolute;top:-8px;right:-10px;min-width:20px;height:20px;border-radius:10px;background:var(--sol);color:#2C2B2B;font-size:11px;display:grid;place-items:center;padding:0 5px}
.cartbar .tt{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cartbar .btn{background:var(--bg);color:var(--ink);height:42px}
@media (min-width:980px){.cartbar{bottom:22px;left:calc(var(--rail) + 32px);right:32px}}
.cartbar.bump{animation:bump .45s cubic-bezier(.2,.9,.25,1)}
@keyframes bump{30%{transform:scale(1.05)}60%{transform:scale(.98)}}
.flyer{position:fixed;z-index:95;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--hue);color:#fff;pointer-events:none;box-shadow:0 10px 20px -6px rgba(0,0,0,.35)}
.split-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.split-bar span{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1);min-width:2px}
.receipt{perspective:1000px}
.receipt .paper{transform-origin:50% 0;animation:unroll .8s cubic-bezier(.2,.9,.25,1) both;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:18px;padding:16px}
@keyframes unroll{from{transform:rotateX(-88deg);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;z-index:96;width:8px;height:8px;border-radius:50%;pointer-events:none}

/* porta de entrada */
.door{min-height:100%;display:grid;place-items:center;isolation:isolate;background:var(--areia);padding:32px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.door-in{width:min(980px,100%);display:grid;gap:28px;position:relative;z-index:1}
.door-head{display:grid;gap:14px;justify-items:start}
.door-head img{width:92px}
.door-head h1{font-size:clamp(34px,6vw,58px);font-weight:750;letter-spacing:-.035em;line-height:.98}
.door-head h1 em{font-style:normal;color:var(--sol-ink)}
.door-head p{color:var(--muted);font-size:16px;max-width:52ch}
.doors{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.dcard{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;min-width:0}
.dcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.dcard .top{display:flex;align-items:center;gap:12px}
.dcard .ib{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff}
.dcard h3{font-size:21px}
.dcard p{font-size:13.5px;color:var(--muted);line-height:1.45}
.dcard .who{display:flex;flex-wrap:wrap;gap:6px}
.door .raios{width:2600px;height:2600px;left:clamp(40px,12vw,220px);top:110px;translate:-50% -50%;opacity:.8;-webkit-mask-image:none;mask-image:none}
.door-head .namaskar{font-family:var(--f-saudacao);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:1;color:var(--pri);letter-spacing:.005em}
.door-head .namaskar small{display:block;font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:0;margin-top:8px}
.citacao{font-style:italic;color:var(--ink-2);font-size:15px;max-width:60ch}
.citacao b{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:4px}

/* QR */
.qr{width:180px;height:180px;margin:0 auto;padding:10px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}

.anim-in{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* barra "tem uma versão nova" (skill pwa-atualiza): aparece em qualquer tela */
.nova-bar{position:fixed;z-index:100;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(calc(-100% - 30px));visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility 0s linear .35s}
.nova-bar.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.25,1),visibility 0s}
.nova-bar .t{font-weight:700;font-size:13.5px}
.nova-bar .s{font-size:12px;color:var(--muted)}

</style>
</head>

  <div style="flex:1;min-width:0"><div class="t">Tem uma versão nova</div><div class="s">Seus dados ficam como estão. Leva um segundo.</div></div>
  <button class="btn pri sm" id="btnNova">Atualizar</button>
  <button class="iconbtn" id="btnNovaX" aria-label="Fechar aviso">×</button>
</div>

/* ---------- utilidades ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diasEntre = (a,b) => Math.round((pd(iso(b)) - pd(iso(a))) / 864e5);
const mesDe = s => s.slice(0,7);
const HOJE_ISO = iso(HOJE);
const r2 = v => Math.round(v*100)/100;
const brl = v => (v < -0.004 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0 = v => (v < -0.004 ? '−' : '') + 'R$ ' + Math.abs(Math.round(v)).toLocaleString('pt-BR');
const dataBR = s => { const d = pd(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const dataLonga = s => { const d = pd(s); return `${DIAS_L[d.getDay()].toLowerCase()}, ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`; };
const nomeMes = m => MESES[+m.slice(5,7)-1];
const mesCurto = m => MESES_C[+m.slice(5,7)-1];
const fimDoMes = m => { const d = pd(m+'-01'); return iso(new Date(d.getFullYear(), d.getMonth()+1, 0)); };
const escapeH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ini = nome => nome.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const corDe = nome => { let h = 0; for (const c of nome) h = (h*31 + c.charCodeAt(0)) >>> 0; const cs = ['#E5672A','#B9488E','#3E8E6E','#2F7FB8','#6A55C9','#C08A12','#1F8A9E','#A2563A','#5B8C2A','#8E5BB0']; return cs[h % cs.length]; };

  const R = rng(20261029);
  const S = {v:VERSAO, regras:{...REGRAS_PADRAO, planos:Object.fromEntries(Object.entries(PLANOS_YOGA).map(([k,p])=>[k,p.preco])), pct:Object.fromEntries(Object.entries(ATIV).map(([k,a])=>[k,a.repasse]))},
    alunos:[], aulas:{}, presencas:[], pagamentos:[], sessoes:[], vendas:[], repLoja:[], fiado:[], lanc:[], repEquipe:[], subs:[], vou:{}, seq:1000};

  /* alunos */
  ALUNOS_BASE.forEach(([id,nome,desde,mats,obs]) => {
    S.alunos.push({id, nome, desde, obs:obs||'', status:'ativo', tel:'(41) 9'+String(8000+Math.floor(R()*1999))+'-'+String(1000+Math.floor(R()*8999)),

  });

  /* aulas e presenças de 01/ago até hoje */
  const subsHist = {'2026-10-14_qua1830':'sara', '2026-09-24_qui1900':'kamala', '2026-08-29_sab0900':'stefy'};
  const vazias = ['2026-10-08_qui0800','2026-09-03_qui0800','2026-08-22_sab1030'];
  const agoraMin = HOJE.getHours()*60 + HOJE.getMinutes();
  for (let d = pd('2026-08-01'); d <= HOJE; d = addD(d,1)){
    const di = iso(d);
    if (FERIADOS.includes(di)) continue;
    TURMAS.filter(t => t.dia === d.getDay()).forEach(t => {
      const [hh,mm] = t.h.split(':').map(Number);
      if (di === HOJE_ISO && hh*60+mm > agoraMin) return;          /* ainda não aconteceu */
      const sid = `${di}_${t.id}`;
      const pendente = di === HOJE_ISO;                              /* chamada de hoje ainda não feita */
      const instr = subsHist[sid] || t.instr;
      S.aulas[sid] = {id:sid, d:di, turma:t.id, instr, feita:!pendente, vazia:false, sub:!!subsHist[sid]};
      if (pendente) return;
      let n = 0;
      if (!vazias.includes(sid)){
        S.alunos.forEach(a => a.mats.forEach(m => {
          if (!m.turmas.includes(t.id) || di < a.desde) return;
          const ult = ULTIMA_VINDA[a.id];
          if (ult && di > ult) return;
          const recente = diasEntre(d, HOJE) <= 9 && !ult;               /* quem não está sumido veio nos últimos dias */
          const p = recente ? .97 : t.atv === 'particular' ? .95 : t.atv === 'ingles' ? .86 : m.plano === '1x' ? .86 : .78;
          if ((ult && di === ult) || R() < p){ S.presencas.push({s:sid, a:a.id, t: m.plano || 'mensal'}); n++; }
        }));
        if (t.atv === 'yoga' && R() < .2){ S.presencas.push({s:sid, a:null, nome:'Visitante', t:'avulsa'}); n++; }
      }
      if (n === 0) S.aulas[sid].vazia = true;
    });
  }

  /* mensalidades pagas (ago–out) */
  ['2026-08','2026-09','2026-10'].forEach(mes => {
    S.alunos.forEach(a => a.mats.forEach(m => {
      if (a.desde > fimDoMes(mes)) return;
      const venc = `${mes}-${pad(Math.min(m.venc,28))}`;
      if (mes === MES_ATUAL && (venc > HOJE_ISO || SEM_PAGAR_OUT.includes(a.id))) return;
      let dia = m.metodo === 'cartao' ? venc : iso(addD(pd(venc), Math.floor(R()*4) - 1));

  });
  S.sessoes = S.sessoes.filter(s => s.d <= HOJE_ISO);

  /* vendas reais da planilha (mar–jul) */
  const porMes = {};
  VENDAS_PLANILHA.forEach(v => (porMes[v[0]] = porMes[v[0]] || []).push(v));
  Object.entries(porMes).forEach(([mm, lista]) => {
    let normais = lista.filter(v => !v[5]), k = 0;
    lista.forEach(([m,desc,valor,forma,forn,evento]) => {
      const dia = evento ? 20 : 1 + Math.floor((k++) * 28 / normais.length);
      S.vendas.push({id:'v'+(S.seq++), d:`2026-${mm}-${pad(dia)}`, desc, valor, forma, forn, evento:evento||'', fonte:'planilha'});
    });
  });
  /* vendas de exemplo (ago–out) */
  const formas = ['pix','pix','pix','debito','credito','dinheiro','credito2x'];
  ['2026-08','2026-09','2026-10'].forEach((mes,k) => {
    const n = [13,11,14][k];
    for (let i=0;i<n;i++){
      const p = PRODUTOS[Math.floor(R()*PRODUTOS.length)];
      const q = R() < .2 ? 2 : 1;
      const dia = 1 + Math.floor(i * (k===2 ? 28 : 29) / n);
      S.vendas.push({id:'v'+(S.seq++), d:`${mes}-${pad(dia)}`, desc:`${q} ${p[1].toLowerCase()}`, valor:r2(p[2]*q), forma:formas[Math.floor(R()*formas.length)], forn:p[3], evento:'', fonte:'exemplo', itens:[{p:p[0], q}]});
    }
  });
  S.vendas = S.vendas.filter(v => v.d <= HOJE_ISO);

  /* repasses já feitos aos fornecedores: até julho tudo pago; agosto pago em 05/09; setembro só parte */
  const devido = (forn, ate) => S.vendas.filter(v => v.forn === forn && v.d <= ate).reduce((s,v) => s + partesVenda(v).forn, 0);
  FORNECEDORES.filter(f => f.pct > 0).forEach(f => {
    const ateJul = devido(f.id,'2026-07-31'), ateAgo = devido(f.id,'2026-08-31') - ateJul;
    if (ateJul > 0) S.repLoja.push({id:'rl'+(S.seq++), forn:f.id, valor:r2(ateJul), d:'2026-08-05'});
    if (ateAgo > 0) S.repLoja.push({id:'rl'+(S.seq++), forn:f.id, valor:r2(ateAgo), d:'2026-09-05'});
    if (['stefy','dada','valefadas'].includes(f.id)){
      const ateSet = devido(f.id,'2026-09-30') - ateJul - ateAgo;
      if (ateSet > 0) S.repLoja.push({id:'rl'+(S.seq++), forn:f.id, valor:r2(ateSet), d:'2026-10-05'});
    }
  });

  /* fiado: soma R$ 312,70, o mesmo "A RECEBER!" da planilha */
  S.fiado = [
    {id:'fi1', cliente:'Bianca Rocha',   desc:'Vestido — 2ª parcela', valor:62.40, d:'2026-09-12', pago:false},
    {id:'fi2', cliente:'Débora Martins', desc:'Bolsa indiana — 2ª parcela', valor:69.50, d:'2026-10-03', pago:false},
    {id:'fi3', cliente:'Juliana Alves',  desc:'Óleo essencial alecrim', valor:48.90, d:'2026-10-10', pago:false},
    {id:'fi4', cliente:'Kamala',         desc:'OE lavandin + cedro + verbena (descontar no repasse)', valor:131.90, d:'2026-10-21', pago:false},
  ];

  /* controle financeiro: lançamentos manuais jan–out (valores de exemplo) */
  const airbnb = [3200,2600,900,1100,700,900,2100,800,1300,1500];
  for (let mi = 1; mi <= 10; mi++){
    const mes = `2026-${pad(mi)}`;
    const L = (tipo, dia, valor, desc, cat, extra={}) => { const d = `${mes}-${pad(Math.min(dia,28))}`; if (d <= HOJE_ISO) S.lanc.push({id:'l'+(S.seq++), tipo, d, valor:r2(valor), desc, cat, ...extra}); };
    CONTAS_FIXAS.forEach(c => {
      if (mi === 10 && ['cf-son','cf-tx','cf-mei','cf-can'].includes(c.id)) return;      /* pendentes em outubro */

    if (mi % 2 === 1) L('saida', 18, 88 + Math.round(R()*20), 'Água', 'Despesa Fixa');
    for (let i=0;i<2+Math.floor(R()*3);i++) L('saida', 3+i*7, 40+Math.round(R()*180), ['Café da manhã hóspedes','Roupa de cama','Lavanderia','Amenities'][i%4], 'Airbnb');
    L('saida', 9+Math.floor(R()*15), 30+Math.round(R()*150), ['Lâmpadas','Papelaria','Conserto torneira','Tinta parede'][mi%4], 'Manutenção');
    L('saida', 6+Math.floor(R()*15), 60+Math.round(R()*140), 'Insumos cantina', 'Cantina');
    if (R() < .45) L('saida', 14, 120+Math.round(R()*480), ['Ventilador','Almofadas de meditação','Tapetes de yoga','Chaleira elétrica'][mi%4], 'Utensílios/eletro/melhorias');
    if (mi === 6) L('saida', 18, 1840, 'Festival — estrutura e materiais', 'Eventos');

    /* entradas manuais */
    const nb = 1 + Math.floor(R()*3); for (let i=0;i<nb;i++) L('entrada', 2+i*9, airbnb[mi-1]/nb, 'Hospedagem Airbnb', 'Airbnb');
    L('entrada', 10, 300+Math.round(R()*6)*50, 'Coworking — mensalistas', 'Coworking');
    L('entrada', 25, 120+Math.round(R()*230), 'Cantina', 'Cantina');
    if (mi === 6) L('entrada', 20, 4200, 'Festival — ingressos', 'Eventos');
    if ([4,8,10].includes(mi)) L('entrada', 22, 380, 'Yoga & café', 'Eventos');
    if (mi === 7) L('entrada', 4, 400, '50% aluguel do espaço 04/07', 'Extra');
  }

  /* repasses da equipe já pagos (meses fechados) */
  ['2026-08','2026-09'].forEach(mes => EQUIPE.forEach(p => S.repEquipe.push({id:'re'+(S.seq++), p:p.id, mes, d:`${mes.slice(0,5)}${pad(+mes.slice(5)+1)}-05`})));

  /* formação de instrutores: presença por dia de módulo, estágio e monografia */
  S.formandos = FORMACAO.formandos.map(([nome, aluno, dias, estagio, mono], i) => ({id:'fo'+i, nome, aluno, dias, estagio, mono}));

/* ---------- valores e partes ---------- */
function valorMat(S, m){ return m.plano ? S.regras.planos[m.plano] : m.valor; }
function partesVenda(v){
  const f = FORN[v.forn] || {pct:0};
  const forn = r2(v.valor * f.pct);
  return {forn, ea: r2(v.valor - forn)};
}
function taxasYoga(planos, pct = .7){
  const t = {};
  Object.entries(PLANOS_YOGA).forEach(([k,p]) => { t[k] = p.sem ? pct * planos[k] / (p.sem*4) : pct * planos[k]; });
  return t;
}

/* ---------- consultas ---------- */
const alunoPor = (S,id) => S.alunos.find(a => a.id === id);
function presencasDoAluno(S, aid){ return S.presencas.filter(p => p.a === aid).map(p => ({...p, aula:S.aulas[p.s]})).filter(p => p.aula).sort((a,b) => a.aula.d < b.aula.d ? 1 : -1); }
function ultimaVinda(S, aid){ const p = presencasDoAluno(S, aid)[0]; return p ? p.aula.d : null; }
function freqStatus(S, a){
  const turma = a.mats.some(m => m.turmas.some(t => ATIV[TURMA[t].atv].turma));
  if (!turma) return {st:'ok', dias:null, txt:'Hora marcada'};
  const u = ultimaVinda(S, a.id);
  if (!u) return {st:'bad', dias:null, txt:'Ainda não veio'};
  const dias = diasEntre(pd(u), HOJE);
  if (dias > 10.5) return {st:'bad', dias, txt:`Faltando há ${dias} dias`};
  if (dias > 7)    return {st:'warn', dias, txt:`Sem vir há ${dias} dias`};
  return {st:'ok', dias, txt: dias === 0 ? 'Veio hoje' : dias === 1 ? 'Veio ontem' : `Veio há ${dias} dias`};
}
function statusPagamento(S, a, m, mes = MES_ATUAL){
  const pg = S.pagamentos.find(p => p.mat === m.id && p.mes === mes);
  const venc = `${mes}-${pad(Math.min(m.venc,28))}`;
  if (pg) return {st:'pago', pg, venc, txt:`Pago em ${dataBR(pg.d)}`};
  if (m.status === 'cancelado') return {st:'cancelado', venc, txt:`Cancelado em ${dataBR(m.fim || HOJE_ISO)}`};
  if (m.status === 'pausado') return {st:'pausado', venc, txt:'Plano pausado'};
  if (a && a.desde > venc){ const d0 = pd(venc); const prox = iso(new Date(d0.getFullYear(), d0.getMonth()+1, Math.min(m.venc,28))); return {st:'avencer', venc:prox, dias:diasEntre(HOJE, pd(prox)), txt:`Primeira cobrança ${dataBR(prox)}`}; }
  const d = diasEntre(pd(venc), HOJE);
  if (d > 0) return {st:'atrasado', venc, dias:d, txt:`Venceu ${dataBR(venc)} · ${d} ${d===1?'dia':'dias'}`};
  return {st:'avencer', venc, dias:-d, txt: d === 0 ? 'Vence hoje' : `Vence ${dataBR(venc)}`};
}
function proximaCobranca(S, m){
  const st = statusPagamento(S, S.alunos.find(a => a.mats.includes(m)), m);
  if (st.st !== 'pago') return st.venc;
  /* o primeiro mês ainda sem pagamento (quem adiantou não paga duas vezes o mesmo mês) */
  let d = pd(st.venc);
  for (let i = 0; i < 24; i++){ d = new Date(d.getFullYear(), d.getMonth()+1, Math.min(m.venc,28)); const mes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; if (!S.pagamentos.some(p => p.mat === m.id && p.mes === mes)) break; }
  return iso(d);
}
function alunosVisiveis(S, instrId){
  const p = PESSOA[instrId];
  return S.alunos.filter(a => a.mats.some(m => (m.instr ? m.instr === instrId : p.atvs.includes(m.atv) && ATIV[m.atv].vis === 'todos')));
}
function turmasDoInstr(instrId){ return TURMAS.filter(t => t.instr === instrId); }
function matriculadosNaTurma(S, tid){ return S.alunos.filter(a => a.mats.some(m => m.turmas.includes(tid) && m.status === 'ativo')); }

/* ---------- receitas por atividade no mês ---------- */
function receitaMes(S, mes){
  const pct = S.regras.pct, linhas = [];
  const add = (atv, bruto, fonte, instrs) => { if (bruto > 0 || fonte === 'planilha') linhas.push({atv, bruto:r2(bruto), pct:pct[atv] ?? .7, instr:r2(bruto*(pct[atv] ?? .7)), ea:r2(bruto*(1-(pct[atv] ?? .7))), fonte, instrs}); };
  const F = FECH_PLANILHA[mes];
  if (F){
    const P = ATIV; /* na planilha os % eram fixos: 70/30 e inglês 65/35 */
    const lin = (atv, bruto) => linhas.push({atv, bruto, pct:P[atv].repasse, instr:r2(bruto*P[atv].repasse), ea:r2(bruto*(1-P[atv].repasse)), fonte:'planilha'});
    lin('yoga', F.yogaBruto);
    lin('particular', (F.extras.kamala.particular||0) + (F.extras.anajulia.particular||0));
    lin('gestantes', F.extras.kamala.gestantes||0);
    lin('meditacao', F.extras.kamala.meditacao||0);
    Object.entries(F.outras).forEach(([k,v]) => lin(k, v));
  } else if (MENSAL_EXEMPLO[mes]){
    Object.entries(MENSAL_EXEMPLO[mes]).forEach(([k,v]) => add(k, v, 'exemplo'));
  } else {
    const soma = {};
    S.pagamentos.filter(p => p.mes === mes).forEach(p => { const a = alunoPor(S,p.a); const m = a && a.mats.find(x => x.id === p.mat); if (m) soma[m.atv] = (soma[m.atv]||0) + p.valor; });
    S.sessoes.filter(s => mesDe(s.d) === mes).forEach(s => soma[s.atv] = (soma[s.atv]||0) + s.valor);
    Object.keys(ATIV).forEach(k => soma[k] && add(k, soma[k], 'app'));
  }
  const tot = linhas.reduce((t,l) => ({bruto:t.bruto+l.bruto, ea:t.ea+l.ea, instr:t.instr+l.instr}), {bruto:0, ea:0, instr:0});
  return {linhas, ...tot, fonte: F ? 'planilha' : MENSAL_EXEMPLO[mes] ? 'exemplo' : 'app'};
}
function lojaMes(S, mes){
  const vs = S.vendas.filter(v => mesDe(v.d) === mes);
  const r = vs.reduce((t,v) => { const p = partesVenda(v); return {bruto:t.bruto+v.valor, forn:t.forn+p.forn, ea:t.ea+p.ea}; }, {bruto:0, forn:0, ea:0});
  return {...r, n:vs.length, vendas:vs};
}
function balancoMes(S, mes){
  const rec = receitaMes(S, mes), loja = lojaMes(S, mes);
  const lan = S.lanc.filter(l => mesDe(l.d) === mes);
  const manualIn = lan.filter(l => l.tipo === 'entrada'), saidas = lan.filter(l => l.tipo === 'saida');
  const eIn = manualIn.reduce((s,l) => s + l.valor, 0), eOut = saidas.reduce((s,l) => s + l.valor, 0);
  const entradas = rec.ea + loja.ea + eIn;
  return {mes, rec, loja, manualIn, saidas, entradas:r2(entradas), saidasTot:r2(eOut), saldo:r2(entradas - eOut), repassar:r2(rec.instr + loja.forn)};
}

/* ---------- FECHAMENTO DA YOGA (a regra da aba "ALUNOS / INSTRUTORAS") ----------
   1) cada presença vale 70% do plano ÷ aulas do mês; aula vazia vale R$ 10
   2) o "excedente" = 70% das mensalidades − soma do passo 1
   3) o excedente é dividido igualmente por aula dada e somado a cada instrutora
   4) somam-se 70% das particulares, gestantes e meditação */
function fechamentoYoga(S, mes){
  const F = FECH_PLANILHA[mes];
  let bruto, aulaVazia, instrs = {}, extras = {}, fonte, taxas;
  const P = F ? Object.fromEntries(Object.entries(ATIV).map(([k,a]) => [k, a.repasse])) : S.regras.pct;   /* % da equipe */
  if (F){
    fonte = 'planilha'; bruto = F.yogaBruto; aulaVazia = F.aulaVazia;
    taxas = taxasYoga(Object.fromEntries(Object.entries(PLANOS_YOGA).map(([k,p]) => [k,p.preco])));
    Object.entries(F.instr).forEach(([id,v]) => instrs[id] = {aulas:v.aulas, c:{...v.c}});
    Object.entries(F.extras).forEach(([id,v]) => extras[id] = {...v});
  } else {
    fonte = 'app'; aulaVazia = S.regras.aulaVazia; taxas = taxasYoga(S.regras.planos, P.yoga);
    bruto = 0;
    S.pagamentos.filter(p => p.mes === mes).forEach(p => { const a = alunoPor(S,p.a); const m = a && a.mats.find(x => x.id === p.mat); if (m && m.atv === 'yoga') bruto += p.valor; });
    Object.values(S.aulas).filter(au => mesDe(au.d) === mes && au.feita && TURMA[au.turma].atv === 'yoga').forEach(au => {
      const I = instrs[au.instr] = instrs[au.instr] || {aulas:0, c:{vazia:0,'4x':0,'3x':0,'2x':0,'1x':0,avulsa:0}};
      I.aulas++;
      if (au.vazia){ I.c.vazia++; return; }
      S.presencas.filter(p => p.s === au.id).forEach(p => { if (I.c[p.t] !== undefined) I.c[p.t]++; });
    });
    S.pagamentos.filter(p => p.mes === mes).forEach(p => {
      const a = alunoPor(S,p.a); const m = a && a.mats.find(x => x.id === p.mat); if (!m) return;
      if (!['particular','gestantes','meditacao'].includes(m.atv)) return;
      const who = responsavelMat(m); if (!who) return;            /* sem instrutor definido: fica fora até a administração escolher */
      (extras[who] = extras[who] || {})[m.atv] = (extras[who][m.atv] || 0) + p.valor;
    });
  }
  const pool = r2(bruto * P.yoga);
  const linhas = Object.entries(instrs).map(([id,I]) => {
    const aReceber = I.c.vazia*aulaVazia + ['4x','3x','2x','1x','avulsa'].reduce((s,k) => s + I.c[k]*taxas[k], 0);
    return {id, nome:PESSOA[id].nome, aulas:I.aulas, c:I.c, aReceber};
  });
  const somaAR = linhas.reduce((s,l) => s + l.aReceber, 0);
  const totalAulas = linhas.reduce((s,l) => s + l.aulas, 0);
  const excedente = pool - somaAR;
  const porAula = totalAulas ? excedente / totalAulas : 0;
  linhas.forEach(l => {
    l.ajuste = porAula * l.aulas;
    l.yoga = l.aReceber + l.ajuste;
    l.piso = l.aulas * aulaVazia;
    l.yogaFinal = S.regras.piso ? Math.max(l.yoga, l.piso) : l.yoga;
    const ex = extras[l.id] || {};
    l.extras = {particular:(ex.particular||0)*P.particular, gestantes:(ex.gestantes||0)*P.gestantes, meditacao:(ex.meditacao||0)*P.meditacao};
    l.total = l.yogaFinal + l.extras.particular + l.extras.gestantes + l.extras.meditacao;
    if (F && F.conferido) l.conferido = F.conferido[l.id];
  });
  Object.entries(extras).forEach(([id,ex]) => { if (PESSOA[id] && !linhas.find(l => l.id === id)){ const e = {particular:(ex.particular||0)*P.particular, gestantes:(ex.gestantes||0)*P.gestantes, meditacao:(ex.meditacao||0)*P.meditacao}; linhas.push({id, nome:PESSOA[id].nome, aulas:0, c:{vazia:0,'4x':0,'3x':0,'2x':0,'1x':0,avulsa:0}, aReceber:0, ajuste:0, yoga:0, yogaFinal:0, piso:0, extras:e, total:e.particular+e.gestantes+e.meditacao}); }});
  linhas.sort((a,b) => b.total - a.total);
  return {mes, fonte, bruto, pool, pctYoga:P.yoga, aulaVazia, obsVazia: F && F.obsVazia, taxas, linhas, somaAR, totalAulas, excedente, porAula};
}
/* quem dá a aula desta matrícula: o escolhido, o da turma ou o único da atividade */
function responsavelMat(m){
  if (m.instr) return m.instr;
  const t = (m.turmas || []).map(id => TURMA[id]).find(Boolean);
  if (t) return t.instr;
  const quem = EQUIPE.filter(p => p.atvs.includes(m.atv));
  return quem.length === 1 ? quem[0].id : null;
}

/* ---------- repasses da equipe no mês (yoga + demais atividades) ---------- */
function repassesEquipe(S, mes){
  const fy = fechamentoYoga(S, mes), rec = receitaMes(S, mes);
  const out = {};
  const add = (id, lab, v) => { if (Math.abs(v) < .005 || !PESSOA[id]) return; (out[id] = out[id] || {id, nome:PESSOA[id].nome, itens:[], total:0}).itens.push({lab, v}); out[id].total += v; };
  fy.linhas.forEach(l => { add(l.id, 'Yoga (turmas)', l.yogaFinal); add(l.id, 'Particular', l.extras.particular); add(l.id, 'Gestantes', l.extras.gestantes); add(l.id, 'Meditação', l.extras.meditacao); });
  const dono = {aquarela:'bruno', musicalizacao:'brunos', violao:'brunos', ingles:'marina', massagem:'aurelice', terapias:'kamala'};
  rec.linhas.filter(l => dono[l.atv]).forEach(l => add(dono[l.atv], ATIV[l.atv].curto, l.instr));
  (S.descontos || []).filter(d => d.mes === mes && out[d.p]).forEach(d => add(d.p, `Lojinha: ${d.desc}`, -d.valor));
  return Object.values(out).map(o => ({...o, pago: S.repEquipe.find(r => r.p === o.id && r.mes === mes)})).sort((a,b) => b.total - a.total);
}

/* ---------- lojinha: quanto devo a cada fornecedor ---------- */
function saldoFornecedores(S){
  return FORNECEDORES.filter(f => f.pct > 0).map(f => {
    const devido = S.vendas.filter(v => v.forn === f.id).reduce((s,v) => s + partesVenda(v).forn, 0);
    const pago = S.repLoja.filter(r => r.forn === f.id).reduce((s,r) => s + r.valor, 0);
    const vendasAbertas = S.vendas.filter(v => v.forn === f.id && v.d > (S.repLoja.filter(r => r.forn === f.id).map(r => r.d).sort().pop() || '0')).length;
    return {...f, devido:r2(devido), pago:r2(pago), saldo:r2(devido - pago), vendasAbertas};
  }).sort((a,b) => b.saldo - a.saldo);
}

/* ---------- alertas do painel ---------- */
function alertasAdmin(S){
  const A = [];
  const atrasados = [], semPagar = [];
  S.alunos.forEach(a => a.mats.forEach(m => {
    const st = statusPagamento(S, a, m);
    if (st.st === 'atrasado'){
      atrasados.push({a, m, st});
      const veio = presencasDoAluno(S, a.id).some(p => mesDe(p.aula.d) === MES_ATUAL);
      if (veio) semPagar.push(a);
    }
  }));
  if (atrasados.length) A.push({cls:'bad', icon:'circle-alert', t:`${atrasados.length} mensalidades atrasadas`, s:`${brl(atrasados.reduce((s,x) => s + valorMat(S,x.m), 0))} em aberto · ${atrasados.slice(0,3).map(x => x.a.nome.split(' ')[0]).join(', ')}${atrasados.length>3?'…':''}`, go:'admin-mensalidades'});
  if (semPagar.length) A.push({cls:'warn', icon:'user-round-check', t:`${semPagar.length} vieram às aulas sem mensalidade paga`, s:`O app cruzou a chamada com os pagamentos: ${[...new Set(semPagar.map(a => a.nome.split(' ')[0]))].join(', ')}`, go:'admin-mensalidades'});
  const sumidos = S.alunos.map(a => ({a, f:freqStatus(S,a)})).filter(x => x.f.st !== 'ok');
  if (sumidos.length) A.push({cls:'warn', icon:'clock', t:`${sumidos.length} alunos sumindo`, s:sumidos.map(x => `${x.a.nome.split(' ')[0]} (${x.f.dias ?? '—'}d)`).join(' · '), go:'admin-alunos'});
  const forn = saldoFornecedores(S).filter(f => f.saldo > .01);
  if (forn.length) A.push({cls:'pri', icon:'store', t:`${brl(forn.reduce((s,f) => s+f.saldo,0))} a pagar a ${forn.length} fornecedores`, s:forn.slice(0,4).map(f => f.curto).join(', ') + (forn.length>4?'…':''), go:'admin-lojinha', sub:'fornecedores'});
  const fiado = S.fiado.filter(f => !f.pago);
  if (fiado.length) A.push({cls:'pri', icon:'receipt', t:`${brl(fiado.reduce((s,f) => s+f.valor,0))} a receber da lojinha`, s:`${fiado.length} compras fiadas ou parceladas`, go:'admin-lojinha', sub:'receber'});
  const subs = S.subs.filter(s => s.status === 'aberto');
  if (subs.length) A.push({cls:'warn', icon:'repeat', t:`${subs.length} pedido de substituição sem resposta`, s:subs.map(s => `${PESSOA[s.de].nome} · ${nomeTurma(TURMA[s.turma])} ${DIAS[pd(s.d).getDay()]} ${dataBR(s.d)}`).join(' · '), go:'admin-mais'});
  const pend = Object.values(S.aulas).filter(a => !a.feita);
  if (pend.length) A.push({cls:'pri', icon:'list-checks', t:`${pend.length} chamadas de hoje por fazer`, s:pend.map(a => `${nomeTurma(TURMA[a.turma])} ${TURMA[a.turma].h} · ${PESSOA[a.instr].nome}`).join(' · '), go:'admin-mais'});
  return A;
}
/* ---------- formação ---------- */
function formacaoStatus(){
  const feitos = FORMACAO.datas.filter(d => d <= HOJE_ISO).length, diasDados = feitos * 2;
  const prox = FORMACAO.datas.find(d => d > HOJE_ISO);
  return {feitos, diasDados, prox};
}
function formandoSituacao(f, st){
  const pct = st.diasDados ? f.dias / st.diasDados : 1;
  const faltasPermitidas = Math.floor(FORMACAO.modulos * 2 * .2), faltas = st.diasDados - f.dias;
  const sobra = faltasPermitidas - faltas;
  const estado = sobra < 0 ? 'bad' : sobra <= 2 ? 'warn' : 'ok';
  return {pct, faltas, sobra, st:estado, ok: sobra >= 0, txt: sobra < 0 ? 'passou do limite de faltas: precisa repor' : sobra === 0 ? 'não pode mais faltar' : `pode faltar mais ${sobra} ${sobra===1?'dia':'dias'} no curso`};
}
function contasDoMes(S, mes){
  return CONTAS_FIXAS.map(c => ({...c, pago: S.lanc.find(l => l.conta === c.id && mesDe(l.d) === mes)}));
}

/* ---------- SOL DE ARCOS (assinatura, tirado da logo) ---------- */
function solArcos(arcos, centro, sub){
  const cx = 140, cy = 152, raios = [128,104,80], sw = 15;
  const cores = ['var(--sol)','var(--acafrao)','var(--folha)'];
  const path = r => `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  const sementes = [[-14,-58],[0,-62],[14,-58],[-7,-48],[7,-48],[0,-38]].map(([x,y]) => `<circle class="seed" cx="${cx+x}" cy="${cy+y}" r="3.6"/>`).join('');
  return `<div class="solar" role="img" aria-label="${escapeH(arcos.map(a => a.lab + ': ' + Math.round(a.pct*100) + '%').join('; '))}">
    <div class="raios" aria-hidden="true"></div>
    <svg viewBox="0 0 280 170">
      ${arcos.map((a,i) => { const L = Math.PI*raios[i]; return `<path class="trk" d="${path(raios[i])}" stroke-width="${sw}"/><path class="arc" d="${path(raios[i])}" stroke="${cores[i]}" stroke-width="${sw}" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${(RM ? L*(1-Math.max(0,Math.min(1,a.pct))) : L).toFixed(1)}" data-len="${L.toFixed(1)}" data-pct="${Math.max(0,Math.min(1,a.pct))}" style="transition-delay:${i*140}ms"/>`; }).join('')}
      ${sementes}
    </svg>
    <div class="center"><b class="${String(centro).replace(/<[^>]+>/g,'').length > 6 ? 'long' : ''}">${centro}</b><span>${sub}</span></div>
  </div>`;
}
function legendaArcos(arcos){
  const cores = ['var(--sol)','var(--acafrao)','var(--folha)'];
  return arcos.map((a,i) => `<div class="lg-row"><i style="background:${cores[i]}"></i><span class="lab">${a.lab}</span><span class="val">${a.val}</span><div class="bar"><span style="width:${RM?Math.round(a.pct*100):0}%;background:${cores[i]}" data-w="${Math.round(Math.max(0,Math.min(1,a.pct))*100)}"></span></div></div>`).join('');
}
function animarArcos(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('.solar .arc').forEach(p => { p.style.strokeDashoffset = (p.dataset.len * (1 - p.dataset.pct)).toFixed(1); });
    $$('.lg-row .bar span, .hbar .track span').forEach(s => { if (s.dataset.w) s.style.width = s.dataset.w + '%'; });
  }));
}

/* ---------- gráfico do ano: entradas x saídas ---------- */
function graficoAno(dados, {alto=230, saldos=true}={}){
  const W = 720, H = alto, padL = 46, padB = 26, padT = 10, w = W - padL - 8;
  const max = Math.max(1000, ...dados.map(d => Math.max(d.entradas, d.saidas)));
  const passo = max > 12000 ? 4000 : max > 6000 ? 2000 : 1000;
  const topo = Math.ceil(max / passo) * passo;
  const y = v => padT + (H - padT - padB) * (1 - v / topo);
  const bw = w / 12, bar = Math.min(18, bw/2 - 4);
  let g = '';
  for (let v = 0; v <= topo; v += passo) g += `<line class="gl" x1="${padL}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${padL-8}" y="${y(v)+4}" text-anchor="end">${v ? (v/1000).toLocaleString('pt-BR') + ' mil' : '0'}</text>`;
  const rb = (x, yy, ww, hh) => { if (hh < 1) return ''; const r = Math.min(4, ww/2, hh); return `M${x},${yy+hh} L${x},${yy+r} Q${x},${yy} ${x+r},${yy} L${x+ww-r},${yy} Q${x+ww},${yy} ${x+ww},${yy+r} L${x+ww},${yy+hh} Z`; };
  dados.forEach((d,i) => {
    const x0 = padL + i*bw, cxm = x0 + bw/2;
    g += `<rect class="hit" data-i="${i}" x="${x0+1}" y="${padT}" width="${bw-2}" height="${H-padT-padB}" rx="8"/>`;
    if (d.futuro){ g += `<rect class="future" x="${cxm - bar - 1}" y="${y(0)-3}" width="${bar*2+2}" height="3" rx="1.5"/>`; }
    else {
      g += `<path class="bin" d="${rb(cxm - bar - 1, y(d.entradas), bar, y(0) - y(d.entradas))}"/>`;
      g += `<path class="bout" d="${rb(cxm + 1, y(d.saidas), bar, y(0) - y(d.saidas))}"/>`;
    }
    g += `<text class="ax" x="${cxm}" y="${H-8}" text-anchor="middle" ${d.atual?'style="font-weight:800;fill:var(--ink)"':''}>${MESES_C[i]}</text>`;
  });
  return `<div class="chart" data-chart='${escapeH(JSON.stringify(dados.map(d => ({m:d.mes, e:d.entradas, s:d.saidas, f:d.futuro}))))}'>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas do Espaço por mês em 2026">${g}</svg>
    ${saldos ? `<div class="saldos" style="margin-left:${(padL/W*100).toFixed(2)}%;margin-right:${(8/W*100).toFixed(2)}%">${dados.map(d => d.futuro ? '<span>—</span>' : `<span class="${d.entradas-d.saidas>=0?'pos':'neg'}">${d.entradas-d.saidas>=0?'+':'−'}${(Math.abs(d.entradas-d.saidas)/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})}k</span>`).join('')}</div>` : ''}
    <div class="tip" role="status"></div>
  </div>`;
}
function ligarGraficos(){
  $$('.chart[data-chart]').forEach(ch => {
    const dados = JSON.parse(ch.dataset.chart), tip = ch.querySelector('.tip');
    const mostrar = (i, el) => {
      const d = dados[i]; $$('.hit', ch).forEach(h => h.classList.toggle('on', h === el));
      if (d.f){ tip.innerHTML = `<b>${nomeMes(d.m)}</b><div>Ainda não chegou</div>`; }
      else tip.innerHTML = `<b>${nomeMes(d.m)}</b><div class="r"><span>Entradas do Espaço</span><span>${brl(d.e)}</span></div><div class="r"><span>Saídas</span><span>${brl(d.s)}</span></div><div class="r" style="border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:4px"><b>Saldo</b><b>${brl(d.e-d.s)}</b></div>`;
      const r = el.getBoundingClientRect(), cr = ch.getBoundingClientRect();
      let left = r.left - cr.left + r.width/2 - 95; left = Math.max(0, Math.min(cr.width - 190, left));
      tip.style.left = left + 'px'; tip.style.top = '-8px'; tip.classList.add('on');
    };
    $$('.hit', ch).forEach(h => {
      h.addEventListener('mouseenter', () => mostrar(+h.dataset.i, h));
      h.addEventListener('click', () => mostrar(+h.dataset.i, h));
    });
    ch.addEventListener('mouseleave', () => { tip.classList.remove('on'); $$('.hit', ch).forEach(h => h.classList.remove('on')); });
  });
}
function dadosAno(){
  return MESES.map((_,i) => {
    const mes = `2026-${pad(i+1)}`;
    if (mes > MES_ATUAL) return {mes, entradas:0, saidas:0, futuro:true};
    const b = balancoMes(S, mes);
    return {mes, entradas:b.entradas, saidas:b.saidasTot, atual: mes === MES_ATUAL};
  });
}
const hbarras = (itens, cor='var(--chart-out)') => { const mx = Math.max(1, ...itens.map(i => i.v)); return `<div class="hbar">${itens.map(i => `<span>${i.lab}</span><b class="num">${brl(i.v)}</b><div class="track"><span style="width:${RM?Math.round(i.v/mx*100):0}%;background:${cor}" data-w="${Math.round(i.v/mx*100)}"></span></div>`).join('')}</div>`; };

/* pontinhos de frequência das últimas N semanas */
function pontosSemanas(aid, n=8){
  const pres = new Set(presencasDoAluno(S, aid).map(p => p.aula.d));
  let out = '';
  for (let w = n-1; w >= 0; w--){
    const fim = addD(HOJE, -w*7), ini_ = addD(fim, -6);
    let veio = false; for (let d = ini_; d <= fim; d = addD(d,1)) if (pres.has(iso(d))) { veio = true; break; }
    out += `<i class="${veio?'on':''}" title="semana de ${dataBR(iso(ini_))}"></i>`;
  }
  return `<span class="dots" aria-label="presença nas últimas ${n} semanas">${out}</span>`;
}

  avencer:`<span class="pill warn">${ic('clock')}A vencer</span>`,

const pillFreq = f => `<span class="row" style="gap:6px"><i class="fdot ${f.st}"></i><span class="small ${f.st==='ok'?'muted':''}" style="${f.st==='bad'?'color:var(--bad)':f.st==='warn'?'color:var(--warn)':''};font-weight:${f.st==='ok'?500:700}">${f.txt}</span></span>`;
const nomePlano = m => m.plano ? `${ATIV[m.atv].curto} ${m.plano}` : ATIV[m.atv].curto;
const qrSVG = (seed) => {
  const R = rng(seed), n = 25; let r = '';
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1F1B45"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1F1B45"/>`;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){ const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if (!inF && R() < .48) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1F1B45"/>`; }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>${r}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
};

    <div class="stat"><span class="k">${ic('repeat','sm')}A repassar</span><span class="v">${brl0(rep)}</span><span class="d">equipe + fornecedores</span></div>

function vBalancoAno(){

    <div class="stat"><span class="k">Melhor e pior mês</span><span class="v" style="font-size:20px">${mesCurto(melhor.mes)} · ${mesCurto(pior.mes)}</span><span class="d">${brl0(melhor.entradas-melhor.saidas)} · ${brl0(pior.entradas-pior.saidas)}</span></div>
  </div>
  <div class="card pad-lg"><div class="card-h"><div><h3>Entradas do Espaço × saídas</h3><span class="sub">Toque num mês para ver os números. Embaixo, o saldo de cada mês.</span></div>
    <div class="ckey"><span><i style="background:var(--chart-in)"></i>Entradas do Espaço</span><span><i style="background:var(--chart-out)"></i>Saídas</span></div></div>

    <div class="card"><div class="card-h"><h3>De onde veio</h3><span class="sub">parte do Espaço em 2026</span></div>${(() => {
      const o = {Mensalidades:0, Lojinha:0}; d.forEach(x => { const b = balancoMes(S, x.mes); o.Mensalidades += b.rec.ea; o.Lojinha += b.loja.ea; b.manualIn.forEach(l => o[l.cat] = (o[l.cat]||0) + l.valor); });
      return hbarras(Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([lab,v])=>({lab,v})), 'var(--chart-in)'); })()}</div>
  </div>
  <div class="card"><div class="card-h"><h3>Mês a mês</h3></div><div class="tbl-w"><table class="tbl"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th><th>Acumulado</th></tr></thead><tbody>${(() => { let ac = 0; return d.map(x => { ac += x.entradas - x.saidas; return `<tr><td>${nomeMes(x.mes)}</td><td>${brl(x.entradas)}</td><td>${brl(x.saidas)}</td><td class="${x.entradas-x.saidas>=0?'pos':'neg'}">${brl(x.entradas-x.saidas)}</td><td>${brl(ac)}</td></tr>`; }).join(''); })()}<tr class="tot"><td>Total</td><td>${brl(e)}</td><td>${brl(sa)}</td><td>${brl(e-sa)}</td><td></td></tr></tbody></table></div></div>`;

function vInstrutor(){
  const t = UI.tab.instrutor;
  if (t === 'agenda') return `<div class="pagehead"><div><h1>Agenda</h1><p>A grade do Espaço com as suas aulas em destaque.</p></div></div>${vGrade(UI.who.instrutor)}${vMinhasSubs()}`;
  if (t === 'alunos') return vInstrAlunos();
  if (t === 'mes') return vMeuMes();
  return vInstrHoje();
}
function aulasDeHoje(pid){
  return TURMAS.filter(t => t.dia === HOJE.getDay() && t.instr === pid).sort((a,b) => a.h.localeCompare(b.h)).map(t => ({t, au:S.aulas[`${HOJE_ISO}_${t.id}`]}));
}
function estimativaMes(pid, mes=MES_ATUAL){
  const r = repassesEquipe(S, mes).find(x => x.id === pid);
  return r ? r.total : 0;
}
function vInstrHoje(){
  const pid = UI.who.instrutor, p = PESSOA[pid];
  const minhasT = turmasDoInstr(pid).map(t => t.id);
  const doMes = Object.values(S.aulas).filter(a => mesDe(a.d) === MES_ATUAL && a.instr === pid);
  let previstas = doMes.length;
  for (let d = addD(HOJE,1); iso(d) <= fimDoMes(MES_ATUAL); d = addD(d,1)) previstas += TURMAS.filter(t => t.dia === d.getDay() && t.instr === pid).length;
  previstas += TURMAS.filter(t => t.dia === HOJE.getDay() && t.instr === pid && !S.aulas[`${HOJE_ISO}_${t.id}`]).length;
  const feitas = doMes.filter(a => a.feita).length;
  let ocup = 0, cap = 0;
  doMes.filter(a => a.feita).forEach(a => { const n = matriculadosNaTurma(S, a.turma).length || 1; cap += n; ocup += Math.min(n, S.presencas.filter(x => x.s === a.id && x.a).length); });
  const vis = alunosVisiveis(S, pid), fs = vis.map(a => ({a, f:freqStatus(S,a)}));

    {lab:'Aulas dadas em outubro', val:`${feitas} de ${previstas}`, pct: previstas ? feitas/previstas : 0},
    {lab:'Presença média nas suas aulas', val:`${cap?Math.round(ocup/cap*100):0}%`, pct: cap ? ocup/cap : 0},
    {lab:'Seus alunos em dia com a frequência', val:`${emDia} de ${vis.length}`, pct: vis.length ? emDia/vis.length : 0},
  ];
  const hoje = aulasDeHoje(pid);
  const pedidos = pedidosPara(pid);
  const atencao = fs.filter(x => x.f.st !== 'ok').sort((a,b) => (b.f.dias||99) - (a.f.dias||99));
  const prox = (() => { for (let i=1;i<8;i++){ const d = addD(HOJE,i); const ts = TURMAS.filter(t => t.dia === d.getDay() && t.instr === pid).sort((a,b)=>a.h.localeCompare(b.h)); if (ts.length) return {d, t:ts[0]}; } })();
  return `
  <div class="pagehead anim-in"><div><h1>${saudacao()}, ${p.nome}</h1><p>${dataLonga(HOJE_ISO).replace(/^./, c => c.toUpperCase())} · ${p.atvs.map(a => ATIV[a].curto).join(', ')}</p></div></div>

    ${solArcos(arcos, brl0(estimativaMes(pid)), 'seu mês até agora')}
    <div class="legend"><h2>Seu outubro</h2><p class="lead">Estimativa do seu repasse, somando todas as suas atividades. O valor final sai no fechamento.</p>${legendaArcos(arcos)}</div>
  </section>
  <div class="split">
    <div class="card"><div class="card-h"><h3>Suas aulas de hoje</h3><span class="sub">${DIAS_L[HOJE.getDay()]}, ${dataBR(HOJE_ISO)}</span></div>
      <div class="list">${hoje.length ? hoje.map(({t,au}) => {
        const n = au && au.feita ? S.presencas.filter(x => x.s === au.id).length : 0;
        const estado = !au ? `<span class="pill neu">${ic('clock')}às ${t.h}</span>` : au.feita ? `<span class="pill ok">${ic('check')}${au.vazia?'Aula vazia':n+' presentes'}</span>` : `<button class="btn sol sm" data-act="chamada" data-v="${HOJE_ISO}_${t.id}">${ic('list-checks','sm')}Fazer chamada</button>`;
        return `<div class="li"><span class="ico-b" style="color:${ATIV[t.atv].hex}">${ic(ATIV[t.atv].icon)}</span><div class="main-c"><span class="t">${nomeTurma(t)} · ${t.h}</span><span class="s">${t.sala} · ${t.aluno ? alunoPor(S,t.aluno).nome : matriculadosNaTurma(S,t.id).length+' matriculados'}${au && !au.feita ? ' · <b style="color:var(--sol-ink)">chamada pendente</b>' : ''}</span></div><div class="end">${estado}</div></div>`; }).join('')
        : `<p class="muted">Hoje você não tem aulas.${prox ? ` A próxima é ${nomeTurma(prox.t)} ${DIAS_L[prox.d.getDay()].toLowerCase()} às ${prox.t.h}.` : ''}</p>`}</div>

function tempoPratica(desde){
  const d = pd(desde); let m = (HOJE.getFullYear()-d.getFullYear())*12 + HOJE.getMonth()-d.getMonth(); if (HOJE.getDate() < d.getDate()) m--;
  const a = Math.floor(m/12), r = m%12;
  if (a && r) return `${a} ${a===1?'ano':'anos'} e ${r} ${r===1?'mês':'meses'}`;
  if (a) return `${a} ${a===1?'ano':'anos'}`;
  return m <= 0 ? 'começou agora' : `${m} ${m===1?'mês':'meses'}`;
}
function proximasAulas(a, n=6){
  const out = [], tids = a.mats.filter(m => m.status === 'ativo').flatMap(m => m.turmas);
  for (let i = 0; out.length < n && i < 21; i++){
    const d = addD(HOJE, i);
    TURMAS.filter(t => tids.includes(t.id) && t.dia === d.getDay()).sort((x,y)=>x.h.localeCompare(y.h)).forEach(t => {
      const [hh,mm] = t.h.split(':').map(Number);
      if (i === 0 && hh*60+mm <= HOJE.getHours()*60+HOJE.getMinutes()) return;
      const s = S.subs.find(x => x.turma === t.id && x.d === iso(d) && x.status === 'aceito');
      out.push({t, d:iso(d), sid:`${iso(d)}_${t.id}`, instr: s ? s.para : t.instr});
    });
  }
  return out.slice(0,n);
}

    d.animate([{transform:'translate(0,0) scale(1)', opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist - 60}px) scale(.4)`, opacity:0}], {duration:900+Math.random()*400, easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish = () => d.remove();

/* ---------- 3D: anel de fornecedores e cartões que inclinam ---------- */
let RING = {rot:0, vel:0, drag:false, raf:0, lastX:0, moved:0, idle:0};
function ligarLoja(){
  const stage = $('#ringStage'), ring = $('#ring');
  if (stage && ring){
    const n = ring.children.length, passo = 360/n;
    if (UI.lojaForn){ const i = +($(`.fcard[data-v="${UI.lojaForn}"]`, ring)?.dataset.i || 0); RING.rot = -i*passo; }
    ring.style.setProperty('--rot', RING.rot + 'deg');
    stage.onpointerdown = e => { RING.drag = true; RING.lastX = e.clientX; RING.moved = 0; RING.vel = 0; };
    window.onpointermove = e => { if (!RING.drag) return; const dx = e.clientX - RING.lastX; RING.lastX = e.clientX; RING.moved += Math.abs(dx); RING.rot += dx * .35; RING.vel = dx * .35; ring.style.setProperty('--rot', RING.rot + 'deg'); };
    window.onpointerup = () => { RING.drag = false; RING.idle = performance.now(); };
    stage.addEventListener('click', e => { if (RING.moved > 6){ e.stopPropagation(); e.preventDefault(); } }, true);
    cancelAnimationFrame(RING.raf);
    const tick = () => {
      if (!document.body.contains(ring)) return;
      if (!RING.drag){
        if (Math.abs(RING.vel) > .02){ RING.rot += RING.vel; RING.vel *= .94; }
        else if (!RM && !UI.lojaForn && performance.now() - RING.idle > 1500) RING.rot -= .08;
        ring.style.setProperty('--rot', RING.rot + 'deg');
      }
      RING.raf = requestAnimationFrame(tick);
    };
    RING.raf = requestAnimationFrame(tick);
  }
  if (!RM) $$('.prod').forEach(c => {
    c.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const r = c.getBoundingClientRect(), x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height; c.style.transform = `perspective(700px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*14}deg) translateZ(6px)`; c.style.setProperty('--mx', x*100+'%'); c.style.setProperty('--my', y*100+'%'); });
    c.addEventListener('pointerleave', () => { c.style.transform = ''; });
  });
}
function voar(de){
  const bar = $('#cartbar'); if (!de || !bar || RM) return;
  const a = de.querySelector('.ped').getBoundingClientRect(), b = bar.querySelector('.ci').getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'flyer'; f.style.setProperty('--hue', getComputedStyle(de).getPropertyValue('--hue')); f.style.left = (a.left + a.width/2 - 22) + 'px'; f.style.top = (a.top + a.height/2 - 22) + 'px';
  f.innerHTML = de.querySelector('.ped').innerHTML; document.body.appendChild(f);
  const dx = b.left - a.left - a.width/2 + 22, dy = b.top - a.top - a.height/2 + 22;
  f.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.5}px,${dy*.5 - 140}px) scale(.85) rotate(-12deg)`, offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.3) rotate(8deg)`, opacity:.3}], {duration:650, easing:'cubic-bezier(.45,.05,.35,1)'}).onfinish = () => { f.remove(); bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); };
}
