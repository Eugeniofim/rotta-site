<link rel="stylesheet" href="../comum/estilo.css">
<style>
  /* O painel é claro: é ferramenta de trabalho, não vitrine. Mesma marca, outra luz. */
  :root { --fundo: #f6efe4; --cartao: #fffaf3; --linha: #e6d9c6; --tinta: #2a1913; --tinta-2: #6b5446; }
  body { background: var(--fundo); color: var(--tinta); color-scheme: light; }
  .casca { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

  .lado { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; background: var(--cacau); color: var(--creme); }
  .marca { display: flex; gap: 10px; align-items: center; padding: 0 8px 22px; }
  .marca img { width: 40px; height: 40px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(255,233,184,.25); }
  .marca b { display: block; font: 400 19px/1.1 var(--display); }
  .marca small { color: var(--creme-2); font-size: 12px; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none; color: var(--creme-2); font-weight: 600; font-size: 15px; position: relative; }
  .menu a:hover { background: rgba(243,230,211,.06); color: var(--creme); }
  .menu a[aria-current="page"] { background: rgba(255,233,184,.1); color: var(--led); }
  .menu a[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--led); box-shadow: var(--brilho); }
  .menu .conta { margin-left: auto; font: 600 12px/1 var(--texto); background: var(--led); color: var(--cacau); padding: 4px 7px; border-radius: 999px; }
  .lado-pe { margin-top: auto; display: grid; gap: 8px; padding: 0 8px; font-size: 13px; color: var(--creme-2); }
  .lado-pe a { color: var(--led); font-weight: 600; }

  .conteudo { padding: 30px 34px 60px; max-width: 1080px; width: 100%; }
  .cabeca { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font: 400 36px/1.08 var(--display); margin: 4px 0 0; }
  .rotulo { color: var(--tinta-2); }
  h2 { font: 400 23px/1.15 var(--display); margin: 0 0 14px; }
  .sub { color: var(--tinta-2); margin: 4px 0 0; }

  .grade { display: grid; gap: 14px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g-3-2 { grid-template-columns: 3fr 2fr; }
  .caixa { background: var(--cartao); border: 1px solid var(--linha); border-radius: 20px; padding: 20px; }
  .numero { font: 400 40px/1 var(--display); margin: 10px 0 6px; }
  .numero-nota { font-size: 13px; color: var(--tinta-2); }
  .numero-nota b { color: #2f6b3a; }
  .destaque { background: var(--cacau); color: var(--creme); border: 0; }
  .destaque .rotulo, .destaque .numero-nota { color: var(--creme-2); }
  .destaque .numero { color: var(--led); text-shadow: 0 0 14px rgba(255,214,140,.45); }

  .barras { display: grid; gap: 14px; }
  .barra-linha { display: grid; grid-template-columns: 170px 1fr 44px; gap: 12px; align-items: center; font-size: 14px; }
  .barra-linha span:first-child { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .barra { height: 12px; border-radius: 6px; background: #efe4d3; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 6px; background: var(--massa); }
  .barra-linha.maq .barra i { background: var(--cacau); box-shadow: inset 0 0 0 2px var(--led); }
  .barra-linha b { text-align: right; }
  .nota-barras { margin: 14px 0 0; font-size: 13px; color: var(--tinta-2); }

  .tarefas { list-style: none; margin: 0; padding: 0; }
  .tarefas li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linha); font-size: 15px; }
  .tarefas li:last-child { border-bottom: 0; }
  .tarefas small { display: block; color: var(--tinta-2); font-size: 13px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer; font: 700 15px/1.1 var(--texto); text-decoration: none; white-space: nowrap; }
  .btn .ic { width: 18px; height: 18px; }
  .btn-escuro { background: var(--cacau); color: var(--creme); }
  .btn-led { background: var(--led); color: var(--cacau); box-shadow: 0 0 0 1px #e8cf94 inset; }
  .btn-linha { background: transparent; color: var(--tinta); border: 1.5px solid var(--linha); }
  .btn-zap { background: var(--zap); color: #06301a; }
  .btn-peq { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .tema-cartao { display: flex; flex-direction: column; gap: 8px; }
  .tema-cartao.ativo { border-color: var(--cacau); box-shadow: 0 0 0 2px var(--cacau) inset; }
  .tema-cartao h2 { font: 400 24px/1.1 var(--display); margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tema-cartao p { margin: 0; color: var(--tinta-2); font-size: 14px; flex: 1; }
  .tema-cores { display: flex; gap: 6px; }
  .tema-cores i { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset; }
  .tema-selo { font: 600 11px/1 var(--rotulo); letter-spacing: .14em; text-transform: uppercase; background: var(--cacau); color: var(--led); padding: 6px 8px; border-radius: 6px; }
  .tema-botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .tema-botoes .btn-peq { min-height: 44px; }
  .btn[disabled] { opacity: .4; cursor: default; }

  .campo { display: grid; gap: 6px; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .campo input, .campo select, .campo textarea { width: 100%; min-width: 0; box-sizing: border-box; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: #fff; font: 500 15px var(--texto); color: var(--tinta); }
  .campo textarea { min-height: 90px; resize: vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--massa); }
  .ajuda { font-weight: 400; color: var(--tinta-2); font-size: 13px; }

  .busca { position: relative; margin-bottom: 14px; }
  .busca .ic { position: absolute; left: 14px; top: 13px; color: var(--tinta-2); }
  .busca input { width: 100%; min-height: 46px; padding: 10px 14px 10px 44px; border-radius: 999px; border: 1.5px solid var(--linha); background: #fff; font: 500 15px var(--texto); }
  .tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabela th { text-align: left; font: 500 11px/1 var(--rotulo); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); padding: 10px 10px; border-bottom: 1px solid var(--linha); }
  .tabela td { padding: 12px 10px; border-bottom: 1px solid var(--linha); }
  .tabela tr.clicavel { cursor: pointer; }
  .tabela tr.clicavel:hover td { background: #fbf4ea; }
  .pessoa { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .ini { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--oliva); color: #fff; font-size: 13px; font-weight: 700; flex: none; }
  .faixa { font: 500 11px/1 var(--rotulo); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; background: #efe4d3; }
  .faixa.Prata { background: #e4e4e0; } .faixa.Ouro { background: #f5dfa3; } .faixa.Master { background: var(--cacau); color: var(--led); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label span { display: inline-flex; gap: 6px; align-items: center; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--linha); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chips label input:checked + span { background: var(--cacau); color: var(--creme); border-color: var(--cacau); }
  .chips label input:focus-visible + span { outline: 2px solid var(--massa); outline-offset: 2px; }
  .chips em { font-style: normal; font-size: 12px; opacity: .7; }

  /* prévia do aviso no celular */
  .celular { width: 280px; margin: 0 auto; padding: 16px 12px 22px; border-radius: 36px; background: linear-gradient(160deg, #3b2a2f, #191010); box-shadow: 0 20px 40px rgba(42,25,19,.25); }
  .celular .hora { color: #fff; text-align: center; font: 300 46px/1 var(--texto); margin: 20px 0 4px; }
  .celular .data { color: #e9dfd5; text-align: center; font-size: 13px; margin-bottom: 26px; }
  .notif { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px; border-radius: 18px; background: rgba(255,250,243,.9); font-size: 13px; color: #1c1210; }
  .notif img { width: 34px; height: 34px; border-radius: 9px; }
  .notif b { display: block; font-size: 14px; }
  .notif small { color: #6b5446; font-size: 11px; }

  .lote { display: grid; grid-template-columns: 1fr 160px auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
  .lote:last-child { border-bottom: 0; }

  .resultado { padding: 16px; border-radius: 16px; background: #fbf4ea; border: 1.5px dashed var(--massa); margin-top: 6px; }
  .resultado.ok { border-color: #2f6b3a; background: #eef5ec; }
  .resultado.erro { border-color: #b3261e; background: #fbecea; color: #7a1a14; }

  dialog.ficha { width: min(560px, 100%); max-height: 92vh; padding: 0; border: 0; border-radius: 24px; background: var(--cartao); color: var(--tinta); }
  dialog.ficha::backdrop { background: rgba(42,25,19,.45); }
  .ficha-corpo { padding: 24px; }
  .ficha-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .fechar { background: none; border: 0; cursor: pointer; padding: 8px; border-radius: 50%; }
  .passo { display: inline-flex; align-items: center; border: 1.5px solid var(--linha); border-radius: 999px; overflow: hidden; background: #fff; }
  .passo button { width: 44px; height: 44px; border: 0; background: none; font-size: 20px; cursor: pointer; }
  .passo output { min-width: 34px; text-align: center; font-weight: 700; }
  .extrato { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow: auto; font-size: 14px; }
  .extrato li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linha); }
  .extrato small { display: block; color: var(--tinta-2); font-size: 12px; }
  .mais { color: #2f6b3a; font-weight: 700; } .menos { color: #b3261e; font-weight: 700; }

  .toast { position: fixed; right: 24px; bottom: 24px; z-index: 40; padding: 14px 18px; border-radius: 16px; background: var(--cacau); color: var(--creme); box-shadow: 0 12px 30px rgba(0,0,0,.3); display: flex; gap: 10px; align-items: center; font-weight: 600; animation: sobe .25s ease; }
  .toast .ic { color: var(--led); }
  @keyframes sobe { from { transform: translateY(12px); opacity: 0; } }

  .entrar-painel { max-width: 420px; margin: 8vh auto 0; }
  .entrar-painel h1 { margin-top: 2px; }
  /* o clube sugere: cada linha já vem com o botão que resolve */
  .sugere { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .sugere li { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: #fbf4ea; border: 1px solid var(--linha); }
  .sugere li > i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--cacau); color: var(--led); font-style: normal; }
  .sugere b { display: block; font-size: 15px; }
  .sugere small { display: block; color: var(--tinta-2); font-size: 13px; margin-top: 2px; }
  .sugere .s-dobro-ligado { background: #fff4d6; border-color: #e8cf94; }
  @media (max-width: 620px) { .sugere li { grid-template-columns: 40px 1fr; } .sugere li .btn { grid-column: 1 / -1; } }
  /* selos do passaporte na ficha */
  .mini-selos { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
  .mini-selos span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1.5px dashed var(--linha); color: var(--tinta-2); }
  .mini-selos span.tem { border: 1.5px solid var(--cacau); background: var(--cacau); color: var(--led); }
  .mini-selos .ic { width: 15px; height: 15px; }
  /* balcão: onde a atendente está e a nota da compra */
  .onde { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
  .onde select { min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--linha); background: #fff; font: 600 15px var(--texto); color: var(--tinta); }
  .nota-linha { display: flex; gap: 8px; margin-top: 10px; }
  .nota-linha input { flex: 1; min-width: 0; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--linha); background: #fff; font: 500 15px var(--texto); }
  .nota-linha input:focus { outline: none; border-color: var(--massa); }
  .nota-info { font-size: 13px; color: var(--tinta-2); margin: 6px 0 0; min-height: 18px; }
  .nota-info.boa { color: #2f6b3a; font-weight: 600; } .nota-info.ruim { color: #b3261e; font-weight: 600; }
  .tag-balcao { font: 500 10px/1 var(--rotulo); letter-spacing: .1em; text-transform: uppercase; background: var(--cacau); color: var(--led); padding: 3px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
  dialog.leitor { width: min(480px, 100%); padding: 0; border: 0; border-radius: 24px; background: #120b08; color: var(--creme); }
  dialog.leitor::backdrop { background: rgba(20,12,9,.7); }
  .leitor-topo { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
  .leitor-topo b { font: 400 20px var(--display); }
  .leitor video { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
  .leitor p { margin: 0; padding: 14px 16px 18px; font-size: 14px; color: var(--creme-2); }

  /* folha de etiquetas para imprimir */
  #etiquetas { display: none; }
  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; }
    .casca, .toast, dialog { display: none !important; }
    #etiquetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
    .etq { break-inside: avoid; display: grid; grid-template-columns: 26mm 1fr; gap: 3mm; align-items: center; padding: 3mm; border: .3mm dashed #999; border-radius: 3mm; font-family: var(--texto); color: #2a1913; }
    .etq svg { width: 26mm; height: 26mm; }
    .etq b { font: 400 13pt/1 var(--display); display: block; }
    .etq span { font-size: 7.5pt; display: block; margin: 1mm 0; }
    .etq code { font: 500 12pt var(--rotulo); letter-spacing: .12em; }
    /* cartaz: duas metades de A4 (A5), para cortar */
    #etiquetas.modo-cartaz { grid-template-columns: 1fr; gap: 0; }
    .cartaz { break-inside: avoid; height: 136mm; box-sizing: border-box; padding: 9mm 14mm; border-bottom: .3mm dashed #bbb; display: grid; grid-template-columns: 1fr 58mm; grid-template-rows: auto auto auto auto auto; align-content: center; column-gap: 12mm; background: #2a1913; color: #f3e6d3; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: var(--texto); }
    .cartaz img { width: 40mm; }
    .cartaz .c-rotulo { font: 500 9pt var(--rotulo); letter-spacing: .2em; text-transform: uppercase; color: #ffe9b8; margin: 5mm 0 1mm; }
    .cartaz h3 { font: 400 33pt/1.02 var(--display); margin: 0 0 6mm; }
    .cartaz .c-qr { grid-column: 2; grid-row: 1 / 5; align-self: center; background: #fff; padding: 3mm; border-radius: 3mm; }
    .cartaz .c-qr svg { width: 52mm; height: 52mm; display: block; }
    .cartaz ol { margin: 0; padding-left: 5mm; font-size: 13pt; line-height: 1.55; }
    .cartaz ol b { color: #ffe9b8; }
    .cartaz .c-pe { grid-column: 1 / -1; font-size: 10pt; color: #d9c7b0; margin: 8mm 0 0; padding-top: 4mm; border-top: .5mm solid #ffe9b8; }
  }

  @media (max-width: 900px) {
    .casca { grid-template-columns: 1fr; }
    .lado { position: sticky; top: 0; z-index: 5; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; }
    .marca { padding: 0 8px 0 0; }
    .marca div, .lado-pe { display: none; }
    .menu { display: flex; gap: 2px; }
    .menu a { padding: 10px 12px; white-space: nowrap; font-size: 14px; }
    .menu a[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: 2px; width: auto; height: 3px; }
    .conteudo { padding: 22px 16px 60px; }
    .g4 { grid-template-columns: 1fr 1fr; }
    .g2, .g-3-2 { grid-template-columns: 1fr; }
    .barra-linha { grid-template-columns: 120px 1fr 36px; }
    .esconde-cel { display: none; }
    .lote { grid-template-columns: 1fr auto; }
    .btn-peq { min-height: 44px; padding: 8px 14px; }
    .linha-premio { grid-template-columns: 1fr 96px !important; }
    .linha-premio .campo:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
    .lote .barra { grid-column: 1 / -1; }
    h1 { font-size: 30px; }
  }
</style>
</head>
<body>
<div class="casca">
  <aside class="lado">
    <div class="marca">
      <img src="../icones/apple-adm-180.png" alt="Gliki Sô">
      <div><b>Glikilovers</b><small>Painel da Melissa</small></div>
    </div>
    <nav class="menu" id="menu" aria-label="Painel"></nav>
    <div class="lado-pe">
      <span id="ladoModo">Protótipo com dados de exemplo.</span>
      <a href="#" id="sairPainel" hidden>Sair do painel</a>
      <a href="#" data-instalar>Instalar o painel no celular</a>
      <a href="../clube/" target="_blank" rel="noopener">Abrir o clube (cliente)</a>
      <a href="../" target="_blank" rel="noopener">Página de links</a>
    </div>
  </aside>
  <main class="conteudo" id="conteudo"></main>
</div>
<dialog class="ficha" id="ficha"><div class="ficha-corpo" id="fichaCorpo"></div></dialog>
<dialog class="leitor" id="leitor" aria-label="Ler a nota com a câmera">
  <div class="leitor-topo"><b>Ler a nota</b><button class="fechar" type="button" id="leitorFechar" aria-label="Fechar" style="color:var(--creme)"></button></div>
  <video id="leitorVideo" playsinline muted></video>
  <p id="leitorTexto">Aponte para o QR no pé da nota.</p>
</dialog>
<div id="etiquetas" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="../comum/nuvem.js"></script>
<script src="../comum/dados.js"></script>
<script src="../comum/icones.js"></script>
<script src="../comum/app.js"></script>
<script src="../comum/tema.js" data-so="dados"></script>
<script>
const $ = (id) => document.getElementById(id);
const C = window.Clube;
const I = window.ICONE;
const DIA = 86400000;
const LINK_CLUBE = new URL("../clube/", location.href).href;
const PAGINAS = {
  inicio: { nome: "Início", icone: I.grafico, tela: telaInicio },
  clientes: { nome: "Clientes", icone: I.grupo, tela: telaClientes },
  balcao: { nome: "Balcão", icone: I.loja, tela: telaBalcao },
  codigos: { nome: "Etiquetas", icone: I.ticket, tela: telaCodigos },

/* câmera para ler a nota no balcão (no Android lê direto; no iPhone usa o jsQR) */
const Leitor = { ativo: false, stream: null, det: null, tela: document.createElement("canvas") };
function carregarJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((ok, falha) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = falha; document.head.appendChild(s); });
}
async function lerComCamera(destino) {
  const dlg = $("leitor");
  if (!dlg.open) dlg.showModal();
  $("leitorTexto").textContent = "Aponte para o QR no pé da nota.";
  Leitor.ativo = true;
  try {
    if ("BarcodeDetector" in window && !Leitor.det) { try { Leitor.det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) {} }
    if (!Leitor.det) await carregarJsQR();
    Leitor.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    if (!Leitor.ativo) return pararLeitor();
    const v = $("leitorVideo");
    v.srcObject = Leitor.stream;
    await v.play();
    const laco = async () => {
      if (!Leitor.ativo) return;
      let t = null;
      try {
        if (v.readyState >= 2 && v.videoWidth) {
          if (Leitor.det) { const r = await Leitor.det.detect(v); t = r[0] ? r[0].rawValue : null; }
          else if (window.jsQR) {
            const lado = Math.min(v.videoWidth, v.videoHeight), sai = Math.min(lado, 800), c = Leitor.tela;
            c.width = c.height = sai;
            const g = c.getContext("2d", { willReadFrequently: true });
            g.drawImage(v, (v.videoWidth - lado) / 2, (v.videoHeight - lado) / 2, lado, lado, 0, 0, sai, sai);
            const q = window.jsQR(g.getImageData(0, 0, sai, sai).data, sai, sai, { inversionAttempts: "attemptBoth" });
            t = q ? q.data : null;
          }
        }
      } catch (e) {}
      if (t && C.analisarNota(t)) { if (navigator.vibrate) navigator.vibrate(30); destino(t); return fecharLeitor(); }
      if (t) $("leitorTexto").textContent = "Esse QR não é de nota fiscal. Aponte para o QR da nota.";
      setTimeout(laco, 160);
    };
    laco();
  } catch (e) {
    $("leitorTexto").textContent = "Não consegui abrir a câmera. Libere a câmera para o painel ou digite os 44 números da nota.";
  }
}
function pararLeitor() { if (Leitor.stream) Leitor.stream.getTracks().forEach((t) => t.stop()); Leitor.stream = null; $("leitorVideo").srcObject = null; }
function fecharLeitor() { Leitor.ativo = false; pararLeitor(); if ($("leitor").open) $("leitor").close(); }

function achar(d, q) {
  const t = q.trim().toUpperCase();
  return C.membro(d, t) || C.membro(d, t.replace("GLIKI:", "")) || C.porWhats(d, q) || d.membros.find((m) => m.nome.toLowerCase().includes(q.trim().toLowerCase()) && q.trim().length > 1);
}

/* ---------- o que cada tela faz ---------- */
const ligar = {
  tema() {
    document.querySelectorAll("[data-usar-tema]").forEach((b) => b.addEventListener("click", async () => {
      if (C.nuvem) { const r = await C.salvarTema(b.dataset.usarTema); if (r && r.ok === false) return toast(r.erro || "Não deu para trocar agora"); }
      else { try { localStorage.setItem("glk_tema", b.dataset.usarTema); } catch (e) {} }
      const c = TEMA_CARTOES.find((x) => x.id === b.dataset.usarTema);
      toast("Tema do site: " + c.nome);
      ir("tema");
    }));
  },
  inicio(d) {
    document.querySelectorAll("[data-publico]").forEach((a) => a.addEventListener("click", () => { publicoEscolhido = a.dataset.publico; }));
    const sug = C.sugestoes(d);
    document.querySelectorAll("[data-sug]").forEach((b) => b.addEventListener("click", async () => {
      const x = sug[Number(b.dataset.sug)];
      if (x.tipo === "dobro") { await C.ligarDobro(x.canal); toast(`Pontos em dobro em ${C.NOME_SELO[x.canal]} até o fim do mês`); return ir("inicio"); }
      if (x.tipo === "dobro-ligado") { await C.ligarDobro(null); toast("Pontos em dobro desligados"); return ir("inicio"); }
      publicoEscolhido = x.publico; modeloPendente = x.modelo; location.hash = "avisos";
    }));
  },
  clientes(d) {
    linhasClientes(d);
    $("buscar").addEventListener("input", (e) => { filtro = e.target.value; linhasClientes(C.ler()); });
    $("baixar").addEventListener("click", (e) => {
      e.preventDefault();
      const linhas = [["Nome", "WhatsApp", "Cidade", "Aniversário", "Pontos", "Desde"], ...d.membros.map((m) => [m.nome, m.whats, m.cidade || "", m.niver || "", m.pontos, C.dataBR(m.desde)])];
      const csv = "﻿" + linhas.map((l) => l.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\n");
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "clube-glikilovers.csv" });
      a.click();
    });
  },
  balcao() {
    $("balcaoAqui").addEventListener("change", (e) => { try { localStorage.setItem("glk_balcao", e.target.value); } catch (er) {} toast("Balcão de " + C.NOME_SELO[e.target.value]); });
    $("formEntregar").addEventListener("submit", (e) => {
      e.preventDefault();
      const cod = e.target.codigo.value;
      const d = C.ler();
      const r = d.resgates.find((x) => x.codigo === C.limpaCodigo(cod));
      const caixa = $("resEntregar");
      if (!r) { caixa.innerHTML = `<div class="resultado erro">Esse código de prêmio não existe. Confira as letras.</div>`; return; }
      const m = C.membro(d, r.membro);
      if (r.entregue) { caixa.innerHTML = `<div class="resultado erro">Já entregue em ${C.dataHoraBR(r.entregue)} para ${m.nome}</div>`; return; }
      caixa.innerHTML = `<div class="resultado"><b>${r.nome}</b> para <b>${m.nome}</b><br><small>Trocado em ${C.dataBR(r.data)} por ${r.pontos} pontos</small><div style="margin-top:12px"><button class="btn btn-escuro" id="okEntregar">${I.check}Entregar agora</button></div></div>`;
      $("okEntregar").addEventListener("click", async () => {
        $("okEntregar").disabled = true;
        const x = await C.entregar(r.codigo);
        if (!x.ok) { caixa.innerHTML = `<div class="resultado erro">${x.erro}</div>`; return; }
        toast(`${r.nome} entregue para ${primeiro(m.nome)}`); ir("balcao");
      });
    });
    $("formSomar").addEventListener("submit", (e) => {
      e.preventDefault();
      const d = C.ler();
      const m = achar(d, e.target.quem.value);
      const caixa = $("resSomar");
      if (!m) { caixa.innerHTML = `<div class="resultado erro">Não achei ninguém. Peça o WhatsApp ou o número do QR.</div>`; return; }
      caixa.innerHTML = `<div class="resultado ok"><span class="pessoa"><span class="ini">${iniciais(m.nome)}</span><span>${m.nome}<br><small>${m.pontos} pontos · ${m.cidade}</small></span></span><div style="margin-top:12px"><button class="btn btn-escuro" id="abrirFicha">Somar cookies</button></div></div>`;
      $("abrirFicha").addEventListener("click", () => abrirFicha(m.id));
    });
  },
  codigos() {
    $("imprimirCartaz").addEventListener("click", imprimirCartaz);
    $("formLote").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const qtd = Math.max(1, Math.min(600, Number(f.qtd.value) || 0));
      const pontos = Math.max(1, Number(f.pontos.value) || 10);
      const r = await C.gerarLote(qtd, f.canal.value, pontos);
      if (!r || !r.codigos) return toast((r && r.erro) || "Não deu para gerar agora");
      toast(`${qtd} etiquetas geradas para ${C.CANAIS[f.canal.value]}`);
      ir("codigos");
      imprimir(r.codigos, pontos);
    });
  },
  avisos() {
    const f = $("formAviso");
    const prev = () => {
      $("prevTitulo").textContent = f.titulo.value || "Título do aviso";
      $("prevTexto").textContent = f.texto.value || "A mensagem aparece aqui.";
      const n = C.publico(C.ler(), f.publico.value).length;
      $("enviarAviso").innerHTML = `${I.megafone}Enviar para ${n} ${n === 1 ? "pessoa" : "pessoas"}`;
    };
    f.addEventListener("input", prev);
    f.querySelectorAll("[data-modelo]").forEach((b) => b.addEventListener("click", () => {
      const m = MODELOS[Number(b.dataset.modelo)];
      f.titulo.value = m[1]; f.texto.value = m[2]; prev();
    }));
    if (modeloPendente) { f.titulo.value = modeloPendente[0]; f.texto.value = modeloPendente[1]; modeloPendente = null; }
    prev();
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!f.titulo.value.trim() || !f.texto.value.trim()) { toast("Escreva o título e a mensagem"); return; }
      publicoEscolhido = f.publico.value;
      const a = await C.avisar(f.titulo.value.trim(), f.texto.value.trim(), f.publico.value);
      if (!a || a.ok === false) return toast((a && a.erro) || "Não deu para enviar agora");
      toast(`Aviso enviado para ${a.alcance} pessoas`);
      ir("avisos");
    });
  },
  premios(d) {
    $("formRegras").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const x = C.ler();
      const premios = x.premios.map((p, i) => ({ ...p, faixa: f["faixa" + i].value.trim() || p.faixa, nome: f["nome" + i].value.trim() || p.nome, pontos: Math.max(1, Number(f["pontos" + i].value) || p.pontos) }));
      const regras = {};
      ["pontosPorNota", "notasPorDia", "pontosPorCookie", "validadeMeses", "bonusCadastro", "bonusIndicacao", "bonusSequencia"].forEach((k) => { regras[k] = Math.max(0, Number(f[k].value) || 0); });
      regras.presenteAniversario = f.presenteAniversario.value.trim() || x.regras.presenteAniversario;
      regras.premioPassaporte = f.premioPassaporte.value.trim() || x.regras.premioPassaporte;
      const r = await C.salvarRegras(regras, premios);
      if (r && r.ok === false) return toast(r.erro || "Não deu para salvar agora");
      if ((C.dobroAtivo(C.ler()) || "") !== f.dobro.value) await C.ligarDobro(f.dobro.value || null);
      toast("Prêmios e regras salvos");
      ir("premios");
    });
    $("zerar").hidden = C.nuvem;
    $("zerar").addEventListener("click", () => { C.zerar(); C.ler(); toast("Dados de exemplo de volta"); ir("inicio"); });
  }
};

      <form id="formLogin" novalidate>
        <label class="campo">E-mail<input name="email" type="email" autocomplete="username" required></label>
        <label class="campo">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
        <p class="nota-info ruim" id="erroLogin" role="alert"></p>
        <button class="btn btn-escuro" type="submit" style="width:100%">Entrar</button>
      </form>
    </div>`;
  $("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, b = f.querySelector("button");
    b.disabled = true; b.textContent = "Entrando…";
    const r = await C.Sessao.entrar(f.email.value.trim(), f.senha.value);
    if (!r.ok) { b.disabled = false; b.textContent = "Entrar"; $("erroLogin").textContent = r.erro; return; }
    abrirPainel();
  });
}
async function abrirPainel() {
  try { await C.iniciar({ painel: true }); }
  catch (e) {
    if (e.sessao || e.status === 401) return pedirLogin("Entre de novo no painel.");
    if (/dona/.test(e.message)) { C.Sessao.sair(); return pedirLogin("Esta conta não é a dona do clube. Entre com o login da Gliki."); }
    $("conteudo").innerHTML = `<div class="caixa"><h2>Sem conexão agora</h2><p class="sub">${e.message}</p><button class="btn btn-escuro" type="button" id="tentar">Tentar de novo</button></div>`;
    $("tentar").addEventListener("click", abrirPainel);
    return;
  }
  $("ladoModo").textContent = "Clube de verdade · " + ((C.Sessao.ler() || {}).email || "");
  $("sairPainel").hidden = false;
  ir(location.hash.slice(1) || "inicio");
}
$("sairPainel").addEventListener("click", (e) => { e.preventDefault(); C.Sessao.sair(); pedirLogin("Você saiu do painel."); });
/* de minuto em minuto (e ao voltar para a aba) busca o que mudou, sem atrapalhar quem está digitando */
async function atualizar() {
  if (!C.nuvem || !C.Sessao.ler() || document.visibilityState !== "visible") return;
  if (document.querySelector("dialog[open]") || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) return;
  try { await C.recarregar(); ir(pagina); } catch (e) {}
}
if (C.nuvem) {
  setInterval(atualizar, 60000);
  document.addEventListener("visibilitychange", atualizar);
  C.Sessao.ler() ? abrirPainel() : pedirLogin();
} else {
  ir(location.hash.slice(1) || "inicio");
}
</script>
